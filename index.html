function unitFrom(o,keepSerial){return {id:uid(),etichetta:'',collegato:keepSerial?o.collegato||'':'',batt_stato:o.batt_stato||'',man_on:o.man_on||'',man_charge:o.man_charge||'',stato:o.stato||'',condizione:o.condizione||'',scatola:o.scatola||'',seriale:keepSerial?o.seriale||'':'',luogo:o.luogo||'',acq_prezzo:keepSerial?o.acq_prezzo||'':'',note:''}}
function syncUnits(d){if(!hasUnits(d))return;d.quantita=d.esemplari.length;const ls=[...new Set(d.esemplari.map(u=>u.luogo||''))];if(ls.length===1&&ls[0]&&ls[0]!==(d.luogo||''))setLuogo(d,ls[0])}
function unitsHTML(d){
  if(d.wish)return '';
  if(!hasUnits(d))return `<div class="sec-t">Esemplari</div><p class="note" style="margin-bottom:8px">Hai più pezzi identici ma diversi tra loro (uno funziona, uno no; uno con la scatola…)? Registra i dati di ogni singolo esemplare: i dati del modello restano in comune.</p><button class="btn sm sec" data-unit-new>＋ ${+d.quantita>1?`Dividi in ${+d.quantita} esemplari`:'Aggiungi un secondo esemplare'}</button>`;
  return `<div class="sec-t">Esemplari (${d.esemplari.length}) · ${esc(unitsSummary(d))}</div><div class="log">${d.esemplari.map((u,i)=>{const sn=u.seriale?decodeSerial(u.seriale,d.anno):null;
    return `<button class="li" data-unit="${u.id}"><span class="ld">#${i+1}</span><span class="lb"><b>${esc(u.etichetta||u.stato||'Esemplare '+(i+1))}</b><span>${esc([u.etichetta?u.stato:'',u.scatola?'scatola: '+u.scatola:'',u.luogo?'📍 '+u.luogo:'',u.collegato?'🔗 '+((devices.find(x=>x.id===u.collegato)||{}).nome||'?'):'',u.batt_stato?'🔋 '+u.batt_stato:'',u.acq_prezzo?'€ '+u.acq_prezzo:''].filter(Boolean).join(' · '))}</span>${u.seriale?`<small>SN ${esc(u.seriale)}${sn&&sn.quando?' · '+esc(sn.quando):''}</small>`:''}${u.condizione||u.note?`<small>${esc([u.condizione,u.note].filter(Boolean).join(' — '))}</small>`:''}</span></button>`}).join('')}</div><button class="btn sm sec" data-unit-add style="margin-top:8px">＋ Aggiungi esemplare</button>`;
}
async function startUnits(d){
  const n=Math.max(parseInt(d.quantita,10)||1,1);
  d.esemplari=Array.from({length:n},(_,i)=>unitFrom(d,i===0));delete d.collegato;
  if(n>1){syncUnits(d);await saveDev(d);render();toast(`${n} esemplari creati: ora completa i dati di ognuno`,3500);return openDetail(d.id,true)}
  syncUnits(d);openUnit(d,null,true);
}

      await saveDev(c);d.esemplari=d.esemplari.filter(x=>x!==u);await done('Separato in un nuovo oggetto')};

}
async function mergeAsUnits(L){
  const main=L[0],others=L.slice(1);
  if(!await ask(`Unire ${L.length} oggetti in «${main.nome}» con ${L.length} esemplari? I dati del modello sono quelli di «${main.nome}»; di ogni oggetto restano stato, estetica, scatola, seriale, luogo, prezzo e note. Foto, allegati e interventi vengono riuniti.`,'Unisci'))return false;
  const snap=[...L,...devices.filter(x=>L.slice(1).some(o=>o.id===x.collegato))].map(x=>JSON.parse(JSON.stringify(x)));
  const units=d=>hasUnits(d)?d.esemplari:[Object.assign(unitFrom(d,true),{note:d.note&&d!==main?d.note:''})];
  main.esemplari=L.flatMap(units);delete main.collegato;
  for(const o of others){main.foto=[...new Set([...(main.foto||[]),...(o.foto||[])])];if(!main.thumb&&o.thumb)main.thumb=o.thumb;
    if(o.allegati)main.allegati=[...(main.allegati||[]),...o.allegati];if(o.interventi)main.interventi=[...(main.interventi||[]),...o.interventi];
    if(o.tags)main.tags=[...new Set([...(main.tags||[]),...o.tags])];
    for(const a of devices.filter(x=>x.collegato===o.id)){a.collegato=main.id;await saveDev(a)}
    await DB.del(o.id);markDeleted(o.id)}
  devices=devices.filter(x=>!others.includes(x));syncUnits(main);await saveDev(main);render();
  toast(`Uniti in «${main.nome}» (${main.esemplari.length} esemplari)`,7000,{label:'ANNULLA',fn:async()=>{for(const o of snap){unmarkDeleted(o.id);o.modificato=Date.now();stamp(o);idx(o);await DB.put(o);const i=devices.findIndex(x=>x.id===o.id);i<0?devices.push(o):devices[i]=o}render();dirty();toast('Annullato')}});
  return true;
}
async function splitItem(d){
  const n=parseInt(d.quantita,10)||1;if(n<2)return;
  if(!await ask(`Dividere «${d.nome}» (×${n}) in ${n} oggetti separati? Poi colleghi ognuno al suo dispositivo, con numero di serie e condizioni propri.`,'Dividi'))return;
  d.quantita=1;await saveDev(d);const list=[d];
  for(let i=1;i<n;i++){const c=cloneOne(d);await saveDev(c);list.push(c)}
  render();goBase(()=>openAssign(list));
}
function openAssign(list){
  const h=`<p style="margin-top:0">Ora ci sono ${list.length} «${esc(list[0].nome)}» separati. Indica a cosa appartiene ciascuno:</p>`+list.map((d,i)=>`<div class="res"><b>${esc(d.nome)} · n. ${i+1}</b><label class="f">Va con</label><select class="in" data-as="${d.id}">${devOpts(d.collegato)}</select><label class="f">Numero di serie (facoltativo, per riconoscerli)</label><input class="in" data-ser="${d.id}" value="${esc(d.seriale||'')}" autocomplete="off"></div>`).join('')+`<button class="btn" id="asv" style="width:100%;margin-top:12px">Salva</button><p class="note">Il luogo dell'accessorio diventa quello del computer a cui lo colleghi. Se l'altro computer non è ancora in collezione, aggiungilo e poi collega l'accessorio da «Modifica».</p>`;
  openPage('A cosa appartengono?',h,{mount(el){$('#asv',el).onclick=async()=>{
    for(const d of list){const v=$(`[data-as="${d.id}"]`,el).value,sr=$(`[data-ser="${d.id}"]`,el).value.trim(),o=devices.find(x=>x.id===v);
      if((d.collegato||'')!==v||(d.seriale||'')!==sr){d.collegato=v;d.seriale=sr;if(o&&o.luogo)setLuogo(d,o.luogo);await saveDev(d)}}
    render();toast('Collegamenti salvati');const f=list.find(x=>x.collegato);goBase(()=>openDetail(f?f.collegato:list[0].id))}}});
}
function openCopyAcc(d){
  const srcs=mainDevices().filter(x=>x.id!==d.id&&devices.some(a=>a.collegato===x.id&&!a.wish));
  if(!srcs.length){toast('Nessun altro dispositivo ha accessori collegati');return}
  let src=(srcs.find(x=>x.linea&&x.linea===d.linea)||srcs[0]).id;
  openPage('Copia accessori',`<p style="margin-top:0">Per due computer con periferiche identiche: ogni periferica resta un oggetto a sé, collegato al suo computer.</p><label class="f">Prendi gli accessori di</label><select class="in" id="cas">${srcs.map(x=>`<option value="${x.id}" ${x.id===src?'selected':''}>${esc(x.nome)}</option>`).join('')}</select><div id="cal" style="margin-top:10px"></div><p class="note"><b>Prendine 1</b>: un accessorio segnato ×2 sull'altro computer, ma uno è di questo. <b>Copia</b>: questo computer ha il suo, identico. <b>Sposta</b>: era registrato sull'altro per errore.</p><button class="btn" id="cago" style="width:100%;margin-top:12px">Collega a «${esc(d.nome)}»</button>`,{mount(el){
    const draw=()=>{const accs=devices.filter(a=>a.collegato===src&&!a.wish);
      $('#cal',el).innerHTML=accs.map(a=>{const q=+a.quantita||1;return `<div class="res"><b>${esc(a.nome)}${q>1?` <span class="qty">×${q}</span>`:''}</b><small>${esc([a.tipologia,a.modello].filter(Boolean).join(' · '))}</small><select class="in" data-ca="${a.id}" style="margin-top:6px">
        ${q>1?`<option value="take" selected>Prendine 1 dei ${q} (era suo)</option>`:''}<option value="copy" ${q>1?'':'selected'}>Copia (ne ha uno uguale)</option><option value="move">Sposta (era suo)</option><option value="skip">Non toccare</option></select></div>`}).join('')};
    draw();$('#cas',el).onchange=e=>{src=e.target.value;draw()};
    $('#cago',el).onclick=async()=>{let n=0;
      for(const s of el.querySelectorAll('[data-ca]')){const a=devices.find(x=>x.id===s.dataset.ca);if(!a||s.value==='skip')continue;
        if(s.value==='move'){a.collegato=d.id;if(d.luogo)setLuogo(a,d.luogo);await saveDev(a)}
        else{if(s.value==='take'){a.quantita=Math.max(1,(+a.quantita||1)-1);await saveDev(a)}await saveDev(cloneOne(a,{collegato:d.id,luogo:d.luogo||a.luogo}))}
        n++}
      render();toast(n?`${n} accessori collegati a «${d.nome}»`:'Nessun accessorio scelto');if(n)goBase(()=>openDetail(d.id))};
  }});
}
/* ===== foto e file condivisi da altre app (Condividi → RDDC) ===== */
const isHeic=f=>/hei[cf]/i.test(f.type||'')||/\.hei[cf]$/i.test(f.name||'');
const HEIC_MSG='Foto HEIC: conversione non riuscita (la prima volta serve internet per scaricare il convertitore). In alternativa, nella Fotocamera Samsung disattiva «Immagini ad alta efficienza».';
const isImgFile=f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|avif|bmp|hei[cf])$/i.test(f.name||'');
async function readShared(){
  const c=await caches.open('rddc-share'),out=[];let meta={};
  for(const k of await c.keys()){const r=await c.match(k);if(/\/meta$/.test(k.url)){try{meta=await r.json()}catch(e){}continue}
    const b=await r.blob();out.push(new File([b],decodeURIComponent(r.headers.get('x-name')||'file'),{type:b.type||r.headers.get('content-type')||''}))}
  await caches.delete('rddc-share');return {files:out,meta};
}
async function sharedToData(files){
  const foto=[],allegati=[];let thumb='',skip=0;
  for(const f of files){
    if(isImgFile(f)){try{foto.push(await shrink(f,1200));if(!thumb)thumb=await shrink(f,180,.75);continue}catch(e){}}
    if(f.size>ATT_MAX){skip++;continue}
    allegati.push({id:uid(),nome:f.name||'file',mime:f.type||'application/octet-stream',size:f.size,data:await blobToDataURL(f),t:today()});
  }
  if(skip)toast(`${skip} file troppo grandi (max 15 MB) non aggiunti`,4000);
  return {foto,thumb,allegati};
}
function openShared({files,meta}){
  const lk=[meta.url,meta.text,meta.title].filter(Boolean).join(' ').match(/https?:\/\/\S+/);
  if(files.length&&lk&&files.every(isImgFile))return openListing(lk[0],[meta.title,meta.text].filter(Boolean).join(' '),{shots:files});
  if(!files.length&&lk)return openListing(lk[0],[meta.title,meta.text].filter(Boolean).join(' '));
  const imgs=files.filter(isImgFile),others=files.filter(f=>!isImgFile(f)),urls=[];
  const link=[meta.url,meta.text].filter(Boolean).join(' ').match(/https?:\/\/\S+/);
  const h=`${imgs.length?`<div class="phgrid" style="margin-bottom:10px">${imgs.map(f=>{if(isHeic(f))return `<div class="pht" style="display:grid;place-items:center;font-size:12px;color:#555">🖼️ HEIC</div>`;const u=URL.createObjectURL(f);urls.push(u);return `<div class="pht"><img src="${u}" alt=""></div>`}).join('')}</div>`:''}
    ${others.length?`<div class="log" style="margin-bottom:10px">${others.map(f=>`<div class="att"><span class="ai">${isHeic(f)?'🖼️':attIcon({mime:f.type})}</span><span class="an"><b>${esc(f.name)}</b><small>${isHeic(f)?'HEIC: diventa un allegato':esc(f.type||'file')+' · '+fmtSize(f.size)}</small></span></div>`).join('')}</div>`:''}
    ${!files.length&&link?`<p class="note">Ricevuto un link: ${esc(link[0])}</p>`:''}
    ${files.length?`<p style="margin:4px 0 8px">${imgs.length?`${imgs.length} foto`:''}${imgs.length&&others.length?' e ':''}${others.length?`${others.length} ${others.length===1?'file (allegato)':'file (allegati)'}`:''}: dove li metto?</p>
    <button class="btn" data-sh="new" style="width:100%">➕ Nuovo oggetto</button>
    ${imgs.length&&!others.length?'<button class="btn sec" data-sh="ann" style="width:100%;margin-top:8px">🏷️ È lo screenshot di un annuncio: leggi il testo</button>':''}
    <label class="f" style="margin-top:14px">…oppure aggiungili a un oggetto esistente</label><input class="in" id="shq" placeholder="Cerca per nome, modello…" autocomplete="off"><div id="shl"></div>`:''}`;
  openPage('Ricevuto da un\'altra app',h,{mount(el){
    el._close=()=>urls.forEach(u=>URL.revokeObjectURL(u));
    const list=()=>{const q=($('#shq',el)||{value:''}).value.trim().toLowerCase();const r=devices.filter(d=>!q||q.split(/\s+/).every(w=>d._i.includes(w))).sort((a,b)=>(b.modificato||0)-(a.modificato||0)).slice(0,30);
      const l=$('#shl',el);if(l)l.innerHTML=r.map(d=>`<button class="res" data-sh="${d.id}"><b>${esc(d.nome)}</b><small>${esc([d.marca,d.anno,d.wish?'wishlist':d.luogo].filter(Boolean).join(' · '))}</small></button>`).join('')||'<p class="note">Nessun oggetto trovato</p>'};
    list();const q=$('#shq',el);if(q)q.oninput=list;
    el.addEventListener('click',async e=>{const b=e.target.closest('[data-sh]');if(!b)return;
      if(b.dataset.sh==='ann')return openListing(lk?lk[0]:'',[meta.title,meta.text].filter(Boolean).join(' '),{shots:imgs});
      b.disabled=true;toast('Preparo le foto…');
      const {foto,thumb,allegati}=await sharedToData(files);
      if(b.dataset.sh==='new'){openForm({foto,thumb,allegati,tipologia:'',marca:''},{fromLookup:true});return}
      const d=devices.find(x=>x.id===b.dataset.sh);if(!d)return;
      d.foto=[...(d.foto||[]),...foto];if(!d.thumb&&thumb)d.thumb=thumb;if(allegati.length)d.allegati=[...(d.allegati||[]),...allegati];
      await saveDev(d);render();toast(`Aggiunti a «${d.nome}»`);goBase(()=>openDetail(d.id))});
  }});
}

function collSeries(){

  let c=0;const spent=buy.map(b=>({t:b.t,v:c+=b.v}));

const ATT_MAX=15*1024*1024;
const fmtSize=n=>!n?'':n<1024*1024?Math.max(1,Math.round(n/1024))+' kB':(n/1048576).toLocaleString('it',{maximumFractionDigits:1})+' MB';
const attIcon=a=>/pdf/.test(a.mime)?'📄':/^image/.test(a.mime)?'🖼️':/^video/.test(a.mime)?'🎬':/^audio/.test(a.mime)?'🎵':/zip|compress/.test(a.mime)?'🗜️':'📎';
const attKind=a=>/pdf/.test(a.mime)?'PDF':/^image/.test(a.mime)?'Immagine':/^video/.test(a.mime)?'Video':/^audio/.test(a.mime)?'Audio':((a.nome.match(/\.(\w{1,5})$/)||[])[1]||'File').toUpperCase();
function attHTML(d){const as=d.allegati||[];
  return `<div class="sec-t">Allegati${as.length?` (${as.length})`:''}</div>${as.length?`<div class="log">${as.map(a=>`<div class="att"><span class="ai">${attIcon(a)}</span><button class="an" data-att="${a.id}"><b>${esc(a.nome)}</b><small>${[attKind(a),fmtSize(a.size),fmtD(a.t)].filter(Boolean).join(' · ')}</small></button><button class="ab" data-attdl="${a.id}" aria-label="Scarica">⬇︎</button><button class="ab" data-attdel="${a.id}" aria-label="Elimina">✕</button></div>`).join('')}</div>`:''}<button class="btn sm sec" data-addatt style="margin-top:8px">📎 Aggiungi allegato</button><input type="file" id="attf" multiple hidden>`}
async function addAttachments(d,files){
  let n=0;d.allegati=d.allegati||[];
  for(const f of files){
    if(f.size>ATT_MAX){toast(`«${f.name}» è troppo grande (max 15 MB)`,4000);continue}
    let data,mime=f.type||'application/octet-stream',size=f.size;
    if(/^image\/(jpeg|png|webp)$/.test(mime)&&f.size>600*1024){try{data=await shrink(f,2000,.86);mime='image/jpeg';size=Math.round(data.length*.75)}catch(e){}}
    if(!data)data=await blobToDataURL(f);
    d.allegati.push({id:uid(),nome:f.name||'allegato',mime,size,data,t:today()});n++;
  }
  if(n){await saveDev(d);render();toast(n===1?'Allegato aggiunto':n+' allegati aggiunti')}
  return n;
}
function remoteURL(p){if(/^(data:|blob:|https?:)/.test(p))return p;if(ghOn()){const c=ghCfg();return `https://raw.githubusercontent.com/${c.repo}/${c.branch}/${p}`}return new URL(p,new URL(dbUrl(),location.href)).href}
async function openAtt(d,id,download){
  const a=(d.allegati||[]).find(x=>x.id===id);if(!a)return;
  let blob;try{blob=await (await fetch(remoteURL(a.data))).blob()}catch(e){toast('Allegato non disponibile offline: collegati a internet');return}
  const url=URL.createObjectURL(new Blob([blob],{type:a.mime}));setTimeout(()=>URL.revokeObjectURL(url),120000);
  if(!download&&/^image/.test(a.mime))return openViewer([url],0);
  if(!download&&/^video/.test(a.mime))return openPage(a.nome,`<video src="${url}" controls playsinline style="width:100%;max-height:72vh;border-radius:12px;background:#000"></video>`);
  const l=document.createElement('a');l.href=url;if(download)l.download=a.nome;else{l.target='_blank';l.rel='noopener'}document.body.append(l);l.click();l.remove();
}

const inStock=p=>kindOf(p.tipologia)==='part'&&!p.wish&&!p.montato_su;
function partsFor(d){
  const parts=devices.filter(inStock),sure=parts.filter(p=>(p.compat||[]).includes(d.id));
  const keys=[d.modello,d.identifier,d.emc&&'EMC '+d.emc].filter(x=>x&&String(x).length>=4).map(x=>String(x).toLowerCase());
  const ramT=(String(d.ram||'').match(/PC\d?-?\d{3,5}|DDR\d?L?/gi)||[]).map(x=>x.toLowerCase());
  const maybe=parts.filter(p=>!sure.includes(p)&&(()=>{const t=(String(p.part_compat||'')+' '+String(p.part_spec||'')).toLowerCase();
    return keys.some(k=>t.includes(k))||(p.part_cat==='RAM'&&ramT.some(r=>t.includes(r)))})());
  return {sure,maybe};
}

  openPage('Monta su…',`<p style="margin-top:0">Su quale computer monti «${esc(p.nome)}»? Registro un intervento nella sua scheda${+p.quantita>1?' e tolgo un pezzo dal magazzino':' e segno il ricambio come montato'}.</p><input class="in" id="mq" placeholder="Cerca…" autocomplete="off"><div id="ml"></div>`,{mount(el){

      (m.interventi=m.interventi||[]).push({id:uid(),data:today(),tipo:/RAM|Disco|Scheda di esp/.test(p.part_cat||'')?'Upgrade':'Sostituzione',desc:`Montato: ${p.nome}${p.part_spec?' ('+p.part_spec+')':''}`});

function listOpts(kind){
  const u=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>String(x).localeCompare(String(y),'it'));
  if(kind==='marche')return u([...MARCHE0,...devices.map(d=>d.marca)]);
  if(kind==='tipi')return u([...TIPI,...devices.map(d=>d.tipologia)]);
  if(kind==='linee')return u(devices.map(d=>d.linea));
  if(kind==='luoghi')return u([...LUOGHI0,...devices.map(d=>d.luogo)]);
  if(kind==='raccolte')return u(['Apple','Console','Server','Televisori','Altro',...devices.map(d=>d.raccolta)]);
  if(kind==='tubi')return u([...TUBI,...devices.map(d=>d.tv_tubo)]);
  if(kind==='audio')return AUDIO;
  if(kind==='connettori')return u([...CONNETTORI,...devices.map(d=>d.acc_connettore)]);
  if(kind==='colori')return u([...COLORI.map(c=>c[0]),...devices.map(d=>d.colore)]);
  return [];
}

    const drawPh=()=>{$('#ph',el).innerHTML=(dropDiag?`<div class="note" style="margin:0 0 8px">${dropDiag}</div>`:'')+`<div class="phgrid">${foto.map((f,i)=>`<div class="pht ${i?'':'cov'}" data-pi="${i}"><img src="${f}" alt="" draggable="false">${i?`<button type="button" class="st" data-cov="${i}" aria-label="Usa come copertina" title="Usa come copertina">★</button>`:'<span class="cvb">Copertina</span>'}<button type="button" class="rm" data-rmf="${i}" aria-label="Rimuovi">✕</button></div>`).join('')}<button type="button" class="phadd" data-gal>＋<small>Aggiungi</small></button></div><p class="phhint">${foto.length>1?'Trascina per riordinare (col dito: tieni premuto e sposta) · ★ = copertina · ':''}Puoi anche trascinare qui le foto o incollarle.</p>`};
    const setCover=async()=>{thumb=foto.length?await shrink(foto[0],180,.75):''};
    /* riordino: col mouse si trascina subito, col dito dopo una breve pressione (così la pagina scorre normalmente) */
    let drag=null;
    const startDrag=(tile,e)=>{const r=tile.getBoundingClientRect(),g=tile.cloneNode(true);g.classList.add('ghost');Object.assign(g.style,{width:r.width+'px',height:r.height+'px',left:r.left+'px',top:r.top+'px'});document.body.append(g);
      tile.classList.add('dragging');drag={tile,g,dx:e.clientX-r.left,dy:e.clientY-r.top,on:true};try{navigator.vibrate&&navigator.vibrate(10)}catch(er){}};

    const onUp=async()=>{if(!drag)return;const d0=drag;drag=null;if(d0.pending){clearTimeout(d0.pending.t);return}

      const imgs=got.filter(f=>/^image\//.test(f.type)||(!f.type&&(/\.(jpe?g|png|webp|gif|avif|bmp|hei[cf])$/i.test(f.name||'')||f.size>0)));

function loadHeic(){if(HEIC_LIB)return HEIC_LIB;HEIC_LIB=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';sc.onload=()=>window.heic2any?res(window.heic2any):rej(new Error('libreria'));sc.onerror=()=>{HEIC_LIB=null;rej(new Error('rete'))};document.head.append(sc)});return HEIC_LIB}
async function heicToJpeg(b){const lib=await loadHeic();toast('Converto la foto HEIC…',4000);const r=await lib({blob:b,toType:'image/jpeg',quality:.9});return Array.isArray(r)?r[0]:r}
async function shrink(src,max,q=.82){
  if(src instanceof Blob&&isHeic(src))src=await heicToJpeg(src);
  const bmp=await createImageBitmap(src instanceof Blob?src:await (await fetch(src)).blob());
  const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}

function proxyUrl(p,url){const e=encodeURIComponent(url);if(p.includes('{url}'))return p.replace('{url}',e);if(/[=?/]$/.test(p)&&/[?=]/.test(p))return p+e;return p.replace(/\/?$/,'/?url=')+e}
const WORKER_CODE=`export default {
  async fetch(req) {
    const u = new URL(req.url).searchParams.get('url') || '';
    const h = {'Access-Control-Allow-Origin': '*'};
    if (!/^https:\\/\\/(www\\.)?everymac\\.com\\//.test(u)) return new Response('Solo everymac.com', {status: 403, headers: h});
    const r = await fetch(u, {headers: {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36', 'Accept-Language': 'en-US,en'}, cf: {cacheTtl: 86400}});
    return new Response(r.body, {status: r.status, headers: {...h, 'Content-Type': r.headers.get('Content-Type') || 'text/html', 'Cache-Control': 'public, max-age=86400'}});
  }
}`;
function proxies(){
  const mine=(LS.get('rd_proxy','')||'').trim();
  const list=['https://corsproxy.io/?url={url}','https://api.allorigins.win/raw?url={url}','https://api.codetabs.com/v1/proxy?quest={url}'];
  return mine?[mine,...list]:list;
}
async function viaProxy(url,blob){
  let last;
  for(const p of proxies()){
    try{
      const u=proxyUrl(p,url);
      const r=await fetch(u,{signal:AbortSignal.timeout(20000)});
      if(!r.ok)throw new Error('HTTP '+r.status);
      if(blob)return await r.blob();
      const t=await r.text();
      if(/cf-challenge|challenge-platform|Just a moment\.\.\.|cf-browser-verification/i.test(t)&&!/Introduction Date|specs\.html/i.test(t))throw new Error('bloccato da Cloudflare');
      return t;
    }catch(e){last=e}
  }
  throw last||new Error('proxy');
}
async function fetchBlob(url){
  try{const r=await fetch(url,{signal:AbortSignal.timeout(15000)});if(r.ok)return await r.blob()}catch(e){}
  return viaProxy(url,true);
}

  s=s.replace(/<ref[^>]*\/>/g,'').replace(/<ref[\s\S]*?<\/ref>/g,'').replace(/<!--[\s\S]*?-->/g,'')
   .replace(/<br\s*\/?>/gi,', ').replace(/<[^>]+>/g,'')
   .replace(/\{\{\s*(?:start date|release date|start-date|dts|date)[^|}]*\|(\d{4})(?:\|(\d{1,2}))?(?:\|(\d{1,2}))?[^}]*\}\}/gi,(m,y,mo,da)=>[y,mo,da].filter(Boolean).join('-'));
  for(let i=0;i<4;i++)s=s.replace(/\{\{(?:nowrap|nobr|small|abbr|convert|cvt|val|ubl|plainlist|flatlist|unbulleted list|hlist)\s*\|([^{}]*)\}\}/gi,(m,a)=>a.split('|').filter(x=>!/^\s*[a-z]+=/.test(x)).join(' ').trim());
  for(let i=0;i<4;i++)s=s.replace(/\{\{[^{}]*\}\}/g,'');
  return clean(s.replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,'$1').replace(/\[https?:\/\/\S+\s+([^\]]+)\]/g,'$1').replace(/'{2,}/g,'').replace(/^[*\s]+/,'').replace(/\s*\*\s*/g,'; '));
}
async function wikiLoad(title,lang,marca){
  const base=`https://${lang}.wikipedia.org/w/api.php`;
  const [a,b]=await Promise.all([
    wjson(`${base}?action=query&prop=extracts|pageimages|info&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=800&inprop=url&titles=${encodeURIComponent(title)}&format=json&origin=*`),
    wjson(`${base}?action=parse&page=${encodeURIComponent(title)}&prop=wikitext&section=0&format=json&origin=*`).catch(()=>null)
  ]);
  const pg=Object.values(a.query.pages)[0];
  const wt=b&&b.parse&&b.parse.wikitext?b.parse.wikitext['*']:'';
  const pairs=[];
  const lines=wt.split('\n');let cur=null;
  for(const ln of lines){
    const m=ln.match(/^\s*\|\s*([\w \-]+?)\s*=\s*(.*)$/);
    if(m){cur=[m[1].toLowerCase().trim(),m[2]];pairs.push(cur)}
    else if(cur&&ln.trim()&&!/^\s*(\}\}|\{\{)/.test(ln)&&!/^\s*\|/.test(ln)&&pairs.length<90)cur[1]+=' '+ln.trim();
    else if(/^\s*\}\}\s*$/.test(ln))cur=null;
  }
  const P={};const specs=[];
  for(const [k,v0] of pairs){const v=wclean(v0);if(!v||/^(image|caption|logo|alt|image_size|imagesize|image_upright|website|footnotes)/.test(k))continue;if(!(k in P)){P[k]=v;specs.push([k.replace(/[_-]/g,' ').replace(/^\w/,c=>c.toUpperCase()),v])}}
  const g=(...ks)=>{for(const k of ks)if(P[k])return P[k];return ''};
  const f={nome:g('name')||pg.title,marca:marca||g('manufacturer','developer','maker')||'',
    intro:g('released','release date','release_date','first release date','introduced','first_release_date','release'),
    discontinued:g('discontinued','last release date'),
    cpu:g('cpu','processor'),ram:g('memory','ram'),storage:g('storage','storage capacity'),
    gpu:g('graphics','gpu','video'),display:g('display','screen'),os_orig:g('os','operating system','operating_system'),
    connettivita:g('connectivity','networking'),batteria:g('battery','power'),dimensioni:g('dimensions'),peso:g('weight','mass'),
    prezzo:g('price','launch price','introductory price'),modello:g('model','model number'),linea:g('family','series','product family','product line'),
    colore:detectColor(g('color','colour','colors','colours'))};
  const my=(f.intro.match(/\b(19[5-9]\d|20[0-3]\d)\b/)||[''])[0];f.anno=my?+my:'';
  f.descrizione=pg.extract?pg.extract.split('\n')[0].slice(0,900):'';
  const ty=g('type','device type').toLowerCase()+' '+(pg.extract||'').slice(0,200).toLowerCase();
  f.tipologia=/television|tv set/.test(ty)?'Televisore CRT':/phone/.test(ty)?'Smartphone':/tablet/.test(ty)?'Tablet':/laptop|notebook/.test(ty)?'Portatile':/console/.test(ty)?'Console':/player|ipod/.test(ty)?'Lettore musicale':/camera/.test(ty)?'Fotocamera':/computer/.test(ty)?'Computer desktop':'';
  Object.keys(f).forEach(k=>{if(f[k]===''||f[k]==null)delete f[k]});
  return {fields:f,specs,imageUrl:pg.thumbnail?pg.thumbnail.source:'',fonte:pg.fullurl||`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(title)}`};
}
async function commonsSearch(q){

function infoboxPairs(wt){
  const pairs=[];let cur=null,inBox=false;
  for(const ln of wt.split('\n')){
    if(/\{\{\s*Infobox/i.test(ln)){inBox=true;continue}
    const m=ln.match(/^\s*\|\s*([\w \-]+?)\s*=\s*(.*)$/);
    if(m){cur=[m[1].toLowerCase().trim(),m[2]];pairs.push(cur)}
    else if(cur&&ln.trim()&&!/^\s*(\}\}|\{\{)/.test(ln)&&!/^\s*\|/.test(ln)&&pairs.length<90)cur[1]+=' '+ln.trim();
    else if(/^\s*\}\}\s*$/.test(ln)){cur=null;inBox=false}
  }
  const P={},specs=[];
  for(const [k,v0] of pairs){const v=wclean(v0);if(!v||/^(image|caption|logo|alt|image_size|imagesize|image_upright|website|footnotes|name)$/.test(k))continue;if(!(k in P)){P[k]=v;specs.push([k.replace(/[_-]/g,' ').replace(/^\w/,c=>c.toUpperCase()),v])}}
  return {P,specs};
}
const wsecLine=s=>clean(String(s||'').replace(/<[^>]+>/g,''));
function secScore(q,line){
  const code=accCode(q),L=line.toLowerCase();let s=0;
  if(code&&L.includes(code.toLowerCase()))s+=3;
  const tk=q.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,' ').split(/\s+/).filter(w=>w.length>1&&!/^(apple|the|di|il|la|con|per|and)$/.test(w)&&w!==code.toLowerCase());
  const n=(q.match(/(?:^|\s)([1-9])(?:st|nd|rd|th|ª|°)?(?=\s|$)/i)||[])[1];
  if(n&&new RegExp('(^|\\D)'+n+'(st|nd|rd|th|ª|°)?\\s*(generation|generazione|gen\\b)','i').test(L))s+=1.5;
  if(tk.length){const hit=tk.filter(w=>new RegExp('(^|[^\\p{L}\\p{N}])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'u').test(L)).length;s+=hit/tk.length*2}
  return s;
}
async function wikiAccSearch(q){

  for(const lang of ['en','it']){
    const base=`https://${lang}.wikipedia.org/w/api.php`;
    // 1) un rinvio con #sezione porta dritto al modello (es. «Apple Pro Mouse» → «Apple pointing devices#Apple Pro Mouse»)
    const rd=await wjson(`${base}?action=query&titles=${encodeURIComponent(q)}&redirects=1&format=json&origin=*`).catch(()=>null);
    const r0=rd&&rd.query&&rd.query.redirects&&rd.query.redirects[0];
    const s=await wjson(`${base}?action=query&list=search&srsearch=${encodeURIComponent(q)}&srlimit=5&srprop=snippet|sectiontitle&format=json&origin=*`).catch(()=>null);
    const titles=[...new Set([r0&&r0.to,...((s&&s.query&&s.query.search)||[]).map(x=>x.title)].filter(Boolean))].slice(0,3);
    const snip=new Map(((s&&s.query&&s.query.search)||[]).map(x=>[x.title,x.snippet.replace(/<[^>]+>/g,'')]));
    const secs=await Promise.all(titles.map(t=>wjson(`${base}?action=parse&page=${encodeURIComponent(t)}&prop=sections&redirects=1&format=json&origin=*`).then(j=>j.parse?j.parse.sections:[]).catch(()=>[])));
    titles.forEach((t,i)=>{
      const S=secs[i].map(x=>({index:x.index,level:+x.level,line:wsecLine(x.line),anchor:x.anchor}));
      const parentOf=j=>{for(let k=j-1;k>=0;k--)if(S[k].level<S[j].level)return S[k].index;return ''};
      const full=(x,j)=>{let p=x.line;for(let k=j-1;k>=0;k--)if(S[k].level<x.level){if(/generation|generazione|model|version|^\d/i.test(x.line))p=S[k].line+' – '+x.line;break}return p};
      let best=null;
      if(r0&&r0.to===t&&r0.tofragment){const j=S.findIndex(x=>x.anchor===r0.tofragment.replace(/ /g,'_')||x.line===r0.tofragment);if(j>=0)best={x:S[j],j,sc:9}}
      if(!best&&S.length>=4)S.forEach((x,j)=>{if(/^(references|see also|external links|notes|bibliografia|note|voci correlate|collegamenti esterni|history|storia)$/i.test(x.line))return;const sc=secScore(q,full(x,j));if(sc>=1.2&&(!best||sc>best.sc))best={x,j,sc}});

const KEEP=['descrizione','colore','colore_hex','luogo','note'];
async function mergeFetched(base,r,overwrite){
  const m=Object.assign({},base);
  for(const [k,v] of Object.entries(r.fields)){ if(v===''||v==null)continue; if(KEEP.includes(k)&&m[k])continue; if(overwrite||m[k]===undefined||m[k]==='')m[k]=v }
  if(r.specs&&r.specs.length){
    const have=new Map((m.specs||[]).map(p=>[p[0],p[1]]));
    r.specs.forEach(([l,v])=>{if(overwrite||!have.has(l))have.set(l,v)});
    m.specs=[...have];
  }
  if(r.fonte)m.fonte=r.fonte;
  if(trOn()&&m.descrizione&&m.descrizione===r.fields.descrizione&&isLongEn(m.descrizione)){
    try{toast('Traduco la descrizione…',8000);const it=await translateText(m.descrizione);m.descrizione_orig=m.descrizione;m.descrizione=it}catch(e){/* riproverà da sola in seguito */}}
  if((r.imageBlob||r.imageUrl)&&!(m.foto&&m.foto.length)){
    try{let b=r.imageBlob;if(!b)for(const u of [r.imageUrl,...(r.imageAlt||[])].filter(Boolean)){try{b=await fetchBlob(u);if(b&&/^image\//.test(b.type||'image/'))break;b=null}catch(_){}}if(!b)throw new Error('foto');m.foto=[await shrink(b,1200)];m.thumb=await shrink(b,180,.75)}catch(e){toast('Dati caricati, ma la foto non è stata scaricata: aggiungila a mano',3600)}
  }
  return m;
}

/* toglie lo sfondo uniforme partendo dai bordi (ottimo per foto prodotto su fondo chiaro) e ritaglia l'oggetto */
async function autoCut(src,tol=14){
  const bmp=await createImageBitmap(src instanceof Blob?src:await (await fetch(src)).blob());
  const k=Math.min(3,760/Math.max(bmp.width,bmp.height)),w=Math.max(1,Math.round(bmp.width*k)),h=Math.max(1,Math.round(bmp.height*k));

  // colore di sfondo: mediana dei pixel del bordo
  const bord=[];for(let i=0;i<w;i+=2){bord.push(i,(h-1)*w+i)}for(let j=0;j<h;j+=2){bord.push(j*w,j*w+w-1)}
  const med=ch=>{const a=bord.map(i=>p[i*4+ch]).sort((m,n)=>m-n);return a[a.length>>1]};const bg=[med(0),med(1),med(2)];
  const dist=q=>Math.hypot(p[q]-bg[0],p[q+1]-bg[1],p[q+2]-bg[2]);
  const mark=new Uint8Array(w*h),st=[];const push=i=>{if(!mark[i]&&p[i*4+3]>0&&dist(i*4)<tol){mark[i]=1;st.push(i)}else if(!mark[i]&&p[i*4+3]===0){mark[i]=1;st.push(i)}};
  for(let i=0;i<w;i++){push(i);push((h-1)*w+i)}for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}
  while(st.length){const i=st.pop(),cx=i%w;if(cx>0)push(i-1);if(cx<w-1)push(i+1);if(i>=w)push(i-w);if(i<w*(h-1))push(i+w)}

  for(let i=0;i<w*h;i++){const q=i*4;if(mark[i]){p[q+3]=0;rem++;continue}
    const cx=i%w,cy=(i/w)|0;
    if((cx>0&&mark[i-1])||(cx<w-1&&mark[i+1])||(i>=w&&mark[i-w])||(i<w*(h-1)&&mark[i+w]))p[q+3]=Math.min(p[q+3],Math.round(255*Math.max(.2,Math.min(1,(dist(q)-tol)/(tol*1.4)))));

}

function museumItems(){return devices.filter(d=>!d.wish&&kindOf(d.tipologia)!=='acc'&&kindOf(d.tipologia)!=='part'&&!['In uso','Ricambi'].includes(d.ruolo)).sort((a,b)=>((a.anno||9999)-(b.anno||9999))||String(a.nome).localeCompare(b.nome,'it'))}
const muByRac=()=>LS.get('rd_mu_by','')==='rac'||(LS.get('rd_mu_by','')===''&&devices.some(d=>d.raccolta));
const roomOf=d=>muByRac()?(d.raccolta||'Altro'):d.anno?Math.floor(d.anno/10)*10+'s':'Senza anno';
/* inclinazione del telefono → rotazione 3D degli oggetti */
const Tilt={n:0,on(){if(this.n++)return;this.h=e=>{if(e.gamma==null)return;const h=document.documentElement;h.classList.add('tilting');
    const ry=Math.max(-14,Math.min(14,e.gamma*.55)),rx=Math.max(-8,Math.min(8,((e.beta||55)-55)*.25));
    cancelAnimationFrame(this.r);this.r=requestAnimationFrame(()=>{h.style.setProperty('--ry',ry.toFixed(1)+'deg');h.style.setProperty('--rx',(-rx).toFixed(1)+'deg')})};
    addEventListener('deviceorientation',this.h)},
  off(){if(--this.n>0)return;this.n=0;removeEventListener('deviceorientation',this.h);const h=document.documentElement;h.classList.remove('tilting');h.style.removeProperty('--ry');h.style.removeProperty('--rx')}};
function o3HTML(d,r,{layers=0,uplit=false,i=0}={}){
  if(!r)return `<span class="emo">${icon(d)}</span>`;
  const u=esc(r.url),dl=`animation-delay:${(-i*1.7).toFixed(1)}s`;
  if(!r.cut)return `<span class="o3" style="${dl}"><img class="frame" src="${u}" alt=""></span>`;
  let ly='';for(let k=layers;k>=1;k--)ly+=`<img class="ly" src="${u}" alt="" style="transform:translateZ(${(-k*1.6).toFixed(1)}px)">`;
  return `<span class="o3" style="${dl}">${ly}<img class="fr" src="${u}" alt="">${uplit?`<i class="uplit" style="-webkit-mask-image:url('${u}');mask-image:url('${u}')"></i>`:''}</span>`;
}
const clearHero=()=>document.querySelectorAll('.o3').forEach(x=>x.style.viewTransitionName='');
function openMuseum(){originFrom($('#bMuseo'));vt('vt-mu-in',museumPage)}
function museumPage(){
  const all=museumItems();

      let h='';for(let i=0;i<its.length;i+=3)h+=`<div class="mu-shelf" style="--i:${i/3}">${its.slice(i,i+3).map(d=>`<button class="mu-obj" data-mu="${d.id}"><span class="emo">${icon(d)}</span><span class="mu-plaque">${esc([d.anno,d.nome].filter(Boolean).join(' · '))}</span></button>`).join('')}<div class="mu-board"></div></div>`;
      wall.innerHTML=h+`<p class="mu-hint">Tocca un oggetto per vederlo sul piedistallo · ▶︎ per la visita guidata · inclina il telefono</p>`;
      let n=0;for(const d of its){const r=await museumImg(d);if(my!==gen)return;const b=wall.querySelector(`[data-mu="${d.id}"]`);if(!r||!b)continue;b.querySelector('.emo').outerHTML=o3HTML(d,r,{layers:1,i:n++})}
    };
    draw();
    el.addEventListener('click',e=>{const r=e.target.closest('[data-room]');if(r){room=r.dataset.room;draw();return}
      const o=e.target.closest('[data-mu]');
      if(o){const its=all.filter(d=>roomOf(d)===room),k=its.findIndex(d=>d.id===o.dataset.mu),hero=o.querySelector('.o3');

      if(e.target.closest('#muv'))vt('vt-pl',()=>openPlinth(all,Math.max(0,all.findIndex(d=>roomOf(d)===room)),true))});

async function openPlinth(list,start,auto,hero){
  if(!list.length)return;
  const r0=await museumImg(list[start]);
  const slide=(d,j)=>{const f=keyTiles(d).slice(0,3).map(([a,b])=>b).join(' · ');const desc=(d.descrizione||'').split(/\n\s*\n/)[0];
    return `<section class="pl" data-pl="${d.id}"><div class="stage"><div class="beam"></div>${j===start?o3HTML(d,r0,{layers:3,uplit:true}):`<span class="emo">${icon(d)}</span>`}<div class="base"></div></div>
    <div class="label"><small>${esc([d.marca,d.anno,d.luogo?'Collezione '+d.luogo:''].filter(Boolean).join(' · '))}</small><h3>${esc(d.nome)}</h3>${desc?`<p>${esc(desc.length>320?desc.slice(0,320)+'…':desc)}</p>`:''}${f?`<div class="facts">${esc(f)}</div>`:''}</div></section>`};
  const body=`<div class="pl-prog" id="plp"></div><div class="pl-bar"><button class="hb" data-back aria-label="Indietro">←</button><span class="cnt" id="plc"></span><button class="hb" id="plplay" aria-label="Visita guidata">${auto?'⏸':'▶︎'}</button><button class="hb" id="plinfo" aria-label="Scheda">ⓘ</button></div><div class="pl-wrap" id="plw">${list.map(slide).join('')}</div>`;
  openPage('Piedistallo',body,{bare:true,cls:'museum pl-root',mount(el){
    const w=$('#plw',el),bar=$('#plp',el),SEC=8000;let i=start,timer=null,lock=null;const done=new Set([list[start].id]);
    if(hero){const h0=w.querySelector(`[data-pl="${list[start].id}"] .o3`);if(h0)h0.style.viewTransitionName='mu-hero'}
    const fill=async k=>{for(const j of [k,k+1,k-1,k+2]){const d=list[j];if(!d||done.has(d.id))continue;done.add(d.id);const r=await museumImg(d);if(!r)continue;const s=w.querySelector(`[data-pl="${d.id}"] .emo`);if(s)s.outerHTML=o3HTML(d,r,{layers:3,uplit:true})}};
    const upd=()=>{$('#plc',el).textContent=`${i+1} / ${list.length}`;fill(i)};
    const go=k=>{i=(k+list.length)%list.length;w.scrollTo({left:i*w.clientWidth,behavior:'smooth'});upd()};
    const prog=()=>{bar.classList.remove('run');bar.style.width='0';void bar.offsetWidth;bar.style.transitionDuration=SEC+'ms';bar.classList.add('run');bar.style.width='100%'};
    const play=async on=>{clearInterval(timer);timer=null;$('#plplay',el).textContent=on?'⏸':'▶︎';bar.style.width='0';bar.classList.remove('run');
      if(on){prog();timer=setInterval(()=>{go(i+1);prog()},SEC);try{lock=await navigator.wakeLock.request('screen')}catch(e){}}else if(lock){lock.release().catch(()=>{});lock=null}};
    w.scrollLeft=i*w.clientWidth;requestAnimationFrame(()=>{w.scrollLeft=i*w.clientWidth;upd()});
    let st;w.addEventListener('scroll',()=>{clearTimeout(st);st=setTimeout(()=>{const k=Math.round(w.scrollLeft/w.clientWidth);if(k!==i){i=k;upd()}},80)});
    w.addEventListener('pointerdown',()=>{if(timer)play(false)});
    $('#plplay',el).onclick=()=>play(!timer);
    $('#plinfo',el).onclick=()=>{play(false);openDetail(list[i].id)};
    if(auto)play(true);
    el._close=()=>play(false);
    /* tornando agli scaffali l'oggetto «vola» al suo posto */
    el._out={cls:'vt-pl',before(){clearHero();const c=el.querySelector(`[data-pl="${list[i].id}"] .o3`);if(c)c.style.viewTransitionName='mu-hero'},
      after(){const sh=document.querySelector(`.mu-root [data-mu="${list[i].id}"] .o3`);if(sh)sh.style.viewTransitionName='mu-hero'},done:clearHero};
  }});
}

function catalogHTML(list,o){
  const cmp=(a,b)=>String(a||'').localeCompare(String(b||''),'it',{numeric:true,sensitivity:'base'});
  const secOf=d=>o.sort==='anno'?(d.anno?Math.floor(d.anno/10)*10+'s':'Senza anno'):o.sort==='nome'?'':(d[o.sort]||'Non indicato');
  list.sort((a,b)=>o.sort==='anno'?((a.anno||9999)-(b.anno||9999))||cmp(a.nome,b.nome):cmp(secOf(a),secOf(b))||cmp(a.nome,b.nome));
  const yrs=list.map(d=>d.anno).filter(Boolean);
  let h=`<section class="pc"><h1>RDDC</h1><h2>${esc(o.title)}</h2><p>${list.length} ${o.w==='wish'?'oggetti desiderati':'oggetti'}${yrs.length?` · dal ${Math.min(...yrs)} al ${Math.max(...yrs)}`:''}</p><p>Aggiornato al ${fmtD(today())}</p></section>`;
  if(o.idx)h+=`<section class="pidx"><div class="sec">Indice</div><table><tr><th>Nome</th><th>Anno</th><th>Marca</th><th>Tipologia</th><th>${o.w==='wish'?'Priorità':'Luogo'}</th></tr>${list.map(d=>`<tr><td>${esc(d.nome)}</td><td>${d.anno||''}</td><td>${esc(d.marca||'')}</td><td>${esc(d.tipologia||'')}</td><td>${esc((o.w==='wish'?d.w_priorita:d.luogo)||'')}</td></tr>`).join('')}</table></section>`;
  let cur=null;
  for(const d of list){
    const s=secOf(d);if(s&&s!==cur){cur=s;h+=`<div class="sec">${esc(s)}</div>`}
    const ph=(d.foto&&d.foto[0])||d.thumb;
    const rows=[['Tipologia',d.tipologia],['Modello',[d.modello,d.emc&&'EMC '+d.emc,d.identifier].filter(Boolean).join(' · ')],...(o.dati?keyTiles(d):[]),['Colore',d.colore],['Quantità',+d.quantita>1?d.quantita:''],
      ...(d.wish?[['Priorità',d.w_priorita],['Budget',o.eur&&d.w_budget?'€ '+d.w_budget:''],['Note ricerca',d.w_note]]:[['Luogo',d.luogo],['Stato',d.stato],['Scatola',d.scatola],['Condizione',d.condizione],['Acquistato',[d.acq_anno,o.eur&&d.acq_prezzo?'€ '+d.acq_prezzo:''].filter(Boolean).join(' · ')],['Valore stimato',o.eur&&d.valore?'€ '+d.valore:'']]),
      ...(o.int&&(d.interventi||[]).length?[['Interventi',d.interventi.slice().sort((a,b)=>String(a.data).localeCompare(b.data)).map(i=>`${fmtD(i.data)}: ${i.tipo||''}${i.desc?' – '+i.desc:''}`).join('; ')]]:[])].filter(r=>r[1]);
    const desc=o.desc&&d.descrizione?d.descrizione.split(/\n\s*\n/)[0].slice(0,650):'';
    h+=`<article class="pe">${o.foto?(ph?`<img src="${ph}" alt="">`:`<div class="noimg">${icon(d)}</div>`):''}<div style="${o.foto?'':'grid-column:1/-1'}"><div class="ps">${esc([d.marca,d.linea&&d.linea!==d.marca?d.linea:'',d.anno].filter(Boolean).join(' · '))}</div><h3>${esc(d.nome)}</h3><dl>${rows.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl>${desc?`<div class="pd">${esc(desc)}${d.descrizione.length>desc.length?'…':''}</div>`:''}</div></article>`;
  }
  return h;
}

function hashId(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return 'db-'+(h>>>0).toString(36)}
async function syncDB(manual){

    if(r.status===404){if(manual)toast('Nessun database su GitHub: carica prima «collezione.json» nel repository',4200);return}
    if(!r.ok)throw new Error('HTTP '+r.status);
    j=await r.json();
  }catch(e){if(manual)toast('Database non raggiungibile: '+e.message,4000);return}
  const arr=Array.isArray(j)?j:j&&j.devices;
  if(!Array.isArray(arr)){if(manual)toast('Il file del database non è valido');return}
  const sig=[j.esportato||'',arr.length,arr.reduce((m,d)=>Math.max(m,(d&&(d.modificato||d.creato))||0),0),(j.eliminati||[]).length].join('|');
  if(!manual&&sig===LS.get('rd_db_sig',''))return;
  const base=new URL(dbUrl(),location.href);
  const {nuovi,agg,canc}=await mergeRemote(arr,tombsOf(j),async p=>{const r=await fetch(new URL(p,base));if(!r.ok)throw new Error('HTTP '+r.status);return r.blob()});
  LS.set('rd_db_sig',sig);LS.set('rd_db_last',{t:Date.now(),n:arr.length,nuovi,agg,canc});

  else if(manual)toast('Già tutto aggiornato ✔︎');
}

$('#list').addEventListener('click',e=>{if(Date.now()<lpSwallow){lpSwallow=0;return}
  if(SELM){const c=e.target.closest('[data-id]');if(c){SELM.has(c.dataset.id)?SELM.delete(c.dataset.id):SELM.add(c.dataset.id);render()}return}if(e.target.closest('#dueB'))return openDue();
  if(e.target.closest('#manB'))return openMaintenance();
  if(e.target.closest('#labP'))return openLab('prog');
  if(e.target.closest('#labC'))return openLab('coll');
  if(e.target.closest('#labS'))return openLab('spesa');
  if(e.target.closest('#warB'))return openDetail(e.target.closest('#warB').dataset.go);
  if(e.target.closest('#annB')){S.view='wish';save();render();scrollTo(0,0);return}
  if(e.target.closest('#loanB')){S.sel.fuori=['In prestito','In esposizione'];render();scrollTo(0,0);return}const c=e.target.closest('[data-id]');if(c)openDetailFrom(c,c.dataset.id)});
$('#bMuseo').onclick=openMuseum;
$('#bTheme').onclick=e=>setTheme(isDark()?'light':'dark',e.currentTarget);
$('#bView').onclick=()=>{const k=Object.keys(LAYOUTS);S.layout=k[(k.indexOf(S.layout||'list')+1)%k.length];render();toast('Vista: '+LAYOUTS[S.layout][1],1400)};
$('#sum').addEventListener('click',e=>{if(e.target.closest('#syncS')){ghSync(true);return}
  if(e.target.closest('[data-selon]'))return startSel();
  if(e.target.closest('[data-selall]')){(render.items||[]).forEach(id=>SELM.add(id));return render()}
  if(e.target.closest('[data-selnone]'))return endSel();if(e.target.closest('[data-inc]')){S.sel.completezza=['Da completare'];render();return}const b=e.target.closest('[data-rm]');if(!b)return;const a=S.sel[b.dataset.rm]||[];S.sel[b.dataset.rm]=a.filter(x=>x!==b.dataset.v);render()});
(async()=>{
  await DB.open();
  devices=await DB.all();devices.forEach(d=>{idx(d);SIG.set(d.id,fieldSig(d))});
  writeManCache();
  if(/[?&]manutenzione=1/.test(location.search)){history.replaceState({p:0},'',location.pathname);setTimeout(openMaintenance,300)}
  if(!RM()){document.body.classList.add('boot');setTimeout(()=>document.body.classList.remove('boot'),900)}
  if(/[?&]condividi=1/.test(location.search)){history.replaceState({p:0},'',location.pathname);readShared().then(r=>{if(r.files.length||r.meta.url||r.meta.text)openShared(r);else toast('Niente da aggiungere')}).catch(()=>toast('Condivisione non riuscita'))}
  render();
  if(location.protocol!=='file:'){
    Promise.resolve(ghOn()?ghSync(false):LS.get('rd_db_auto',true)?syncDB(false):0).finally(()=>setTimeout(autoTranslate,1500));
    document.addEventListener('visibilitychange',()=>{if(!ghOn())return;if(document.visibilityState==='hidden'&&LS.get('rd_dirty',0))ghSync(false);if(document.visibilityState==='visible'&&!syncing)ghSync(false)});
  }
  if('serviceWorker' in navigator&&location.protocol!=='file:'){
    const sw=navigator.serviceWorker,had=!!sw.controller;let done=false;
    /* nuova versione installata: ricarica subito se non c'è niente aperto, altrimenti avvisa */
    sw.addEventListener('controllerchange',()=>{if(!had||done)return;done=true;if(!stack.length)location.reload();else toast('Nuova versione dell\'app disponibile: chiudi e riapri per usarla',6000)});
    sw.register('sw.js',{updateViaCache:'none'}).then(reg=>{document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})})}).catch(()=>{});
  }
})();

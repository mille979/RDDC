<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f2e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#110d07" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>RDDC – Collezione vintage</title>
<style>
:root{--bg:#f8f2e7;--card:#fffaf1;--ink:#24190b;--mute:#76674f;--line:#eadcc4;--acc:#f2a531;--acc-ink:#9c5a00;--on-acc:#2b1a02;--acc2:#3d7a66;--chip:#f4e6cc;--dng:#b3261e;--shadow:0 1px 2px rgba(80,50,0,.10),0 4px 14px rgba(80,50,0,.06);--glow:rgba(242,165,49,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#110d07;--card:#1c160e;--ink:#f7ecd9;--mute:#a99679;--line:#33281a;--acc:#ffb547;--acc-ink:#ffbd5c;--on-acc:#2b1a02;--acc2:#7cc4ad;--chip:#2a2015;--dng:#d2463b;--shadow:0 1px 3px rgba(0,0,0,.5);--glow:rgba(255,181,71,.35)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#110d07;--card:#1c160e;--ink:#f7ecd9;--mute:#a99679;--line:#33281a;--acc:#ffb547;--acc-ink:#ffbd5c;--on-acc:#2b1a02;--acc2:#7cc4ad;--chip:#2a2015;--dng:#d2463b;--shadow:0 1px 3px rgba(0,0,0,.5);--glow:rgba(255,181,71,.35)}
:root{color-scheme:light;--c1:#c27a0e;--c2:#2f6fb0}
:root[data-theme=dark]{--c1:#c98420;--c2:#4f8bd0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--c1:#c98420;--c2:#4f8bd0}}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.brand{font:700 15px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.2em;color:var(--acc-ink);text-shadow:0 0 12px var(--glow);padding:2px 2px 9px;display:flex;align-items:baseline;gap:10px}
.brand{align-items:center}
.seg{margin-left:auto;display:flex;background:var(--chip);border-radius:11px;padding:3px;gap:2px;text-shadow:none;letter-spacing:0}
.seg button{border:0;background:none;border-radius:8px;padding:6px 11px;font:650 13px/1 system-ui,sans-serif;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg i{font-style:normal;font-weight:500;opacity:.7;margin-left:4px}
.prio{color:var(--acc-ink);font-weight:700}
.brand small{font:600 11px/1 system-ui,sans-serif;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;text-shadow:none}
.row{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.search:focus,.in:focus{outline:2px solid var(--acc);outline-offset:-1px}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-width:44px;min-height:44px;position:relative;text-decoration:none;display:inline-grid;place-items:center}
.badge{position:absolute;top:-6px;right:-6px;background:var(--acc);color:var(--on-acc);border-radius:10px;font-size:11px;font-weight:700;padding:1px 6px}
#sum{font-size:13px;color:var(--mute);padding:6px 2px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.oggi{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:10px 10px 6px;margin:10px 0 14px}
.ogh{display:flex;align-items:baseline;gap:8px;padding:0 4px 6px}.ogh b{font-size:16px}.ogh small{color:var(--mute);font-size:12.5px}
.og{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:0;background:var(--chip);border-radius:12px;padding:9px 12px;margin:0 0 6px;color:var(--ink);font-size:14.5px}
.og small{color:var(--mute);font-size:12.5px;margin-top:2px}.og.late{background:color-mix(in srgb,var(--dng) 16%,var(--card))}
.mb{color:var(--acc-ink,var(--acc));font-weight:650}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:8px 8px 8px 12px;margin:6px 0}
.mrow .mi{flex:1 1 100%;min-width:0}.mrow .mi small{display:block;color:var(--mute);font-size:12.5px}.mrow .late{color:var(--dng)}
.inv button.on{background:var(--acc2);color:#fff;border-color:transparent}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:7px 7px 7px 12px;margin:6px 0}
.crow>span{flex:1;min-width:0;font-size:15px}.crow>span small{display:block;color:var(--mute);font-size:12px}
.tri{display:flex;gap:4px}.tri button{width:40px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--bg);font-size:16px;color:var(--ink)}
.crow.ok [data-ce=ok]{background:var(--acc2);color:#fff;border-color:transparent}.crow.ko [data-ce=ko]{background:var(--dng);color:#fff;border-color:transparent}
.crow.na [data-ce=na]{background:var(--chip);border-color:var(--mute)}.crow.na>span{opacity:.55}.crow input{flex:1 1 100%;margin:0;padding:8px 10px}
.labc{display:block;width:100%;text-align:left;color:var(--ink);background:var(--card);border:0;border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;margin:6px 0;border-left:4px solid var(--acc2)}
.labc.ko{border-left-color:var(--dng)}.labc.parz{border-left-color:var(--acc)}.labc small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.pj{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:14px;box-shadow:var(--shadow);padding:8px 10px;margin:6px 0;color:var(--ink)}
.pj .th{width:46px;height:46px;font-size:22px}.pj .pi{flex:1;min-width:0}.pj .pi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pj .pi small{display:block;color:var(--mute);font-size:12.5px}
.pbar{height:5px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:6px}.pbar i{display:block;height:100%;background:var(--acc2);transition:width .3s}
.pt{font-size:19px;font-weight:700;border-color:transparent;background:none;padding:6px 2px}.pt:focus{border-color:var(--line);background:var(--card)}
.pf,.pz{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;border-top:1px solid var(--line)}.log>.pf:first-child,.log>.pz:first-child{border-top:0}
.pf input[type=checkbox]{width:21px;height:21px;flex:none;accent-color:var(--acc2)}.pf span,.pz span{flex:1;min-width:0}.pf span small,.pz span small{display:block;color:var(--mute);font-size:12px}
.pf.done span{text-decoration:line-through;color:var(--mute)}.pf>button,.pzx{border:0;background:none;color:var(--mute);font-size:15px;padding:4px 6px}
.pz .chip{flex:none;font-size:12.5px;padding:4px 10px;text-decoration:none;color:var(--ink)}.pzs.Da_comprare{background:color-mix(in srgb,var(--acc) 30%,var(--card))}.pzs.Ordinato{background:color-mix(in srgb,var(--acc2) 22%,var(--card))}.pzs.Arrivato,.pzs.Montato{background:var(--acc2);color:#fff}
a.res{text-decoration:none;color:var(--ink)}.pz.shp .btn{flex:none;padding:6px 10px;font-size:13px}
.pz.shp{background:var(--card);border:0;border-radius:14px;box-shadow:var(--shadow);margin:6px 0}
.tim{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;margin:10px 0 6px}.tim small{display:block;color:var(--mute);font-size:12px}.tim b{font-size:22px;font-variant-numeric:tabular-nums}.tim.on{outline:2px solid var(--acc2)}
.psd{margin:4px 0}.psd>summary{color:var(--mute);font-size:14px;cursor:pointer;padding:4px 0}.psd input{margin-top:4px}
.phr>small{color:var(--mute);font-size:12.5px}.phs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}.phs img{width:78px;height:78px;object-fit:cover;border-radius:10px;flex:none}
.phadd{width:78px;height:78px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font-size:24px;color:var(--mute);flex:none;cursor:pointer}
.pcmp{position:relative;border-radius:14px;overflow:hidden;margin:4px 0 10px;box-shadow:var(--shadow);touch-action:pan-y}.pcmp img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.pcd{position:absolute;inset:0;clip-path:inset(0 0 0 var(--x))}.pcl{position:absolute;top:0;bottom:0;left:var(--x);width:3px;margin-left:-1px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.5);pointer-events:none}
.pcb{position:absolute;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:8px;pointer-events:none}.pcb.l{left:8px}.pcb.r{right:8px}
.pcmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:ew-resize}
.ann{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin:6px 0;padding:6px 6px 6px 8px}
.annr{display:flex;align-items:center;gap:6px}
.annn{display:flex;flex-wrap:wrap;gap:4px;padding:6px 4px 2px 66px}.annn .tg{flex:none;font-size:11.5px;background:var(--chip);border-radius:10px;padding:2px 8px;color:var(--ink)}.annn p{flex-basis:100%;margin:4px 0 2px;font-size:13.5px;color:var(--ink);white-space:pre-wrap}
.ann em s{display:block;font-size:11px;font-weight:500;color:var(--mute);text-align:right}
.chip.on{background:var(--acc);color:var(--on-acc,#2a1a05);border-color:transparent}
.ann a{flex:1;min-width:0;display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.ann img,.ann a>i{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--chip);display:grid;place-items:center;font-style:normal;font-size:24px}
.ann span{flex:1;min-width:0}.ann b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ann small{color:var(--mute);font-size:12px}
.ann em{font-style:normal;font-weight:800;color:var(--acc-ink,var(--ink));white-space:nowrap}
.nsug{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}.nsug:empty{display:none}
.accr{display:flex;gap:10px;align-items:center}.accr img{width:52px;height:40px;object-fit:contain;background:#fff;border-radius:8px;flex:none}.accr>span{min-width:0}
.src{font-style:normal;font-size:11px;font-weight:700;background:var(--chip);border-radius:6px;padding:1px 6px;margin-right:4px;white-space:nowrap}
.pill{background:var(--chip);border-radius:14px;padding:3px 10px;font-size:13px;border:0}
.pill.x::after{content:" ✕";opacity:.6}
#list{padding:4px 12px 110px}
.gh{position:sticky;top:var(--hh,120px);background:var(--bg);font-weight:700;color:var(--acc-ink);padding:12px 2px 4px;font-size:14px;letter-spacing:.04em;z-index:2}
.gh small{color:var(--mute);font-weight:400}
.card{display:flex;gap:12px;background:var(--card);border-radius:16px;padding:10px;margin:8px 0;box-shadow:var(--shadow);align-items:center}
.th{width:66px;height:66px;border-radius:12px;background:var(--chip);flex:none;display:grid;place-items:center;font-size:28px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.ct{min-width:0;flex:1}
.ct b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct>span{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:10px;font-size:12px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden}
.meta span{display:inline-flex;align-items:center;gap:4px}
.yr{font-weight:700;color:var(--acc-ink);background:var(--chip);border-radius:10px;padding:3px 8px;font-size:13px;font-variant-numeric:tabular-nums;align-self:flex-start}
.qty{font-weight:700;color:var(--acc-ink)}
.meta .lk{color:var(--acc-ink);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c,transparent);border:1px solid rgba(127,127,127,.55);flex:none;vertical-align:-1px}
.empty{text-align:center;color:var(--mute);padding:60px 20px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:30px;border:0;background:var(--acc);color:var(--on-acc);font-size:32px;box-shadow:0 4px 18px var(--glow),0 2px 6px rgba(0,0,0,.25);z-index:6}
.page{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.page>header{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.page>header h2{flex:1;margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page .body{flex:1;overflow:auto;padding:12px 14px calc(30px + env(safe-area-inset-bottom))}
.page .body.bare{padding:0}
.btn{border:0;background:var(--acc);color:var(--on-acc);border-radius:12px;padding:11px 16px;font-weight:650;text-decoration:none;display:inline-block;text-align:center}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.dng{background:var(--dng);color:#fff}
.btn.sm{padding:7px 12px;font-size:14px}
.sec-t{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink);font-weight:750;margin:22px 0 7px}
.kv{display:grid;grid-template-columns:minmax(100px,38%) 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.kv>div{background:var(--card);padding:9px 11px;word-break:break-word}
.kv>div:nth-child(odd){color:var(--mute);font-size:14px}
.kv a{color:var(--acc-ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:16px;padding:5px 11px;font-size:14px}
.chip.on{background:var(--acc);color:var(--on-acc);font-weight:600}
.chip i{font-style:normal;opacity:.65;margin-left:4px;font-size:12px}
label.f{display:block;margin:10px 0 2px;font-size:13px;color:var(--mute)}
.in{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
textarea.in{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.photos .ph{position:relative;flex:none;scroll-snap-align:start}
.photos img{height:200px;max-width:86vw;border-radius:12px;display:block;object-fit:contain;background:var(--chip)}
.photos.sm img{height:84px}
.ph button{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:26px;height:26px}
/* foto nel modulo: griglia riordinabile, copertina, trascina e rilascia */
#ph{border:2px dashed transparent;border-radius:16px;padding:4px;margin:-4px;transition:border-color .2s,background .2s}
#ph.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pht{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow);touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;transition:transform .2s,opacity .2s}
.pht img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.pht.cov{outline:3px solid var(--acc);outline-offset:-3px}
.pht .cvb{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(20,12,2,.75));color:#ffd08a;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:12px 6px 4px;text-align:center}
.pht button{position:absolute;top:4px;border:0;background:rgba(20,12,2,.62);color:#fff;border-radius:50%;width:28px;height:28px;font-size:14px;display:grid;place-items:center}
.pht .rm{right:4px}.pht .st{left:4px;color:#ffd08a}
.pht.dragging{opacity:.25}
.pht.ghost{position:fixed;z-index:80;pointer-events:none;transform:scale(1.08) rotate(-2deg);box-shadow:0 14px 34px rgba(0,0,0,.4);opacity:.95}
.phadd{aspect-ratio:1;border:2px dashed var(--line);border-radius:12px;background:none;color:var(--mute);font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.phadd small{font-size:11px}
.phhint{font-size:12px;color:var(--mute);margin:6px 2px 0}
.vcov{white-space:nowrap;position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--chip)}
.res{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.res small{display:block;color:var(--mute)}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px}
.bar div{height:14px;background:var(--acc);border-radius:7px;min-width:3px}
.bar span:last-child{white-space:nowrap}
.bar.b2 div{background:var(--acc2)}.bar.b3 div{background:color-mix(in srgb,var(--acc2) 55%,var(--acc))}.bar.b4 div{background:var(--dng)}
.bar span:first-child{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--mute);margin:10px 0}
.note b{color:var(--ink)}
#toast button{border:0;background:none;color:var(--acc);font-weight:750;margin-left:12px;padding:2px 4px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#241a0c;color:#fff3df;padding:10px 16px;border-radius:20px;z-index:99;font-size:14px;max-width:88vw;display:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:grid;place-items:center;padding:20px}
.modal>div{background:var(--card);border-radius:16px;padding:18px;max-width:380px;width:100%}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
a{color:var(--acc-ink)}
/* ---- scheda: header con foto ---- */
.hero{position:relative;height:min(64vh,480px);min-height:300px;overflow:hidden;background:#1a1208;color:#fff}
.hero .himg,.hero .hbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .hbg{display:none;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);filter:blur(28px) saturate(1.25) brightness(.85)}
.hero.fit .hbg{display:block}
.hero.fit .himg{object-fit:contain;padding:calc(58px + env(safe-area-inset-top)) 12px 118px}
.hero.noph{height:auto;min-height:calc(270px + env(safe-area-inset-top));background:radial-gradient(120% 90% at 75% 5%,#ffc867 0%,#d27b0c 38%,#5a3203 75%,#2a1704 100%)}
.hicon{position:absolute;inset:env(safe-area-inset-top) 0 96px;display:grid;place-items:center;font-size:92px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.hb{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(20,12,2,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:18px;display:grid;place-items:center}
.hb.l{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:2}
.hbr{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:8px;z-index:2}
.cap{position:absolute;left:0;right:0;bottom:0;padding:76px 18px 16px;isolation:isolate}
.cap::before{content:"";position:absolute;inset:0;z-index:-1;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(to top,#000 42%,transparent);mask-image:linear-gradient(to top,#000 42%,transparent);background:linear-gradient(to top,rgba(18,11,2,.80),rgba(18,11,2,.38) 62%,rgba(18,11,2,0))}
.cap small{display:block;color:#ffd08a;font-weight:650;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase}
.cap h1{margin:3px 0 0;font-size:clamp(22px,6.6vw,34px);line-height:1.12;font-weight:800;letter-spacing:-.01em;text-shadow:0 1px 14px rgba(0,0,0,.35);overflow-wrap:anywhere}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:4px 10px;font-size:13px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 0}
.thumbs img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:var(--chip);border:2px solid transparent}
.thumbs img.on{border-color:var(--acc)}
.dbody{padding:4px 14px calc(30px + env(safe-area-inset-bottom))}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:14px 0 2px}
.tile{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.tile small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.tile b{display:block;font-size:15px;margin-top:2px;overflow-wrap:anywhere;line-height:1.25}
.desc{line-height:1.55;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.desc>div{white-space:pre-line}
.desc>div.cl{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.linkb{border:0;background:none;color:var(--acc-ink);font-weight:650;padding:6px 2px}
details.more{margin-top:22px}
details.more>summary{list-style:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink);font-weight:750;padding:8px 0;cursor:pointer}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details.more[open]>summary::before{transform:rotate(90deg)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.viewer{background:#000}
.vw{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%}
.vw img{flex:none;width:100vw;height:100%;object-fit:contain;scroll-snap-align:center}
/* ---- form ---- */
.swrow{display:flex;gap:9px;overflow-x:auto;padding:8px 2px 4px}
.swb{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid rgba(127,127,127,.5);background:var(--c)}
.swb.on{outline:3px solid var(--acc);outline-offset:2px}
.swbig{width:44px;height:44px;border-radius:12px;flex:none;border:1px solid var(--line);background:var(--c,transparent)}
.swbig.none{background:repeating-linear-gradient(45deg,var(--chip) 0 6px,var(--card) 6px 12px)}
.step{margin:8px 0}
/* registro interventi */
.log{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;gap:12px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.ld{flex:none;width:92px;color:var(--acc-ink);font-weight:700;font-size:13px}
.lb{min-width:0}.lb b{display:block}.lb span{display:block;font-size:14px;white-space:pre-line}.lb small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.due{display:block;width:100%;text-align:left;border:1px solid var(--acc);background:var(--chip);color:var(--ink);border-radius:14px;padding:10px 12px;margin:10px 0 4px;font-weight:600}
.due.late{border-color:var(--dng)}
.due small{display:block;font-weight:400;color:var(--mute)}
/* griglia */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}
.gcard{position:relative;border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column}
.gcard .gi{aspect-ratio:1;background:#fff;display:grid;place-items:center;font-size:46px;overflow:hidden}
.gcard .gi.ni{background:radial-gradient(120% 90% at 70% 10%,#ffc867 0%,#d27b0c 45%,#5a3203 100%)}
.gcard .gi img{width:100%;height:100%;object-fit:cover}
.gcard .gt{padding:8px 10px 10px}
.gcard b{font-size:14px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gcard small{display:block;color:var(--mute);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gy{position:absolute;top:8px;left:8px;background:rgba(20,12,2,.62);color:#ffd08a;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* linea del tempo */
.tl{position:relative;margin:4px 0 0 8px;padding-left:20px;border-left:2px solid var(--line)}
.ty{position:relative;margin:20px 0 6px;font:800 21px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--acc-ink);letter-spacing:.04em}
.ty::before{content:"";position:absolute;left:-28px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--bg),0 0 14px var(--glow)}
.ty small{font:500 12px system-ui,sans-serif;color:var(--mute);margin-left:8px;letter-spacing:0}
/* catalogo stampabile */
/* ===== museo ===== */
.mubtn{border:0;background:none;font-size:20px;padding:2px 6px;margin-left:2px;filter:drop-shadow(0 0 6px var(--glow))}
.page.museum{background:#140c06;color:#f6ead6}
.mu-top{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(#3a2716,#24170c);box-shadow:0 2px 10px rgba(0,0,0,.5)}
.mu-top .hb{flex:none}
.mu-top b{font:700 14px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:#ffb547;text-shadow:0 0 10px rgba(255,181,71,.5)}
.mu-tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);padding:0 14px}
.mu-tabs::-webkit-scrollbar{display:none}
.mu-tabs button{flex:none;border:0;background:none;color:#d9c3a0;font-size:13px;padding:7px 10px;border-radius:8px}
.mu-tabs .on{background:rgba(255,181,71,.18);color:#ffcf7a;font-weight:700}
.mu-wall{min-height:calc(100% - 60px);padding:4px 0 40px;background:radial-gradient(140% 50% at 50% -10%,rgba(255,214,150,.16),transparent 60%),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 7px),linear-gradient(#2b1d12,#1a1009)}
.mu-shelf{position:relative;height:200px;margin-top:8px;display:flex;justify-content:space-around;align-items:flex-end;padding:0 6px 24px}
.mu-shelf::before{content:"";position:absolute;inset:-10px 0 18px;background:radial-gradient(28% 70% at 17% 0,rgba(255,226,170,.28),transparent 70%),radial-gradient(28% 70% at 50% 0,rgba(255,226,170,.28),transparent 70%),radial-gradient(28% 70% at 83% 0,rgba(255,226,170,.28),transparent 70%);pointer-events:none}
.mu-board{position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(#a8743f,#7b4f27 35%,#4d2f15);box-shadow:0 10px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,220,170,.55)}
.mu-board::after{content:"";position:absolute;left:0;right:0;top:-10px;height:10px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.35))}
.mu-obj{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:31%;height:100%;border:0;background:none;padding:0;color:inherit}
.mu-obj .o3{max-width:100%}
.mu-obj .o3 .fr,.mu-obj .o3 .ly{display:block;max-width:100%;max-height:140px}
.mu-obj .o3 .fr{filter:drop-shadow(0 6px 6px rgba(0,0,0,.55)) brightness(1.04)}
.mu-obj .o3 .frame{display:block;max-height:104px;max-width:100%;border:5px solid #3a2410;outline:2px solid #c99a45;background:#fff;box-shadow:0 8px 14px rgba(0,0,0,.6)}
/* effetto 3D: spessore (strati dietro) + rotazione con l'inclinazione del telefono, oscillazione lenta se manca il sensore */
.o3{position:relative;display:inline-block;transform-style:preserve-3d;transform:perspective(700px) rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));transition:transform .35s ease-out;animation:o3-sway 8s ease-in-out infinite alternate}
.mu-obj .o3{animation-name:o3-sway-s;animation-duration:9s}
.o3 .ly{position:absolute;left:0;top:0;width:100%;height:100%;filter:brightness(.3)}
.o3 .fr{position:relative}
html.tilting .o3{animation:none}
@keyframes o3-sway{from{transform:perspective(700px) rotateY(-11deg) rotateX(3deg)}to{transform:perspective(700px) rotateY(11deg) rotateX(-1deg)}}
@keyframes o3-sway-s{from{transform:perspective(700px) rotateY(-7deg)}to{transform:perspective(700px) rotateY(7deg)}}
/* luci che si accendono entrando nel museo */
.mu-shelf::before{animation:mu-light 1.1s ease-out both;animation-delay:calc(.35s + var(--i,0)*.22s)}
.mu-obj{animation:mu-rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.25s + var(--i,0)*.22s)}
@keyframes mu-light{0%{opacity:0}25%{opacity:.9}32%{opacity:.15}48%,100%{opacity:1}}
@keyframes mu-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mu-obj .emo{font-size:62px;line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}
.mu-obj::after{content:"";width:70%;height:8px;margin-top:-4px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),transparent 70%)}
.mu-plaque{position:absolute;bottom:-21px;font:650 9px/1 system-ui,sans-serif;letter-spacing:.05em;color:#3a2410;background:linear-gradient(#f3d48c,#c99a45);padding:3px 6px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.5);z-index:2;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mu-hint{text-align:center;margin:22px 14px 0;font-size:12px;color:#b89f7b}
.mu-empty{padding:60px 24px;text-align:center;color:#c8b08c}
/* piedistallo */
.pl-wrap{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}
.pl-wrap::-webkit-scrollbar{display:none}
.pl{flex:none;width:100vw;height:100%;position:relative;overflow:hidden;scroll-snap-align:center;background:radial-gradient(90% 55% at 50% 45%,#2a2622 0%,#0d0b09 70%)}
.pl{background:radial-gradient(70% 42% at 50% 56%,#2a231c 0%,#0b0907 72%)}
/* piedistallo illuminato dal basso: piano luminoso, fascio che sale, oggetto illuminato da sotto */
.pl .stage{position:absolute;left:0;right:0;top:calc(70px + env(safe-area-inset-top));height:46%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pl .beam{position:absolute;left:50%;bottom:84px;width:min(86vw,360px);height:118%;transform:translateX(-50%);background:linear-gradient(to top,rgba(255,226,170,.5),rgba(255,226,170,.14) 45%,transparent 85%);clip-path:polygon(22% 100%,78% 100%,100% 0,0 0);filter:blur(16px);pointer-events:none;z-index:1;animation:beam-on 1.3s ease-out both}
.pl .o3{z-index:2;margin-bottom:-4px}
.pl .o3 .fr,.pl .o3 .ly{display:block;max-width:72vw;max-height:32vh}
.pl .o3 .fr{filter:drop-shadow(0 0 18px rgba(255,214,150,.22)) brightness(1.05)}
.pl .o3 .uplit{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;background:linear-gradient(to top,rgba(255,224,165,.62),rgba(255,224,165,.2) 28%,rgba(255,224,165,0) 58%);pointer-events:none}
.pl .o3 .frame{display:block;border:7px solid #3a2410;outline:2px solid #c99a45;background:#fff;max-width:62vw;max-height:28vh;margin-bottom:10px;box-shadow:0 -10px 30px rgba(255,214,150,.25)}
.pl .stage .emo{font-size:110px;line-height:1;position:relative;z-index:2;filter:drop-shadow(0 -6px 18px rgba(255,214,150,.35))}
.pl .base{flex:none;width:min(66vw,260px);height:96px;position:relative;z-index:1;background:linear-gradient(90deg,#0f0c0a,#3a322a 40%,#2a231d 68%,#0c0a08);border-radius:0 0 8px 8px;box-shadow:0 30px 40px rgba(0,0,0,.7),0 60px 80px -20px rgba(255,200,130,.16)}
.pl .base::before{content:"";position:absolute;left:0;right:0;top:-13px;height:26px;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,#fffaf0 0%,#ffe7bd 40%,#f0c27a 72%,#b07f3c 100%);box-shadow:0 0 26px 8px rgba(255,214,150,.5),0 0 80px 24px rgba(255,196,120,.2);animation:glow-on 1.3s ease-out both}
.pl .base::after{content:"";position:absolute;left:3%;right:3%;top:10px;height:5px;border-radius:50%;background:rgba(255,226,170,.5);filter:blur(3px)}
@keyframes beam-on{0%{opacity:0}30%{opacity:.6}40%{opacity:.12}65%,100%{opacity:1}}
@keyframes glow-on{0%{filter:brightness(.15)}30%{filter:brightness(1)}40%{filter:brightness(.45)}65%,100%{filter:brightness(1)}}
.pl .label{position:absolute;left:16px;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));max-height:36%;overflow:auto;background:#f7f3ea;color:#1c1712;border-radius:4px;padding:14px 16px;box-shadow:0 6px 24px rgba(0,0,0,.5);font-family:Georgia,"Times New Roman",serif}
.pl .label small{font:700 10px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#9c5a00}
.pl .label h3{margin:4px 0 4px;font-size:21px;line-height:1.2}
.pl .label p{margin:0;font-size:13.5px;line-height:1.45;color:#3d342a}
.pl .label .facts{font:600 12px system-ui,sans-serif;color:#6b5a43;margin-top:6px}
.pl-bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 10px 0;pointer-events:none}
.pl-bar>*{pointer-events:auto}
.pl-bar .cnt{flex:1;text-align:center;font:600 12px system-ui;color:#bba98e}
.pl-prog{position:absolute;top:0;left:0;height:3px;background:#ffb547;z-index:6;width:0}
.pl-prog.run{transition:width linear}
/* editor scontorno */
.cut-prev{border-radius:14px;min-height:220px;display:grid;place-items:center;padding:14px;background:repeating-conic-gradient(#d9d2c4 0 25%,#f4efe6 0 50%) 0 0/18px 18px}
.cut-prev.dark{background:radial-gradient(#3a2716,#140c06)}
.cut-prev img{max-width:100%;max-height:300px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
/* icona di sincronizzazione */
.sync{margin-left:auto;display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--mute);font-size:12px;padding:0 2px;min-height:24px}
.sync svg{width:22px;height:22px;overflow:visible;flex:none}
.sync .cl{fill:var(--chip);stroke:var(--mute);stroke-width:1.3}
.sync .sy{fill:none;stroke:var(--acc-ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sync.run .sy{transform-box:fill-box;transform-origin:center;animation:s 1.1s linear infinite}
.sync.pop svg{animation:sync-pop .55s cubic-bezier(.3,1.6,.5,1)}
.sync.dirty .sy{animation:sync-up 1.3s ease-in-out infinite}
.sync.err,.sync.err .sy{color:var(--dng);stroke:var(--dng)}
.sync .tx{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .45s ease,opacity .45s ease}
.sync.run .tx,.sync.err .tx,.sync.show .tx{max-width:130px;opacity:1}
@keyframes sync-pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes sync-up{0%,100%{transform:translateY(1.2px);opacity:.55}50%{transform:translateY(-1.6px);opacity:1}}
/* transizioni: museo (iride dal pulsante 🏛️), tema, oggetto che vola sul piedistallo */
html.vt-mu-in::view-transition-old(root){animation:vt-dim .75s ease both}
html.vt-mu-in::view-transition-new(root){animation:vt-iris .8s cubic-bezier(.65,0,.25,1) both}
html.vt-mu-out::view-transition-old(root){animation:vt-iris-out .75s cubic-bezier(.65,0,.25,1) both;z-index:2}
html.vt-mu-out::view-transition-new(root){animation:vt-undim .75s ease both}
html.vt-theme::view-transition-old(root){animation:none}
html.vt-theme::view-transition-new(root){animation:vt-iris .6s ease-in-out both}
html.vt-pl::view-transition-old(root){animation:vt-fade-out .45s ease both}
html.vt-pl::view-transition-new(root){animation:vt-fade-in .45s ease both}
::view-transition-group(mu-hero){animation-duration:.6s;animation-timing-function:cubic-bezier(.3,0,.15,1)}
@keyframes vt-iris{from{clip-path:circle(0 at var(--vx,50%) var(--vy,0))}to{clip-path:circle(150vmax at var(--vx,50%) var(--vy,0))}}
@keyframes vt-iris-out{0%{clip-path:circle(150vmax at var(--vx,50%) var(--vy,0));filter:brightness(1)}35%{filter:brightness(.3)}100%{clip-path:circle(0 at var(--vx,50%) var(--vy,0));filter:brightness(.15)}}
@keyframes vt-dim{to{filter:brightness(.3) blur(2px)}}
@keyframes vt-undim{from{filter:brightness(.3) blur(2px)}}
@keyframes vt-fade-out{to{opacity:0}}
@keyframes vt-fade-in{from{opacity:0}}
/* anteprima con pressione lunga (stile 3D Touch) */
.card,.gcard{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.card.pressing,.gcard.pressing{transform:scale(.955);box-shadow:0 0 0 2px var(--acc),var(--shadow)}
.peek{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:rgba(20,12,4,0);transition:background .3s,-webkit-backdrop-filter .3s,backdrop-filter .3s}
.peek.on{background:rgba(20,12,4,.38);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
.peek.off{background:rgba(20,12,4,0);-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0)}
.pk-card,.pk-acts{width:min(92vw,380px);transform-origin:var(--ox,50%) var(--oy,50%);transform:scale(.55);opacity:0;transition:transform .4s cubic-bezier(.2,1.25,.35,1),opacity .2s}
.peek.on .pk-card,.peek.on .pk-acts{transform:none;opacity:1}
.peek.on .pk-acts{transition-delay:.07s}
.peek.off .pk-card,.peek.off .pk-acts{transform:scale(.88);opacity:0;transition:transform .22s ease-in,opacity .22s}
.pk-card{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 22px 60px rgba(0,0,0,.45)}
.pk-hero{position:relative;height:210px;background:#fff;display:grid;place-items:center;overflow:hidden}
.pk-hero img{width:100%;height:100%;object-fit:contain}
.pk-hero.noph{background:radial-gradient(120% 90% at 75% 5%,#ffc867 0%,#d27b0c 38%,#5a3203 75%,#2a1704 100%);font-size:78px}
.pk-cap{position:absolute;left:0;right:0;bottom:0;padding:36px 16px 12px;color:#fff;background:linear-gradient(to top,rgba(18,11,2,.82),rgba(18,11,2,0))}
.pk-cap small{display:block;color:#ffd08a;font-weight:650;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase}
.pk-cap b{display:block;font-size:20px;line-height:1.15}
.pk-body{padding:12px 16px 14px}
.pk-body .chips{margin:0 0 10px}
.pk-body .chip{font-size:12.5px;padding:3px 9px}
.pk-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.pk-tiles small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.pk-tiles span{font-weight:650;font-size:14px;overflow-wrap:anywhere}
.pk-body p{margin:10px 0 0;font-size:13.5px;color:var(--mute);line-height:1.45}
.pk-acts{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.pk-acts button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:13px 16px;font-size:16px;border-top:1px solid var(--line);color:var(--ink)}
.pk-acts button:first-child{border-top:0}
.pk-acts .dng{color:var(--dng)}
.pk-acts i{font-style:normal}
@media (prefers-reduced-motion:reduce){.o3,.mu-obj,.mu-shelf::before,.pl .beam,.pl .base::before,.sync .sy,.sync svg{animation:none!important}}
/* completezza, etichette, prestiti, valore, allegati */
.meta .inc{color:var(--mute);font-style:italic}

.incn{border:1px dashed var(--acc)}
.mchip{display:inline-flex;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.mchip button{border:0;background:none;padding:4px 10px;font-size:13px;color:var(--ink)}

.loan{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border-left:4px solid var(--acc)}

.valc{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}

.vhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-end}

.vhead b{font-size:24px;font-variant-numeric:tabular-nums}.vhead b.vd{font-size:15px}
.chart{position:relative;margin:10px 0 4px;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--mute);stroke-width:1;opacity:.7}
.chart .ax{fill:var(--mute);font-size:11px;font-variant-numeric:tabular-nums}
.chart .lv{fill:var(--ink);font-size:12px;font-weight:650;font-variant-numeric:tabular-nums}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .mk{stroke:var(--card);stroke-width:2}
.chart .s1{stroke:var(--c1)}.chart circle.s1{fill:var(--c1)}.chart .s2{stroke:var(--c2)}.chart circle.s2{fill:var(--c2)}
.chart .xh{stroke:var(--mute);stroke-width:1}
.chart .hit{fill:transparent}
.cleg{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-bottom:-22px;position:relative}
.cleg i,.ctip i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.cleg i.s1,.ctip i.s1{background:var(--c1)}.cleg i.s2,.ctip i.s2{background:var(--c2)}
.ctip{position:absolute;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;z-index:2}
.att{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding:4px 6px 4px 12px}
.att:first-child{border-top:0}
.att .ai{font-size:22px}
.att .an{flex:1;min-width:0;text-align:left;border:0;background:none;padding:6px 4px}
.att .an b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.att .an small{color:var(--mute);font-size:12px}
.att .ab{border:0;background:none;width:38px;height:38px;border-radius:10px;color:var(--mute);font-size:16px}
.sn{font-size:12.5px;color:var(--mute);margin-top:4px;line-height:1.4}
.sn small{opacity:.8}
.lnkbox{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:6px;padding:4px 0}
.lnk{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:14px;border-top:1px solid var(--line)}
.lnk:first-child{border-top:0}
.lnk input{width:18px;height:18px;flex:none}
/* selezione multipla */
.selc{position:relative}
.card.selc{padding-left:46px}
.selc::before{content:"";position:absolute;left:12px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;border:2px solid var(--mute);background:var(--card);z-index:2}
.gcard.selc::before{top:12px;left:auto;right:10px;margin-top:0}
.selc.on::before{background:var(--acc);border-color:var(--acc);box-shadow:inset 0 0 0 3px var(--card)}
.selc.on{box-shadow:0 0 0 2px var(--acc),var(--shadow)}
#bulk[hidden],.fab[hidden]{display:none!important}
#bulk{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;gap:6px;overflow-x:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -4px 18px rgba(0,0,0,.18);scrollbar-width:none}

.cmp{display:grid;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);font-size:13.5px}
.cmp>div{background:var(--card);padding:8px 9px;word-break:break-word}

.inv.ok{opacity:.55}.inv.ok [data-iv=ok]{background:var(--acc2);color:#fff;border-color:transparent}

.inv.mv{opacity:.55}.inv.mv [data-iv=mv]{background:var(--acc);color:var(--on-acc);border-color:transparent}
.invbar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin:6px 0 10px}.invbar i{display:block;height:100%;background:var(--acc2)}

.page{animation:pg-in .34s cubic-bezier(.2,.85,.25,1) both}
.page.pg-swap{animation:pg-swap .22s ease-out both}
.page.pg-out{animation:pg-out .26s cubic-bezier(.45,0,.75,.4) both;pointer-events:none}

.page.museum,.page.no-anim{animation:none}

@keyframes pg-out{to{transform:translate3d(36%,0,0);opacity:0}}
@keyframes pg-swap{from{opacity:0;transform:scale(.985)}}

#bulk:not([hidden]){animation:bar-up .3s cubic-bezier(.2,.85,.25,1) both}

.selc.on{animation:sel-pop .22s ease}@keyframes sel-pop{50%{transform:scale(.98)}}
/* ===== animazioni di attesa ===== */
.ld{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;box-sizing:border-box;padding:18px 0 8px;text-align:center;color:var(--mute)}
.ld svg{width:min(170px,46vw);height:auto;overflow:visible}
.ldm{font-size:14.5px;font-weight:600;color:var(--ink)}
.ldm::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:ld-dots 1.2s steps(4) infinite}
@keyframes ld-dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

.ld .bar2{width:min(220px,60vw);height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:4px}.ld .bar2 i{display:block;height:100%;width:0;background:var(--acc);border-radius:3px;transition:width .3s}
.ld .st{stroke:var(--mute);stroke-width:1.6;fill:var(--card)}

@keyframes ld-bit{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}80%{opacity:1;transform:translate(44px,-14px) scale(1)}100%{opacity:0;transform:translate(48px,-12px) scale(.6)}}

.ld-ann .sun{animation:ld-sun 3.6s ease-in-out infinite alternate}@keyframes ld-sun{to{transform:translateY(-3px)}}

.ld-scan .pill.p2{animation-delay:.5s}.ld-scan .pill.p3{animation-delay:1s}

<script>
'use strict';
/* ============ util ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fmtD=s=>{if(!s)return '';const d=new Date(String(s).slice(0,10)+'T12:00');return isNaN(d)?String(s):d.toLocaleDateString('it',{day:'numeric',month:'short',year:'numeric'})};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
/* tema: automatico (segue il telefono), chiaro, scuro */
const isDark=()=>{const t=LS.get('rd_theme','auto');return t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)};
function applyTheme(){const t=LS.get('rd_theme','auto'),r=document.documentElement;if(t==='auto')delete r.dataset.theme;else r.dataset.theme=t;
  const dk=isDark();document.querySelectorAll('meta[name=theme-color]').forEach(m=>{m.removeAttribute('media');m.content=dk?'#110d07':'#f8f2e7'});const b=$('#bTheme');if(b)b.textContent=dk?'☀️':'🌙'}
applyTheme();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
/* transizioni (View Transitions API, con ripiego senza animazione) */
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function vt(cls,fn,done){const h=document.documentElement;
  if(!document.startViewTransition||RM()){Promise.resolve(fn()).then(()=>done&&done());return}
  h.classList.add(cls);let t;try{t=document.startViewTransition(fn)}catch(e){h.classList.remove(cls);Promise.resolve(fn()).then(()=>done&&done());return}
  t.finished.catch(()=>{}).finally(()=>{h.classList.remove(cls);done&&done()})}
function originFrom(el){if(!el)return;const r=el.getBoundingClientRect(),s=document.documentElement.style;s.setProperty('--vx',Math.round(r.left+r.width/2)+'px');s.setProperty('--vy',Math.round(r.top+r.height/2)+'px')}
function setTheme(t,from){originFrom(from);vt('vt-theme',()=>{LS.set('rd_theme',t);applyTheme()})}
const spin=m=>`<span class="spin"></span>${esc(m)}`;
/* animazioni di attesa: mac (EveryMac), ann (annuncio), scan (screenshot), web (ricerca online) */
const LD_SVG={

/* ============ database (IndexedDB) ============ */
const DB={
  db:null,mem:new Map(),
  open(){return new Promise(res=>{try{const r=indexedDB.open('rddc',1);r.onupgradeneeded=()=>r.result.createObjectStore('dev',{keyPath:'id'});r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
  tx(m){return DB.db.transaction('dev',m).objectStore('dev')},
  all(){return new Promise(res=>{if(!DB.db)return res([...DB.mem.values()]);const q=DB.tx('readonly').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])})},
  put(d){const c=Object.fromEntries(Object.entries(d).filter(([k])=>k[0]!=='_'));DB.mem.set(c.id,c);return new Promise(res=>{if(!DB.db)return res();const q=DB.tx('readwrite').put(c);q.onsuccess=q.onerror=()=>res()})},
  del(id){DB.mem.delete(id);return new Promise(res=>{if(!DB.db)return res();const q=DB.tx('readwrite').delete(id);q.onsuccess=q.onerror=()=>res()})},
  clear(){DB.mem.clear();return new Promise(res=>{if(!DB.db)return res();const q=DB.tx('readwrite').clear();q.onsuccess=q.onerror=()=>res()})}
};

const SIG=new Map();
function strHash(t){let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)+'.'+t.length}
function fieldSig(o){const r={};for(const k of Object.keys(o))if(k[0]!=='_'&&k!=='fts'&&k!=='modificato'&&o[k]!==undefined)r[k]=strHash(JSON.stringify(o[k]));return r}
function stamp(o){const prev=SIG.get(o.id),cur=fieldSig(o),now=Date.now();
  if(!o.fts){const base=o.modificato||o.creato||0;o.fts={};for(const k of Object.keys(prev||{}))o.fts[k]=base}else o.fts=Object.assign({},o.fts);
  for(const k of new Set([...Object.keys(cur),...Object.keys(prev||{})]))if(!prev||prev[k]!==cur[k])o.fts[k]=now;
  for(const k of Object.keys(o.fts))if(!(k in cur)&&prev&&!(k in prev))delete o.fts[k];
  SIG.set(o.id,cur)}
const stable=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((a,y)=>(a[y]=x[y],a),{}):x);
function fieldMerge(l,r){const lf=l.fts||{},rf=r.fts||{},out=Object.assign({},l),fts=Object.assign({},lf);let changed=false;const keys=[];
  for(const k of new Set([...Object.keys(l),...Object.keys(r)])){if(k[0]==='_'||k==='fts'||k==='modificato'||k==='id')continue;
    const lt=l.fts?(lf[k]??0):(l.modificato||0),rt=r.fts?(rf[k]??0):(r.modificato||0);
    if(rt>lt&&stable(r[k])!==stable(l[k])){if(r[k]===undefined)delete out[k];else out[k]=r[k];fts[k]=rt;changed=true;keys.push(k)}}
  out.fts=fts;out.modificato=Math.max(l.modificato||0,r.modificato||0);return {out,changed,keys}}

const stack=[];
function openPage(title,body,{actions='',replace=false,mount,bare=false,cls=''}={}){
  if(replace)swapTop();
  const el=document.createElement('div');el.className='page'+(cls?' '+cls:'')+(replace?' pg-swap':'');
  el.innerHTML=bare?`<div class="body bare">${body}</div>`:`<header><button class="ibtn" data-back aria-label="Indietro">←</button><h2>${esc(title)}</h2><div class="row">${actions}</div></header><div class="body">${body}</div>`;
  document.body.append(el);stack.push(el);
  const st={p:stack.length};
  replace?history.replaceState(st,''):history.pushState(st,'');
  el.addEventListener('click',e=>{if(e.target.closest('[data-back]'))history.back()});
  mount&&mount(el);return el;
}
function swapTop(){const t=stack.pop();if(t){t._close&&t._close();if(RM())t.remove();else{t.classList.add('pg-swapout');setTimeout(()=>t.remove(),220)}}}
addEventListener('popstate',()=>{const p=(history.state&&history.state.p)||0;if(stack.length<=p)return;
  const rem=stack.splice(p);rem.forEach(x=>x._close&&x._close());
  const top=stack[stack.length-1];if(top&&top._refresh)setTimeout(()=>{if(stack[stack.length-1]===top)top._refresh()},0);
  const out=(rem.find(x=>x.classList.contains('mu-root'))||rem[rem.length-1])._out;
  const run=()=>{rem.forEach(x=>x.remove());out&&out.after&&out.after()};
  if(!out){if(RM())return run();rem.forEach((x,i)=>{if(i<rem.length-1)return x.remove();x.classList.add('pg-out');setTimeout(()=>x.remove(),270)});return}out.before&&out.before();vt(out.cls,run,out.done)});
function goBase(cb){const n=(history.state&&history.state.p)||0;if(!n){cb&&cb();return}const once=()=>{removeEventListener('popstate',once);cb&&cb()};addEventListener('popstate',once);history.go(-n)}
history.replaceState({p:0},'');

/* numero di serie Apple → fabbrica e periodo di produzione (formati a 11 e 12 caratteri, fino al 2021) */
const SN_PLANT={'CK':'Cork, Irlanda','FC':'Fountain, Colorado (USA)','F':'Fremont, California (USA)','XA':'Stati Uniti','XB':'Stati Uniti','G8':'Stati Uniti','QT':'Taiwan','UV':'Taiwan','EE':'Taiwan','CY':'Corea','PT':'Corea','RN':'Messico','SG':'Singapore','E':'Singapore','VM':'Repubblica Ceca (Foxconn)','W8':'Shanghai, Cina','YM':'Cina (Foxconn)','7J':'Cina (Foxconn)','1C':'Cina','4H':'Cina','QP':'Cina','GQ':'Cina','ZM':'Cina','RM':'ricondizionato da Apple'};
const SN_Y12='CDFGHJKLMNPQRSTVWXYZ',SN_W12='123456789CDFGHJKLMNPQRTVWXY';
const MESI_IT=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function weekMonth(y,w){const d=new Date(y,0,1+(w-1)*7+3);return MESI_IT[d.getMonth()]+' '+y}
function decodeSerial(sn,anno){
  const s=String(sn||'').trim().toUpperCase().replace(/[\s-]/g,'');if(!s)return null;
  const near=(c)=>{if(!c.length)return null;if(!anno)return c[0];return c.slice().sort((a,b)=>Math.abs(a-anno)-Math.abs(b-anno))[0]};
  const plant=(c,one)=>SN_PLANT[c.slice(0,2)]||(one&&SN_PLANT[c[0]])||(/^[CDFGHWY]/.test(c)?'Cina (codice '+c+')':'codice '+c);
  if(/^[A-Z0-9]{12}$/.test(s)){const yi=SN_Y12.indexOf(s[3]),wi=SN_W12.indexOf(s[4]);if(yi<0||wi<0)return {raw:s,nota:'Formato a 12 caratteri non riconosciuto'};
    const y0=2010+Math.floor(yi/2),half=yi%2,y=near([y0,y0+10].filter(x=>x<=2021))||y0,w=wi+1+(half?26:0);
    return {raw:s,fabbrica:plant(s.slice(0,3)),anno:y,settimana:w,quando:`${weekMonth(y,w)} (settimana ${w})`,modello:s.slice(8),formato:12}}
  if(/^[A-Z0-9]{2}\d{3}[A-Z0-9]{6}$/.test(s)||/^[A-Z0-9]{2}\d{3}[A-Z0-9]{3,6}$/.test(s)&&s.length===11){const yd=+s[2],w=+s.slice(3,5);if(w<1||w>53)return {raw:s,nota:'Settimana non valida'};
    const y=near([1990+yd,2000+yd,2010+yd].filter(x=>x>=1997&&x<=2012))||2000+yd;
    return {raw:s,fabbrica:plant(s.slice(0,2),true),anno:y,settimana:w,quando:`${weekMonth(y,w)} (settimana ${w})`,modello:s.slice(8),formato:11}}
  if(/^[A-Z0-9]{10}$/.test(s))return {raw:s,nota:'Seriale casuale (Apple dal 2021): non contiene fabbrica né data'};
  return null;
}
function serialHTML(d){const r=decodeSerial(d.seriale,d.anno);if(!r)return '';
  if(r.nota)return `<div class="sn">ℹ️ ${esc(r.nota)}</div>`;
  const warn=d.anno&&r.anno&&Math.abs(r.anno-d.anno)>3?` · ⚠️ lontano dall'anno del modello (${d.anno})`:'';
  return `<div class="sn">🏭 ${esc(r.fabbrica)} · 📅 ${esc(r.quando)}${r.modello?` · codice modello ${esc(r.modello)}`:''}${warn}<small> (indicativo)</small></div>`}
function fieldDisplay(d,k){

    const draw=()=>{const q=$('#pdq',el).value.trim().toLowerCase();$('#pdl',el).innerHTML=list.filter(x=>!q||x._i.includes(q)).slice(0,80).map(x=>`<button class="pj" data-pk="${x.id}"><div class="th">${x.thumb?`<img src="${x.thumb}" alt="">`:icon(x)}</div><div class="pi"><b>${esc(x.nome)}</b><small>${esc([x.anno,x.stato,x.luogo].filter(Boolean).join(' · '))}</small></div></button>`).join('')||'<p class="note">Nessun oggetto trovato</p>'};
    draw();$('#pdq',el).oninput=draw;
    el.addEventListener('click',e=>{const b=e.target.closest('[data-pk]');if(b)cb(devices.find(x=>x.id===b.dataset.pk))});
  }});
}
function openProject(d,pid,replace){
  const P=()=>(d.progetti||[]).find(x=>x.id===pid);if(!P())return;
  openPage('Progetto','<div id="pj"></div>',{replace,mount(el){
    let tick=null;
    const save=async()=>{await saveDev(d);render()};
    const draw=()=>{const p=P();if(!p)return history.back();const pr=projProg(p),tm=timerGet(),run=tm&&tm.pid===p.id,tot=pzTot(p);
      const pz=p.pezzi||[],can=devices.some(inStock);
      $('#pj',el).innerHTML=`<input class="in pt" id="ptt" value="${esc(p.titolo)}" aria-label="Titolo del progetto">
      <p style="margin:4px 0 8px;color:var(--mute)"><a href="#" data-go="${d.id}">${esc(d.nome)}</a>${p.es?' · '+esc(esLab(d,p.es)):''} · iniziato il ${fmtD(p.creato)}${p.fine?' · finito il '+fmtD(p.fine):''}</p>
      <div class="chips">${PROJ_ST.map(s=>`<button class="chip ${p.stato===s?'on':''}" data-pst="${s}">${PROJ_IC[s]} ${s}</button>`).join('')}</div>
      ${pr.t?`<div class="invbar" style="margin:2px 0 4px"><i style="width:${pr.n/pr.t*100}%"></i></div><small style="color:var(--mute)">${pr.n} di ${pr.t} fasi${tot?' · pezzi '+eur2(tot):''}</small>`:''}
      <details class="psd" ${p.scad?'open':''}><summary>📅 ${p.scad?'Da finire entro il '+fmtD(p.scad):'Scadenza (facoltativa)'}</summary><input class="in" type="date" id="psc" value="${esc(p.scad||'')}"></details>
      <div class="tim ${run?'on':''}"><div style="flex:1"><small>⏱ Tempo di lavoro</small><b id="ptl">${hm((p.min||0)+(run?(Date.now()-tm.t0)/60000:0))}</b>${run?'<small>cronometro acceso</small>':''}</div><button class="btn sm ${run?'dng':''}" data-ptim>${run?'■ Ferma':'▶︎ Avvia'}</button></div>
      <div class="chips" style="margin-top:-2px">${[15,30,60].map(n=>`<button class="chip" data-padd="${n}">＋${hm(n)}</button>`).join('')}</div>
      <div class="sec-t">Fasi</div><div class="log">${(p.fasi||[]).map(f=>`<div class="pf ${f.ok?'done':''}"><input type="checkbox" data-pf="${f.id}" ${f.ok?'checked':''} aria-label="Fatto"><span>${esc(f.t)}${f.ok&&f.data?`<small>${fmtD(f.data)}</small>`:''}</span><button data-pfu="${f.id}" aria-label="Su">↑</button><button data-pfx="${f.id}" aria-label="Elimina">✕</button></div>`).join('')}
        <div class="pf"><input class="in" id="pfn" placeholder="Nuova fase…" style="margin:0"><button class="btn sm" data-pfa>＋</button></div></div>
      <div class="sec-t">Pezzi e materiali${tot?' · '+eur2(tot):''}</div><div class="log">${pz.map(z=>`<div class="pz"><span><b>${esc(z.t)}${+z.qta>1?' ×'+(+z.qta):''}</b><small>${[z.prezzo?eur2(z.prezzo):'',z.part?'🔩 dal magazzino':'',z.link&&/^https?:/.test(z.link)?`<a href="${esc(z.link)}" target="_blank" rel="noopener">link</a>`:''].filter(Boolean).join(' · ')}</small></span><button class="chip pzs ${esc(z.stato.replace(/ /g,'_'))}" data-pzs="${z.id}">${esc(z.stato)}</button><button class="pzx" data-pzx="${z.id}" aria-label="Elimina">✕</button></div>`).join('')}
        <div class="pz"><input class="in" id="pzn" placeholder="Pezzo da comprare…" style="margin:0;flex:2"><input class="in" id="pzp" inputmode="decimal" autocomplete="off" placeholder="€" style="margin:0;flex:1;max-width:84px"><button class="btn sm" data-pza>＋</button></div></div>
      ${can?'<button class="btn sm sec" data-pzm style="margin-top:8px">🔩 Usa un ricambio del magazzino</button>':''}
      <div class="sec-t">Guide e attrezzi</div>${(p.guide||[]).map(g=>`<a class="res" href="${esc(g.url)}" target="_blank" rel="noopener"><b>📖 ${esc(g.t)}</b><small>${esc([g.diff&&'difficoltà '+(IFX_DIFF[g.diff]||g.diff),ifxTime(g.tempo)].filter(Boolean).join(' · ')||'iFixit')}</small></a>`).join('')}
      ${(p.attrezzi||[]).length?`<div class="chips">${p.attrezzi.map(a=>`<span class="chip">🔧 ${esc(a)}</span>`).join('')}</div>`:''}
      <button class="btn sm sec" data-pg>🔎 Cerca guide iFixit</button>
      <div class="sec-t">Prima e dopo</div>
      ${(p.prima||[]).length&&(p.dopo||[]).length?`<div class="pcmp" style="--x:50%"><img src="${p.prima[0]}" alt="prima"><div class="pcd"><img src="${p.dopo[0]}" alt="dopo"></div><i class="pcl"></i><span class="pcb l">prima</span><span class="pcb r">dopo</span><input type="range" min="0" max="100" value="50" id="pcr" aria-label="Confronta prima e dopo"></div>`:''}
      ${['prima','dopo'].map(k=>`<div class="phr"><small>${k==='prima'?'Prima':'Dopo'}</small><div class="phs">${(p[k]||[]).map((f,i)=>`<img src="${f}" alt="" data-pv="${k}|${i}">`).join('')}<label class="phadd">＋<input type="file" accept="image/*" multiple hidden data-pph="${k}"></label></div></div>`).join('')}
      <div class="sec-t">Note</div><textarea class="in" id="pno" placeholder="Appunti, misure, cosa hai scoperto…">${esc(p.note||'')}</textarea>
      ${(p.sess||[]).length?`<details class="more"><summary>Sessioni di lavoro (${p.sess.length})</summary><div class="log">${p.sess.slice().reverse().map(s=>`<div class="li"><span class="ld">${fmtD(s.d)}</span><span class="lb"><b>${hm(s.min)}</b></span></div>`).join('')}</div></details>`:''}
      <div class="acts">${p.stato!=='Finito'?'<button class="btn" data-pend>✔︎ Concludi il progetto</button>':''}<button class="btn sec" data-pcol>🧪 Collaudo</button><button class="btn dng" data-pdel>Elimina progetto</button></div>`;
      clearInterval(tick);if(run)tick=setInterval(()=>{const l=$('#ptl',el);if(l)l.textContent=hm((p.min||0)+(Date.now()-tm.t0)/60000)},15000)};
    el._close=()=>clearInterval(tick);el._refresh=draw;draw();
    el.addEventListener('change',async e=>{const p=P(),t=e.target;
      if(t.id==='ptt'){p.titolo=t.value.trim()||p.titolo;return save()}
      if(t.id==='pno'){p.note=t.value.trim();return save()}
      if(t.id==='psc'){if(t.value)p.scad=t.value;else delete p.scad;await save();return draw()}
      if(t.dataset.pf){const f=p.fasi.find(x=>x.id===t.dataset.pf);f.ok=t.checked;if(f.ok)f.data=today();else delete f.data;if(f.ok&&p.stato==='Da iniziare')p.stato='In corso';await save();return draw()}
      if(t.dataset.pph){const k=t.dataset.pph;for(const f of t.files){try{(p[k]=p[k]||[]).push(await shrink(f,1200))}catch(er){toast('Foto non leggibile')}}await save();return draw()}
    });
    el.addEventListener('input',e=>{if(e.target.id==='pcr')$('.pcmp',el).style.setProperty('--x',e.target.value+'%')});
    el.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='pfn'){e.preventDefault();el.querySelector('[data-pfa]').click()}if(e.target.id==='pzn'||e.target.id==='pzp'){e.preventDefault();el.querySelector('[data-pza]').click()}});
    el.addEventListener('click',async e=>{const p=P(),t=e.target;if(!p)return;
      const go=t.closest('[data-go]');if(go){e.preventDefault();return openDetail(go.dataset.go)}
      const st=t.closest('[data-pst]');if(st){if(st.dataset.pst==='Finito'&&p.stato!=='Finito')return el.querySelector('[data-pend]').click();p.stato=st.dataset.pst;if(p.stato!=='Finito')delete p.fine;await save();return draw()}
      if(t.closest('[data-ptim]')){if(timerGet()&&timerGet().pid===p.id)await timerStop();else{await timerStart(d,p);toast('Cronometro avviato ⏱')}render();return draw()}
      const ad=t.closest('[data-padd]');if(ad){(p.sess=p.sess||[]).push({d:today(),min:+ad.dataset.padd});p.min=(p.min||0)+(+ad.dataset.padd);await save();return draw()}
      if(t.closest('[data-pfa]')){const v=$('#pfn',el).value.trim();if(!v)return;(p.fasi=p.fasi||[]).push({id:uid(),t:v,ok:false});await save();draw();return $('#pfn',el).focus()}
      const fx=t.closest('[data-pfx]');if(fx){p.fasi=p.fasi.filter(x=>x.id!==fx.dataset.pfx);await save();return draw()}
      const fu=t.closest('[data-pfu]');if(fu){const i=p.fasi.findIndex(x=>x.id===fu.dataset.pfu);if(i>0){p.fasi.splice(i-1,0,p.fasi.splice(i,1)[0]);await save();draw()}return}
      if(t.closest('[data-pza]')){const v=$('#pzn',el).value.trim();if(!v)return;(p.pezzi=p.pezzi||[]).push({id:uid(),t:v,prezzo:parsePrice($('#pzp',el).value)||'',stato:'Da comprare'});if(p.stato==='In corso')p.stato='In attesa pezzi';await save();draw();return $('#pzn',el).focus()}
      const zx=t.closest('[data-pzx]');if(zx){p.pezzi=p.pezzi.filter(x=>x.id!==zx.dataset.pzx);await save();return draw()}
      const zs=t.closest('[data-pzs]');if(zs){const z=p.pezzi.find(x=>x.id===zs.dataset.pzs);await pzNext(d,p,z);return draw()}
      if(t.closest('[data-pzm]'))return pickPart(d,async part=>{(p.pezzi=p.pezzi||[]).push({id:uid(),t:part.nome+(part.part_spec?' ('+part.part_spec+')':''),part:part.id,stato:'Arrivato',prezzo:''});await save();history.back()});
      if(t.closest('[data-pg]'))return openGuides(d,p);
      const pv=t.closest('[data-pv]');if(pv){const [k,i]=pv.dataset.pv.split('|');return openViewer(p[k],+i,{onCover:null})}
      if(t.closest('[data-pcol]'))return openCollaudo(d,p.es&&hasUnits(d)?d.esemplari.find(u=>u.id===p.es):null);
      if(t.closest('[data-pdel]')){if(!await ask(`Eliminare il progetto «${p.titolo}»? Fasi, pezzi, foto e tempi andranno persi.`,'Elimina',true))return;if(timerGet()&&timerGet().pid===p.id)LS.set('rd_timer',null);d.progetti=d.progetti.filter(x=>x!==p);await save();toast('Progetto eliminato');return history.back()}
      if(t.closest('[data-pend]'))return endProject(d,p,draw);
    });
  }});
}
async function pzNext(d,p,z){const i=PZ_ST.indexOf(z.stato);z.stato=PZ_ST[(i+1)%PZ_ST.length];
  if(z.stato==='Arrivato'&&!z.part&&await ask(`«${z.t}» è arrivato! Lo registro anche nel magazzino ricambi (compatibile con «${d.nome}»)? Alla fine del progetto risulterà montato.`,'Sì, nel magazzino')){
    const o={id:uid(),nome:z.t,tipologia:'Ricambio',part_cat:partCat(z.t),compat:[d.id],quantita:+z.qta||1,luogo:d.luogo||'',acq_anno:new Date().getFullYear(),creato:Date.now(),modificato:Date.now()};if(z.prezzo)o.acq_prezzo=z.prezzo;
    stamp(o);idx(o);await DB.put(o);devices.push(o);z.part=o.id}
  if(!projBlocked(p)&&p.stato==='In attesa pezzi')p.stato='In corso';
  await saveDev(d);render()}
function pickPart(d,cb){const {sure,maybe}=partsFor(d),rest=devices.filter(inStock).filter(x=>!sure.includes(x)&&!maybe.includes(x)).sort((a,b)=>String(a.nome).localeCompare(b.nome,'it'));
  openPage('Dal magazzino',`${sure.length?'<div class="sec-t">Compatibili</div>':''}${sure.map(card).join('')}${maybe.length?'<div class="sec-t">Forse compatibili</div>':''}${maybe.map(card).join('')}${rest.length?'<div class="sec-t">Altri ricambi</div>':''}${rest.map(card).join('')}`,{mount(el){
    el.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)cb(devices.find(x=>x.id===c.dataset.id))})}})}
function openGuides(d,p){
  const q0=[d.nome].filter(Boolean).join(' ').replace(/\(.*?\)|["“”]/g,'').trim();
  openPage('Guide iFixit',`<div class="row"><input class="in" id="gq" value="${esc(q0)}" autocomplete="off"><button class="btn" id="gb">Cerca</button></div><div id="gl"></div>`,{mount(el){
    const run=async()=>{const q=$('#gq',el).value.trim();if(!q)return;$('#gl',el).innerHTML=loader('web','Cerco guide…');
      try{const w=q.split(/\s+/),tries=[q,...w.map((_,i)=>w.slice(0,w.length-1-i).join(' ')).filter(x=>x.length>=3)];let r=[],used=q;
        for(const t of [...new Set(tries)]){const j=await wjson(`${IFX}/search/${encodeURIComponent(t)}?filter=guide&limit=15`);r=(j.results||[]).filter(x=>x.guideid);used=t;if(r.length)break}
        $('#gl',el).innerHTML=(r.length&&used!==q?`<p class="note" style="margin:8px 0">Nessuna guida per «${esc(q)}»: ecco quelle per «${esc(used)}».</p>`:'')+r.map(x=>`<button class="pj" data-gid="${x.guideid}"><div class="th">${x.image&&x.image.thumbnail?`<img src="${esc(x.image.thumbnail)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith('📖')">`:'📖'}</div><div class="pi"><b>${esc(x.title)}</b><small>${esc([x.subject,x.category].filter(Boolean).join(' · '))}</small></div></button>`).join('')||'<p class="note">Nessuna guida: prova con un nome più corto (es. «PowerBook G4»).</p>'}
      catch(er){$('#gl',el).innerHTML=`<p class="note">iFixit non raggiungibile (${esc(er.message)}).</p>`}};
    run();$('#gb',el).onclick=run;$('#gq',el).onkeydown=e=>{if(e.key==='Enter')run()};
    el.addEventListener('click',async e=>{const b=e.target.closest('[data-gid]');if(!b)return;b.disabled=true;
      let g;try{g=await wjson(`${IFX}/guides/${b.dataset.gid}`)}catch(er){b.disabled=false;return toast('Guida non raggiungibile')}
      const parts=(g.parts||[]).map(x=>x.text).filter(Boolean),tools=(g.tools||[]).map(x=>x.text).filter(Boolean);
      openPage('Guida',`<p style="margin-top:0"><b>${esc(g.title)}</b></p><p class="note" style="margin:6px 0">${esc([g.difficulty&&('Difficoltà: '+(IFX_DIFF[g.difficulty]||g.difficulty)),ifxTime(g.time_required)&&('Tempo: '+ifxTime(g.time_required)),(g.steps||[]).length+' passaggi'].filter(Boolean).join(' · '))}</p>
        ${parts.length?`<div class="sec-t">Pezzi (vanno nella lista della spesa)</div>${parts.map((x,i)=>`<label class="row" style="gap:10px;margin:6px 0"><input type="checkbox" data-gp="${i}" checked style="width:20px;height:20px"> ${esc(x)}</label>`).join('')}`:''}
        ${tools.length?`<div class="sec-t">Attrezzi</div><div class="chips">${tools.map(x=>`<span class="chip">🔧 ${esc(x)}</span>`).join('')}</div>`:''}
        <div class="row" style="margin-top:16px;flex-wrap:wrap"><button class="btn" id="gadd">Aggiungi al progetto</button><a class="btn sec" href="${esc(g.url)}" target="_blank" rel="noopener">Apri la guida</a></div>`,{mount(el2){
        $('#gadd',el2).onclick=async()=>{const sel=[...el2.querySelectorAll('[data-gp]:checked')].map(x=>parts[+x.dataset.gp]);
          p.guide=[...(p.guide||[]).filter(x=>x.url!==g.url),{t:g.title,url:g.url,diff:g.difficulty||'',tempo:g.time_required||''}];
          if(sel.length){p.pezzi=[...(p.pezzi||[]),...sel.filter(s=>!(p.pezzi||[]).some(z=>z.t===s)).map(s=>({id:uid(),t:s,prezzo:'',stato:'Da comprare'}))];if(p.stato==='In corso')p.stato='In attesa pezzi'}
          if(tools.length)p.attrezzi=[...new Set([...(p.attrezzi||[]),...tools])];
          const ft='Seguire la guida: '+g.title;if(!(p.fasi||[]).some(f=>f.t===ft)){const k=(p.fasi||[]).findIndex(f=>/^collaudo finale$/i.test(f.t));const nf={id:uid(),t:ft,ok:false};p.fasi=p.fasi||[];k<0?p.fasi.push(nf):p.fasi.splice(k,0,nf)}
          await saveDev(d);render();toast(`Guida aggiunta${sel.length?` · ${sel.length} ${sel.length===1?'pezzo':'pezzi'} nella lista della spesa`:''}`,3200);history.go(-2)};
      }});b.disabled=false});
  }});
}
async function endProject(d,p,redraw){
  const toMount=(p.pezzi||[]).filter(z=>z.part&&z.stato!=='Montato'&&devices.some(x=>x.id===z.part&&inStock(x)));
  if(!await ask(`Concludere «${p.titolo}»? Scrivo l'intervento nel registro${toMount.length?` e segno ${toMount.length===1?'il ricambio':toMount.length+' ricambi'} del magazzino come montat${toMount.length===1?'o':'i'}`:''}.`,'Concludi'))return;
  if(timerGet()&&timerGet().pid===p.id)await timerStop(true);
  p.stato='Finito';p.fine=today();
  for(const z of toMount){const part=devices.find(x=>x.id===z.part);if(+part.quantita>1)part.quantita=+part.quantita-1;else{part.montato_su=d.id;part.montato_il=today()}await saveDev(part)}
  (p.pezzi||[]).forEach(z=>{if(z.stato==='Arrivato'||toMount.includes(z))z.stato='Montato'});
  const done=(p.fasi||[]).filter(f=>f.ok).map(f=>f.t),tot=pzTot(p);
  (d.interventi=d.interventi||[]).push({id:uid(),data:today(),tipo:p.tipo||'Riparazione',desc:[p.titolo+(p.es?' ('+esLab(d,p.es)+')':''),done.length?'fatto: '+done.join(', '):'',(p.pezzi||[]).length?'pezzi: '+p.pezzi.map(z=>z.t).join(', '):'',p.min?hm(p.min)+' di lavoro':''].filter(Boolean).join(' · '),costo:tot?String(Math.round(tot*100)/100):'',proj:p.id});
  await saveDev(d);
  if((p.dopo||[]).length&&await ask(`Aggiungo ${p.dopo.length===1?'la foto':'le '+p.dopo.length+' foto'} «dopo» alla galleria di «${d.nome}»?`,'Aggiungi')){d.foto=[...(d.foto||[]),...p.dopo.filter(f=>!(d.foto||[]).includes(f))];if(!d.thumb&&d.foto.length)d.thumb=await shrink(d.foto[0],180,.75);await saveDev(d)}
  render();toast('Progetto concluso 🎉 e scritto nel registro interventi',3200);
  if(await ask('Fai subito il collaudo finale?','🧪 Collaudo'))return openCollaudo(d,p.es&&hasUnits(d)?d.esemplari.find(u=>u.id===p.es):null);
  redraw&&redraw()}
/* ---- elenchi del laboratorio ---- */
function toTest(){const out=[];for(const d of devices){if(d.wish||d.ruolo==='In uso'||d.montato_su)continue;
  if(hasUnits(d))d.esemplari.forEach((u,i)=>{if(u.stato==='Da testare')out.push({d,u})});else if(d.stato==='Da testare')out.push({d,u:null})}return out}
const shopList=()=>allProjects().filter(({p})=>p.stato!=='Finito').flatMap(({d,p})=>(p.pezzi||[]).filter(z=>['Da comprare','Ordinato'].includes(z.stato)).map(z=>({d,p,z})));
function projRow({d,p}){const pr=projProg(p),tm=timerGet(),run=tm&&tm.pid===p.id,tot=pzTot(p);
  return `<button class="pj" data-op="${d.id}|${p.id}"><div class="th">${(p.dopo||[])[0]&&p.stato==='Finito'?`<img src="${p.dopo[0]}" alt="">`:d.thumb?`<img src="${d.thumb}" alt="">`:icon(d)}</div><div class="pi"><b>${run?'⏱ ':''}${esc(p.titolo)}</b><small>${esc([d.nome+(p.es?' · '+esLab(d,p.es):''),pr.t?pr.n+'/'+pr.t+' fasi':'',p.min?hm(p.min):'',tot?eur2(tot):'',projBlocked(p)&&p.stato!=='Finito'?'🛒 pezzi da prendere':''].filter(Boolean).join(' · '))}</small>${pr.t&&p.stato!=='Finito'?`<div class="pbar"><i style="width:${pr.n/pr.t*100}%"></i></div>`:''}</div></button>`}
function openLab(tab='prog'){
  openPage('Laboratorio','<div class="chips" id="lt"></div><div id="lb"></div>',{mount(el){
    const draw=()=>{const ap=allProjects(),open=ap.filter(x=>x.p.stato!=='Finito'),tt=toTest(),sh=shopList();
      const plans=devices.filter(d=>!d.wish).flatMap(d=>(d.interventi||[]).filter(i=>i.coll&&!i.fatto).map(i=>({d,i}))).sort((a,b)=>a.i.prossimo.localeCompare(b.i.prossimo));
      $('#lt',el).innerHTML=[['prog',`🛠️ Progetti${open.length?' · '+open.length:''}`],['coll',`🧪 Da collaudare${tt.length+plans.length?' · '+(tt.length+plans.length):''}`],['spesa',`🛒 Lista della spesa${sh.length?' · '+sh.length:''}`],['stat','📊 Statistiche']].map(([k,l])=>`<button class="chip ${tab===k?'on':''}" data-lt="${k}">${l}</button>`).join('');
      let h='';
      if(tab==='prog'){h=`<button class="btn" data-lnew style="width:100%;margin:4px 0 6px">＋ Nuovo progetto</button>`;

/* ---- statistiche ed esportazioni del laboratorio ---- */
const MESI_B=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const last12=()=>{const d=new Date(today()+'T12:00'),out=[];for(let i=11;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,15);out.push(x.toISOString().slice(0,7))}return out};
const monLab=k=>MESI_B[+k.slice(5,7)-1]+' '+k.slice(2,4);
const dDays=(a,b)=>Math.max(0,Math.round((Date.parse(b)-Date.parse(a))/864e5));
const trimLead=a=>{const i=a.findIndex(x=>x[1]);return i<0?a:a.slice(i)};
function barsHTML(a,fmt=v=>v,cls=''){const mx=Math.max(...a.map(x=>x[1]),1);return a.map(([n,v])=>`<div class="bar ${cls}"><span>${esc(n)}</span><div style="width:${v/mx*50}%"></div><span>${fmt(v)}</span></div>`).join('')}
function labStats(){
  const L=devices.filter(d=>!d.wish),ap=L.flatMap(d=>(d.progetti||[]).map(p=>({d,p}))),fin=ap.filter(x=>x.p.stato==='Finito'),cs=L.flatMap(d=>(d.collaudi||[]).map(c=>({d,c}))),ints=L.flatMap(d=>(d.interventi||[]).filter(i=>i.data).map(i=>({d,i})));
  const mins=ap.reduce((s,x)=>s+(x.p.min||0),0),pz=ap.reduce((s,x)=>s+pzTot(x.p),0),spInt=ints.reduce((s,x)=>s+(parseFloat(x.i.costo)||0),0);
  const okC=cs.filter(x=>x.c.esito==='ok').length;
  const M=last12(),mm=new Map(M.map(k=>[k,{min:0,eur:0,coll:0,fin:0}]));
  ap.forEach(({p})=>(p.sess||[]).forEach(s=>{const r=mm.get(String(s.d).slice(0,7));if(r)r.min+=s.min||0}));
  ints.forEach(({i})=>{const r=mm.get(String(i.data).slice(0,7));if(r)r.eur+=parseFloat(i.costo)||0});
  cs.forEach(({c})=>{const r=mm.get(String(c.data).slice(0,7));if(r)r.coll++});
  fin.forEach(({p})=>{const r=mm.get(String(p.fine).slice(0,7));if(r)r.fin++});
  const dur=fin.filter(x=>x.p.fine&&x.p.creato).map(x=>dDays(x.p.creato,x.p.fine));
  const byT=new Map();ap.forEach(({p})=>{const t=p.tipo||'Riparazione',r=byT.get(t)||{n:0,min:0,eur:0};r.n++;r.min+=p.min||0;r.eur+=pzTot(p);byT.set(t,r)});
  const ko=new Map();cs.forEach(({c})=>(c.r||[]).filter(x=>x.e==='ko').forEach(x=>ko.set(x.t,(ko.get(x.t)||0)+1)));
  const work=new Map();ap.forEach(({d,p})=>{const r=work.get(d.id)||{d,min:0,eur:0};r.min+=p.min||0;work.set(d.id,r)});ints.forEach(({d,i})=>{const r=work.get(d.id)||{d,min:0,eur:0};r.eur+=parseFloat(i.costo)||0;work.set(d.id,r)});
  const st=new Map();L.filter(d=>d.ruolo!=='In uso'&&!d.montato_su).forEach(d=>(hasUnits(d)?d.esemplari.map(u=>u.stato):[d.stato]).forEach(s=>st.set(s||'Non indicato',(st.get(s||'Non indicato')||0)+1)));
  const order=[...STATI,'Non indicato'];
  const tile=(a,b)=>`<div class="tile"><small>${a}</small><b>${b}</b></div>`;
  let h=`<div class="tiles">${tile('Progetti finiti',`${fin.length} di ${ap.length}`)}${tile('Tempo di lavoro',hm(mins))}${tile('Spesa in pezzi',eur2(pz))}${tile('Spesa nel registro',eur2(spInt))}${tile('Collaudi',`${cs.length}${cs.length?` · ${Math.round(okC/cs.length*100)}% ok`:''}`)}${tile('Durata media',dur.length?`${Math.round(dur.reduce((s,x)=>s+x,0)/dur.length)} giorni`:'—')}</div>`;
  if(!ap.length&&!cs.length&&!ints.length)return h+'<p class="note">Le statistiche si riempiono con i progetti, i collaudi e gli interventi.</p>';
  if(M.some(k=>mm.get(k).min))h+=`<div class="sec-t">Ore di lavoro per mese</div>`+barsHTML(trimLead(M.map(k=>[monLab(k),mm.get(k).min])),v=>v?hm(v):'');
  if(M.some(k=>mm.get(k).eur))h+=`<div class="sec-t">Spesa per mese (registro interventi)</div>`+barsHTML(trimLead(M.map(k=>[monLab(k),mm.get(k).eur])),v=>v?eur2(Math.round(v)):'','b2');
  if(M.some(k=>mm.get(k).coll))h+=`<div class="sec-t">Collaudi per mese</div>`+barsHTML(trimLead(M.map(k=>[monLab(k),mm.get(k).coll])),v=>v||'','b3');
  if(M.some(k=>mm.get(k).fin))h+=`<div class="sec-t">Progetti finiti per mese</div>`+barsHTML(trimLead(M.map(k=>[monLab(k),mm.get(k).fin])),v=>v||'','b3');
  if(byT.size)h+=`<div class="sec-t">Progetti per tipo</div><div class="kv">${[...byT].sort((a,b)=>b[1].n-a[1].n).map(([t,r])=>`<div>${esc(t)}</div><div>${r.n} · ${hm(r.min)}${r.eur?' · '+eur2(Math.round(r.eur)):''}</div>`).join('')}</div>`;
  if(ko.size)h+=`<div class="sec-t">Guasti più frequenti nei collaudi</div>`+barsHTML([...ko].sort((a,b)=>b[1]-a[1]).slice(0,8),v=>v+'×','b4');
  const top=[...work.values()].filter(r=>r.min||r.eur).sort((a,b)=>(b.min+b.eur*2)-(a.min+a.eur*2)).slice(0,6);
  if(top.length)h+=`<div class="sec-t">Gli oggetti che hanno chiesto più lavoro</div><div class="log">${top.map(r=>`<button class="li" data-go="${r.d.id}"><span class="lb"><b>${esc(r.d.nome)}</b><small>${[r.min?hm(r.min):'',r.eur?eur2(Math.round(r.eur))+' di interventi':''].filter(Boolean).join(' · ')}</small></span></button>`).join('')}</div>`;
  if(st.size)h+=`<div class="sec-t">Stato della collezione</div>`+barsHTML([...st].sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0])));
  return h;
}

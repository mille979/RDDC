<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f2e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#110d07" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>RDDC – Collezione vintage</title>
<style>
:root{--bg:#f8f2e7;--card:#fffaf1;--ink:#24190b;--mute:#76674f;--line:#eadcc4;--acc:#f2a531;--acc-ink:#9c5a00;--on-acc:#2b1a02;--acc2:#3d7a66;--chip:#f4e6cc;--dng:#b3261e;--shadow:0 1px 2px rgba(80,50,0,.10),0 4px 14px rgba(80,50,0,.06);--glow:rgba(242,165,49,.45)}
@media (prefers-color-scheme:dark){:root{--bg:#110d07;--card:#1c160e;--ink:#f7ecd9;--mute:#a99679;--line:#33281a;--acc:#ffb547;--acc-ink:#ffbd5c;--on-acc:#2b1a02;--acc2:#7cc4ad;--chip:#2a2015;--dng:#d2463b;--shadow:0 1px 3px rgba(0,0,0,.5);--glow:rgba(255,181,71,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.brand{font:700 15px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.2em;color:var(--acc-ink);text-shadow:0 0 12px var(--glow);padding:2px 2px 9px;display:flex;align-items:baseline;gap:10px}
.brand{align-items:center}
.seg{margin-left:auto;display:flex;background:var(--chip);border-radius:11px;padding:3px;gap:2px;text-shadow:none;letter-spacing:0}
.seg button{border:0;background:none;border-radius:8px;padding:6px 11px;font:650 13px/1 system-ui,sans-serif;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg i{font-style:normal;font-weight:500;opacity:.7;margin-left:4px}
.prio{color:var(--acc-ink);font-weight:700}
.brand small{font:600 11px/1 system-ui,sans-serif;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;text-shadow:none}
.row{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.search:focus,.in:focus{outline:2px solid var(--acc);outline-offset:-1px}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-width:44px;min-height:44px;position:relative;text-decoration:none;display:inline-grid;place-items:center}
.badge{position:absolute;top:-6px;right:-6px;background:var(--acc);color:var(--on-acc);border-radius:10px;font-size:11px;font-weight:700;padding:1px 6px}
#sum{font-size:13px;color:var(--mute);padding:6px 2px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{background:var(--chip);border-radius:14px;padding:3px 10px;font-size:13px;border:0}
.pill.x::after{content:" ✕";opacity:.6}
#list{padding:4px 12px 110px}
.gh{position:sticky;top:var(--hh,120px);background:var(--bg);font-weight:700;color:var(--acc-ink);padding:12px 2px 4px;font-size:14px;letter-spacing:.04em;z-index:2}
.gh small{color:var(--mute);font-weight:400}
.card{display:flex;gap:12px;background:var(--card);border-radius:16px;padding:10px;margin:8px 0;box-shadow:var(--shadow);align-items:center}
.th{width:66px;height:66px;border-radius:12px;background:var(--chip);flex:none;display:grid;place-items:center;font-size:28px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.ct{min-width:0;flex:1}
.ct b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct>span{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:10px;font-size:12px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden}
.meta span{display:inline-flex;align-items:center;gap:4px}
.yr{font-weight:700;color:var(--acc-ink);background:var(--chip);border-radius:10px;padding:3px 8px;font-size:13px;font-variant-numeric:tabular-nums;align-self:flex-start}
.qty{font-weight:700;color:var(--acc-ink)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c,transparent);border:1px solid rgba(127,127,127,.55);flex:none;vertical-align:-1px}
.empty{text-align:center;color:var(--mute);padding:60px 20px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:30px;border:0;background:var(--acc);color:var(--on-acc);font-size:32px;box-shadow:0 4px 18px var(--glow),0 2px 6px rgba(0,0,0,.25);z-index:6}
.page{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.page>header{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.page>header h2{flex:1;margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page .body{flex:1;overflow:auto;padding:12px 14px calc(30px + env(safe-area-inset-bottom))}
.page .body.bare{padding:0}
.btn{border:0;background:var(--acc);color:var(--on-acc);border-radius:12px;padding:11px 16px;font-weight:650;text-decoration:none;display:inline-block;text-align:center}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.dng{background:var(--dng);color:#fff}
.btn.sm{padding:7px 12px;font-size:14px}
.sec-t{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink);font-weight:750;margin:22px 0 7px}
.kv{display:grid;grid-template-columns:minmax(100px,38%) 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.kv>div{background:var(--card);padding:9px 11px;word-break:break-word}
.kv>div:nth-child(odd){color:var(--mute);font-size:14px}
.kv a{color:var(--acc-ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:16px;padding:5px 11px;font-size:14px}
.chip.on{background:var(--acc);color:var(--on-acc);font-weight:600}
.chip i{font-style:normal;opacity:.65;margin-left:4px;font-size:12px}
label.f{display:block;margin:10px 0 2px;font-size:13px;color:var(--mute)}
.in{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
textarea.in{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.photos .ph{position:relative;flex:none;scroll-snap-align:start}
.photos img{height:200px;max-width:86vw;border-radius:12px;display:block;object-fit:contain;background:var(--chip)}
.photos.sm img{height:84px}
.ph button{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:26px;height:26px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--chip)}
.res{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.res small{display:block;color:var(--mute)}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px}
.bar div{height:14px;background:var(--acc);border-radius:7px;min-width:3px}
.bar span:first-child{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--mute);margin:10px 0}
.note b{color:var(--ink)}
#toast button{border:0;background:none;color:var(--acc);font-weight:750;margin-left:12px;padding:2px 4px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#241a0c;color:#fff3df;padding:10px 16px;border-radius:20px;z-index:99;font-size:14px;max-width:88vw;display:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:grid;place-items:center;padding:20px}
.modal>div{background:var(--card);border-radius:16px;padding:18px;max-width:380px;width:100%}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
a{color:var(--acc-ink)}
/* ---- scheda: header con foto ---- */
.hero{position:relative;height:min(64vh,480px);min-height:300px;overflow:hidden;background:#1a1208;color:#fff}
.hero .himg,.hero .hbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .hbg{display:none;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);filter:blur(28px) saturate(1.25) brightness(.85)}
.hero.fit .hbg{display:block}
.hero.fit .himg{object-fit:contain;padding:calc(58px + env(safe-area-inset-top)) 12px 118px}
.hero.noph{height:auto;min-height:calc(270px + env(safe-area-inset-top));background:radial-gradient(120% 90% at 75% 5%,#ffc867 0%,#d27b0c 38%,#5a3203 75%,#2a1704 100%)}
.hicon{position:absolute;inset:env(safe-area-inset-top) 0 96px;display:grid;place-items:center;font-size:92px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.hb{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(20,12,2,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:18px;display:grid;place-items:center}
.hb.l{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:2}
.hbr{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:8px;z-index:2}
.cap{position:absolute;left:0;right:0;bottom:0;padding:76px 18px 16px;isolation:isolate}
.cap::before{content:"";position:absolute;inset:0;z-index:-1;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(to top,#000 42%,transparent);mask-image:linear-gradient(to top,#000 42%,transparent);background:linear-gradient(to top,rgba(18,11,2,.80),rgba(18,11,2,.38) 62%,rgba(18,11,2,0))}
.cap small{display:block;color:#ffd08a;font-weight:650;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase}
.cap h1{margin:3px 0 0;font-size:clamp(22px,6.6vw,34px);line-height:1.12;font-weight:800;letter-spacing:-.01em;text-shadow:0 1px 14px rgba(0,0,0,.35);overflow-wrap:anywhere}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:4px 10px;font-size:13px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 0}
.thumbs img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:var(--chip);border:2px solid transparent}
.thumbs img.on{border-color:var(--acc)}
.dbody{padding:4px 14px calc(30px + env(safe-area-inset-bottom))}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:14px 0 2px}
.tile{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.tile small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.tile b{display:block;font-size:15px;margin-top:2px;overflow-wrap:anywhere;line-height:1.25}
.desc{line-height:1.55;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.desc>div{white-space:pre-line}
.desc>div.cl{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.linkb{border:0;background:none;color:var(--acc-ink);font-weight:650;padding:6px 2px}
details.more{margin-top:22px}
details.more>summary{list-style:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink);font-weight:750;padding:8px 0;cursor:pointer}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details.more[open]>summary::before{transform:rotate(90deg)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.viewer{background:#000}
.vw{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%}
.vw img{flex:none;width:100vw;height:100%;object-fit:contain;scroll-snap-align:center}
/* ---- form ---- */
.swrow{display:flex;gap:9px;overflow-x:auto;padding:8px 2px 4px}
.swb{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid rgba(127,127,127,.5);background:var(--c)}
.swb.on{outline:3px solid var(--acc);outline-offset:2px}
.swbig{width:44px;height:44px;border-radius:12px;flex:none;border:1px solid var(--line);background:var(--c,transparent)}
.swbig.none{background:repeating-linear-gradient(45deg,var(--chip) 0 6px,var(--card) 6px 12px)}
.step{margin:8px 0}
/* registro interventi */
.log{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;gap:12px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.ld{flex:none;width:92px;color:var(--acc-ink);font-weight:700;font-size:13px}
.lb{min-width:0}.lb b{display:block}.lb span{display:block;font-size:14px;white-space:pre-line}.lb small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.due{display:block;width:100%;text-align:left;border:1px solid var(--acc);background:var(--chip);color:var(--ink);border-radius:14px;padding:10px 12px;margin:10px 0 4px;font-weight:600}
.due.late{border-color:var(--dng)}
.due small{display:block;font-weight:400;color:var(--mute)}
/* griglia */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}
.gcard{position:relative;border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column}
.gcard .gi{aspect-ratio:1;background:#fff;display:grid;place-items:center;font-size:46px;overflow:hidden}
.gcard .gi.ni{background:radial-gradient(120% 90% at 70% 10%,#ffc867 0%,#d27b0c 45%,#5a3203 100%)}
.gcard .gi img{width:100%;height:100%;object-fit:contain}
.gcard .gt{padding:8px 10px 10px}
.gcard b{font-size:14px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gcard small{display:block;color:var(--mute);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gy{position:absolute;top:8px;left:8px;background:rgba(20,12,2,.62);color:#ffd08a;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* linea del tempo */
.tl{position:relative;margin:4px 0 0 8px;padding-left:20px;border-left:2px solid var(--line)}
.ty{position:relative;margin:20px 0 6px;font:800 21px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--acc-ink);letter-spacing:.04em}
.ty::before{content:"";position:absolute;left:-28px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--bg),0 0 14px var(--glow)}
.ty small{font:500 12px system-ui,sans-serif;color:var(--mute);margin-left:8px;letter-spacing:0}
/* catalogo stampabile */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff!important;color:#111!important}
  body>*:not(#print){display:none!important}
  #print{display:block;font:10.5pt/1.4 system-ui,-apple-system,Roboto,sans-serif;color:#111}
}
#print .pc{height:262mm;display:flex;flex-direction:column;justify-content:center;border-left:7mm solid #f2a531;padding-left:12mm;break-after:page}
#print .pc h1{font:800 46pt/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.16em;margin:0;color:#9c5a00}
#print .pc h2{font-size:22pt;margin:8mm 0 3mm;font-weight:700}
#print .pc p{color:#555;margin:1mm 0;font-size:11pt}
#print .pidx{break-after:page}
#print table{width:100%;border-collapse:collapse;font-size:8.5pt}
#print td,#print th{border-bottom:.2mm solid #e2d6c0;padding:1.3mm 2mm;text-align:left;vertical-align:top}
#print th{color:#9c5a00;font-size:7.5pt;text-transform:uppercase;letter-spacing:.06em}
#print .sec{font-weight:800;font-size:9pt;text-transform:uppercase;letter-spacing:.12em;color:#9c5a00;margin:7mm 0 0;border-bottom:.5mm solid #f2a531;padding-bottom:1mm;break-after:avoid}
#print .pe{display:grid;grid-template-columns:60mm 1fr;gap:6mm;padding:5mm 0;border-bottom:.3mm solid #eadcc4;break-inside:avoid}
#print .pe img,#print .pe .noimg{width:60mm;height:46mm;object-fit:contain;background:#f8f2e7;border-radius:2mm}
#print .pe .noimg{display:grid;place-items:center;font-size:30pt}
#print .pe h3{font-size:14pt;margin:0 0 1mm;line-height:1.2}
#print .pe .ps{font-weight:700;font-size:8pt;color:#9c5a00;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2mm}
#print .pe dl{display:grid;grid-template-columns:30mm 1fr;gap:.7mm 3mm;margin:0;font-size:8.8pt}
#print .pe dt{color:#7a6a52}#print .pe dd{margin:0}
#print .pe .pd{font-size:9pt;margin-top:2.5mm;color:#333}
</style>
</head>
<body>
<div id="top">
  <div class="brand">RDDC<div class="seg" id="seg"><button data-view="col">Collezione<i id="nC"></i></button><button data-view="wish">Wishlist<i id="nW"></i></button></div></div>
  <div class="row">
    <input id="q" class="search" type="search" placeholder="Cerca: nome, A1278, EMC, colore, note…" autocomplete="off">
    <button class="ibtn" id="bView" aria-label="Cambia vista">▤</button>
    <button class="ibtn" id="bFil" aria-label="Filtri">⚙︎ <span class="badge" id="nF" hidden></span></button>
    <button class="ibtn" id="bMenu" aria-label="Menu">☰</button>
  </div>
  <div id="sum"></div>
</div>
<div id="list"></div>
<button class="fab" id="fab" aria-label="Aggiungi">+</button>
<div id="toast"></div>
<div id="print"></div>

<script>
'use strict';
/* ============ util ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fmtD=s=>{if(!s)return '';const d=new Date(String(s).slice(0,10)+'T12:00');return isNaN(d)?String(s):d.toLocaleDateString('it',{day:'numeric',month:'short',year:'numeric'})};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const spin=m=>`<span class="spin"></span>${esc(m)}`;
function toast(m,ms=2600,act){const t=$('#toast');t.textContent=m;if(act){const b=document.createElement('button');b.textContent=act.label;b.onclick=()=>{t.style.display='none';act.fn()};t.append(b)}t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)}
function ask(msg,ok='Conferma',danger){return new Promise(res=>{const m=document.createElement('div');m.className='modal';m.innerHTML=`<div><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn sec" data-n>Annulla</button><button class="btn ${danger?'dng':''}" data-y>${esc(ok)}</button></div></div>`;m.onclick=e=>{if(e.target.matches('[data-y]')){m.remove();res(true)}else if(e.target.matches('[data-n]')||e.target===m){m.remove();res(false)}};document.body.append(m)})}

/* ============ database (IndexedDB) ============ */
const DB={
  db:null,mem:new Map(),
  open(){return new Promise(res=>{try{const r=indexedDB.open('rddc',1);r.onupgradeneeded=()=>r.result.createObjectStore('dev',{keyPath:'id'});r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
  tx(m){return DB.db.transaction('dev',m).objectStore('dev')},
  all(){return new Promise(res=>{if(!DB.db)return res([...DB.mem.values()]);const q=DB.tx('readonly').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])})},
  put(d){const c=Object.fromEntries(Object.entries(d).filter(([k])=>k[0]!=='_'));DB.mem.set(c.id,c);return new Promise(res=>{if(!DB.db)return res();const q=DB.tx('readwrite').put(c);q.onsuccess=q.onerror=()=>res()})},
  del(id){DB.mem.delete(id);return new Promise(res=>{if(!DB.db)return res();const q=DB.tx('readwrite').delete(id);q.onsuccess=q.onerror=()=>res()})},
  clear(){DB.mem.clear();return new Promise(res=>{if(!DB.db)return res();const q=DB.tx('readwrite').clear();q.onsuccess=q.onerror=()=>res()})}
};

function nameHex(n){
  const s=(n||'').trim().toLowerCase();if(!s)return '';
  const c=COLORI.find(c=>c[0].toLowerCase()===s)||COLORI.find(c=>c[2].test(s));
  return c?c[1]:(/^#[0-9a-f]{3,8}$/i.test(s)?s:'');
}
const colHex=d=>d.colore_hex||nameHex(d.colore);
function detectColor(txt,specificOnly){
  const s=(txt||'').toLowerCase();let best='',bi=1e9;
  for(const c of COLORI){if(specificOnly&&!c[3])continue;const i=s.search(c[2]);if(i>=0&&i<bi){bi=i;best=c[0]}}
  return best;
}

}

function val(d,k){

function pass(d,skip){
  const q=S.q.trim().toLowerCase();

  for(const [k,set] of Object.entries(S.sel)){ if(k===skip||!set||!set.length)continue; if(!set.includes(val(d,k)))return false }

}
function sorter(){
  const c=(a,b)=>String(a||'').localeCompare(String(b||''),'it',{numeric:true,sensitivity:'base'});

}

function card(d){

  const sub2=[d.tipologia,kd==='tv'?inch(d.tv_pollici):kd==='acc'?d.acc_uscita||d.acc_connettore:d.cpu].filter(Boolean).join(' · ');
  const meta=d.wish?[d.w_priorita?`<span class="prio">★ ${esc(d.w_priorita)}</span>`:'',d.w_budget?`<span>≤ € ${esc(d.w_budget)}</span>`:'',d.colore?`<span><i class="sw" style="--c:${esc(colHex(d)||'transparent')}"></i>${esc(d.colore)}</span>`:'',d.w_link?'<span>🔗 annuncio</span>':''].join(''):[d.colore?`<span><i class="sw" style="--c:${esc(colHex(d)||'transparent')}"></i>${esc(d.colore)}</span>`:'',d.luogo?`<span>📍 ${esc(d.luogo)}</span>`:'',+d.quantita>1?`<span class="qty">×${+d.quantita}</span>`:''].join('');
  return `<div class="card" data-id="${d.id}"><div class="th">${d.thumb?`<img src="${d.thumb}" alt="">`:icon(d)}</div><div class="ct"><b>${esc(d.nome)}</b>${sub?`<span>${esc(sub)}</span>`:''}${sub2?`<span>${esc(sub2)}</span>`:''}${meta?`<div class="meta">${meta}</div>`:''}</div>${d.anno?`<div class="yr">${d.anno}</div>`:''}</div>`;
}
function gcard(d){
  const ph=(d.foto&&d.foto[0])||d.thumb;
  const sub=[d.marca,d.wish?(d.w_priorita?'★ '+d.w_priorita:''):(d.luogo?'📍 '+d.luogo:'')].filter(Boolean).join(' · ');

function timeline(items){
  const desc=curSort()==='anno_d',m=new Map();
  items.forEach(d=>{const y=d.anno||'—';if(!m.has(y))m.set(y,[]);m.get(y).push(d)});
  const ys=[...m.keys()].filter(y=>y!=='—').sort((a,b)=>desc?b-a:a-b);if(m.has('—'))ys.push('—');
  return `<div class="tl">${ys.map(y=>`<div class="ty">${y==='—'?'Senza anno':y}<small>${m.get(y).length}</small></div>`+m.get(y).sort((a,b)=>String(a.nome).localeCompare(b.nome,'it')).map(card).join('')).join('')}</div>`;
}

const stack=[];
function openPage(title,body,{actions='',replace=false,mount,bare=false,cls=''}={}){
  if(replace)swapTop();
  const el=document.createElement('div');el.className='page'+(cls?' '+cls:'');
  el.innerHTML=bare?`<div class="body bare">${body}</div>`:`<header><button class="ibtn" data-back aria-label="Indietro">←</button><h2>${esc(title)}</h2><div class="row">${actions}</div></header><div class="body">${body}</div>`;
  document.body.append(el);stack.push(el);
  const st={p:stack.length};
  replace?history.replaceState(st,''):history.pushState(st,'');
  el.addEventListener('click',e=>{if(e.target.closest('[data-back]'))history.back()});
  mount&&mount(el);return el;
}
function swapTop(){const t=stack.pop();t&&t.remove()}
addEventListener('popstate',()=>{const p=(history.state&&history.state.p)||0;while(stack.length>p)stack.pop().remove()});
function goBase(cb){const n=(history.state&&history.state.p)||0;if(!n){cb&&cb();return}const once=()=>{removeEventListener('popstate',once);cb&&cb()};addEventListener('popstate',once);history.go(-n)}
history.replaceState({p:0},'');

function keyTiles(d){
  const k=kindOf(d.tipologia);
  const t=k==='tv'?[['Diagonale',inch(d.tv_pollici)],['Tubo',d.tv_tubo],['Sistema',d.tv_standard],['Formato',d.tv_formato],['Frequenza',d.tv_freq],['Audio',d.tv_audio],['Ingressi',d.tv_ingressi]]
   :k==='acc'?[['Va con',(devices.find(x=>x.id===d.collegato)||{}).nome],['Compatibile',d.acc_compat],['Connettore',d.acc_connettore],['Uscita',d.acc_uscita],['Lunghezza',d.acc_lunghezza],['Quantità',d.quantita]]
   :[['Processore',d.cpu],['RAM',d.ram],['Archiviazione',d.storage],['Display',d.display],['Sistema',d.os_orig],['Grafica',d.gpu]];
  return t.filter(x=>x[1]).slice(0,6);
}
function fieldDisplay(d,k){
  if(k==='colore')return `<span style="display:inline-flex;gap:7px;align-items:center"><i class="sw" style="--c:${esc(colHex(d)||'transparent')};width:16px;height:16px"></i>${esc(d.colore)}</span>`;
  if(k==='collegato'){const o=devices.find(x=>x.id===d.collegato);return o?`<a href="#" data-go="${o.id}">${esc(o.nome)}</a>`:'<i>(non più in collezione)</i>'}
  if(k==='tv_pollici')return esc(inch(d[k]));
  if(k==='w_link')return /^https?:\/\//i.test(d[k])?`<a href="${esc(d[k])}" target="_blank" rel="noopener">${esc(d[k].replace(/^https?:\/\/(www\.)?/,'').slice(0,60))}</a>`:esc(d[k]);
  if(k==='w_budget')return '€ '+esc(d[k]);
  return esc(d[k]);
}

    h+=`<div class="acts"><button class="btn" data-got>✅ Preso! Sposta in collezione</button>${d.w_link&&/^https?:/i.test(d.w_link)?`<a class="btn sec" target="_blank" rel="noopener" href="${esc(d.w_link)}">🔗 Annuncio</a>`:''}<a class="btn sec" target="_blank" rel="noopener" href="https://www.ebay.it/sch/i.html?_nkw=${q}">🛒 Cerca su eBay</a><a class="btn sec" target="_blank" rel="noopener" href="https://www.subito.it/annunci-italia/vendita/usato/?q=${q}">🛒 Cerca su Subito</a><button class="btn sec" data-edit>Modifica</button><button class="btn sec" data-paste>📋 Incolla da EveryMac</button><button class="btn dng" data-del>Elimina</button></div></div>`;
  }else h+=`<div class="acts"><button class="btn" data-edit>Modifica</button><button class="btn sec" data-upd>🔎 Aggiorna da web</button><button class="btn sec" data-paste>📋 Incolla da EveryMac</button><button class="btn sec" data-addacc>＋ Accessorio</button><button class="btn sec" data-dup>Duplica</button><button class="btn dng" data-del>Elimina</button></div></div>`;

    if(hi&&!fit){const chk=()=>{if(hi.naturalWidth&&hi.naturalWidth<700)$('.hero',el).classList.add('fit')};hi.complete?chk():hi.addEventListener('load',chk)}

        ['w_priorita','w_budget','w_link','w_note'].forEach(k=>delete o[k]);
        idx(o);await DB.put(o);devices[devices.findIndex(x=>x.id===o.id)]=o;dirty();S.view='col';render();toast('Spostato in collezione 🎉');goBase(()=>openForm(o));return}
      if(t.closest('[data-dup]')){const c=JSON.parse(JSON.stringify(d));c.id=uid();c.creato=c.modificato=Date.now();c.seriale='';c.nome+=' (copia)';idx(c);await DB.put(c);devices.push(c);dirty();render();toast('Duplicato');goBase(()=>openDetail(c.id))}

        toast(`Eliminato «${d.nome}»`,7000,{label:'ANNULLA',fn:async()=>{unmarkDeleted(d.id);idx(d);await DB.put(d);devices.push(d);render();dirty();toast('Ripristinato')}})}
      const upd=async r=>{const m=await mergeFetched(d,r,true);openForm(m,{fromLookup:true})};

    });
  }});
}

  <div class="row" style="margin-top:18px"><button class="btn" id="i_save" style="flex:1">Salva</button>${it?'<button class="btn dng" id="i_del">Elimina</button>':''}</div>`;

    const done=async msg=>{await saveDev(d);render();toast(msg);goBase(()=>openDetail(d.id))};

      if(!o.tipo&&!o.desc){toast('Scrivi almeno il tipo o una descrizione');return}

  }});

/* ============ modulo ============ */
function listOpts(kind){
  const u=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>String(x).localeCompare(String(y),'it'));
  if(kind==='marche')return u([...MARCHE0,...devices.map(d=>d.marca)]);
  if(kind==='tipi')return u([...TIPI,...devices.map(d=>d.tipologia)]);
  if(kind==='linee')return u(devices.map(d=>d.linea));
  if(kind==='luoghi')return u([...LUOGHI0,...devices.map(d=>d.luogo)]);
  if(kind==='tubi')return u([...TUBI,...devices.map(d=>d.tv_tubo)]);
  if(kind==='audio')return AUDIO;
  if(kind==='connettori')return u([...CONNETTORI,...devices.map(d=>d.acc_connettore)]);
  if(kind==='colori')return u([...COLORI.map(c=>c[0]),...devices.map(d=>d.colore)]);
  return [];
}
function fieldHTML(k,l,t,v,d){
  v=v==null?'':v;t=t||'';
  if(t.startsWith('select:')){const o=t.slice(7).split('|');if(v&&!o.includes(v))o.push(v);return `<label class="f">${l}</label><select class="in" name="${k}"><option value=""></option>${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
  if(t==='area')return `<label class="f">${l}</label><textarea class="in" name="${k}">${esc(v)}</textarea>`;
  if(t==='link'){const opts=devices.filter(x=>x.id!==d.id&&!x.wish&&kindOf(x.tipologia)!=='acc').sort((a,b)=>String(a.nome).localeCompare(b.nome,'it'));
    return `<label class="f">${l}</label><select class="in" name="${k}"><option value="">— nessuno —</option>${opts.map(x=>`<option value="${x.id}" ${x.id===v?'selected':''}>${esc(x.nome)}${x.anno?' ('+x.anno+')':''}</option>`).join('')}</select>`}
  if(t==='color'){const hx=d.colore_hex||nameHex(v);
    return `<label class="f">${l}</label><div class="row"><span class="swbig ${hx?'':'none'}" id="swp" style="--c:${esc(hx)}"></span><input class="in" name="colore" list="dl_colori" value="${esc(v)}" autocomplete="off" placeholder="Es. Mirtillo, Argento, Nero"><label class="ibtn" title="Colore personalizzato">🎨<input type="color" id="cpick" value="${esc(/^#[0-9a-f]{6}$/i.test(hx)?hx:'#f2a531')}" style="position:absolute;inset:0;opacity:0;width:100%;height:100%"></label></div>
    <input type="hidden" name="colore_hex" value="${esc(d.colore_hex||'')}"><div class="swrow">${COLORI.map((c,i)=>`<button type="button" class="swb ${c[0]===v?'on':''}" data-col="${i}" title="${esc(c[0])}" style="--c:${c[1]}"></button>`).join('')}</div>`}
  if(t.startsWith('list:')){let x=`<label class="f">${l}</label><input class="in" name="${k}" list="dl_${t.slice(5)}" value="${esc(v)}" autocomplete="off">`;
    if(k==='luogo')x+=`<div class="chips">${LUOGHI0.map(o=>`<button type="button" class="chip ${o===v?'on':''}" data-luogo="${esc(o)}">📍 ${esc(o)}</button>`).join('')}</div>`;
    return x}
  return `<label class="f">${l}</label><input class="in" name="${k}" ${t==='number'?'type="number" inputmode="decimal" step="any"':''} value="${esc(v)}">`;
}

async function shrink(src,max,q=.82){
  const bmp=await createImageBitmap(src instanceof Blob?src:await (await fetch(src)).blob());
  const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}

function proxyUrl(p,url){const e=encodeURIComponent(url);if(p.includes('{url}'))return p.replace('{url}',e);if(/[=?/]$/.test(p)&&/[?=]/.test(p))return p+e;return p.replace(/\/?$/,'/?url=')+e}
const WORKER_CODE=`export default {
  async fetch(req) {
    const u = new URL(req.url).searchParams.get('url') || '';
    const h = {'Access-Control-Allow-Origin': '*'};
    if (!/^https:\\/\\/(www\\.)?everymac\\.com\\//.test(u)) return new Response('Solo everymac.com', {status: 403, headers: h});
    const r = await fetch(u, {headers: {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36', 'Accept-Language': 'en-US,en'}, cf: {cacheTtl: 86400}});

  }
}`;
function proxies(){
  const mine=(LS.get('rd_proxy','')||'').trim();
  const list=['https://corsproxy.io/?url={url}','https://api.allorigins.win/raw?url={url}','https://api.codetabs.com/v1/proxy?quest={url}'];
  return mine?[mine,...list]:list;
}
async function viaProxy(url,blob){
  let last;
  for(const p of proxies()){
    try{
      const u=proxyUrl(p,url);
      const r=await fetch(u,{signal:AbortSignal.timeout(20000)});
      if(!r.ok)throw new Error('HTTP '+r.status);
      if(blob)return await r.blob();
      const t=await r.text();
      if(/cf-challenge|challenge-platform|Just a moment\.\.\.|cf-browser-verification/i.test(t)&&!/Introduction Date|specs\.html/i.test(t))throw new Error('bloccato da Cloudflare');
      return t;
    }catch(e){last=e}
  }
  throw last||new Error('proxy');
}
async function fetchBlob(url){
  try{const r=await fetch(url,{signal:AbortSignal.timeout(15000)});if(r.ok)return await r.blob()}catch(e){}
  return viaProxy(url,true);
}

function domLines(root){

  if(!porte.length){const usb=nz(find(/^usb ports/)),fw=nz(find(/^firewire ports/));porte=[usb&&'USB '+usb,fw&&'FireWire '+fw].filter(Boolean)}
  const ex=nz(find(/^expansion slots/));if(ex)porte.push(ex);
  f.porte=porte.join(' · ');
  f.batteria=[nz(find(/^battery type/)),nz(find(/^battery life/))].filter(Boolean).join(' – ');
  const dm=nz(find(/^dimensions/));const dn=dm.match(/^([\d.]+)\s*x\s*([\d.]+)\s*x\s*([\d.]+)/);
  f.dimensioni=dn?dn.slice(1).map(x=>(parseFloat(x)*2.54).toLocaleString('it',{maximumFractionDigits:1})).join(' × ')+' cm (A×L×P)':dm;
  const wt=nz(find(/weight/));const kg=wt.match(/([\d.]+)\s*kg/i);
  f.peso=kg?(parseFloat(kg[1]).toLocaleString('it',{maximumFractionDigits:2})+' kg'):wt;
  const it=(p.prices.find(([c])=>/^ital/i.test(c))||[])[1]||'';
  f.prezzo=[nz(find(/^original price/)),nz(it)&&'Italia '+it].filter(Boolean).join(' · ');
  f.descrizione=p.desc.join('\n\n').slice(0,2000);
  f.colore=detectColor(p.title+' '+find(/^apple subfamily/))||detectColor(p.desc.join(' '),true);
  const seen=new Map();
  const specs=[...p.pairs,...p.prices.map(([c,v])=>['Prezzo '+c,v])].map(([l,v])=>{const n=(seen.get(l)||0)+1;seen.set(l,n);return [n>1?`${l} (${n})`:l,v]});
  Object.keys(f).forEach(k=>{if(f[k]===''||f[k]==null)delete f[k]});

}
function parseEMSearch(html,base){
  const d=new DOMParser().parseFromString(html,'text/html');
  const m=new Map();
  d.querySelectorAll('a[href]').forEach(a=>{
    let href;try{href=new URL(a.getAttribute('href'),base).href}catch(e){return}
    if(!/\/systems\/apple\/.+\/specs\/.+\.html/.test(href))return;
    const t=clean(a.textContent);
    if(!m.has(href))m.set(href,'');
    if(t&&!/^complete/i.test(t)&&!m.get(href))m.set(href,t);
  });
  return [...m].map(([href,name])=>({href,name:name||decodeURIComponent(href.split('/').pop().replace(/-specs\.html$|\.html$/,'').replace(/[-_]/g,' '))}));
}
async function emLookup(q){
  const kw=emKeyword(q);
  const su=`${EM}/ultimate-mac-lookup/?search_keywords=${encodeURIComponent(kw)}`;
  const html=await viaProxy(su);
  const links=parseEMSearch(html,su);
  if(links.length>1)return {choices:links};
  if(links.length===1){const h2=await viaProxy(links[0].href);return {result:finishEM(h2,links[0].href)}}
  if(/Introduction Date/i.test(html)){return {result:finishEM(html,'')}}
  return {none:true,url:su};
}
function finishEM(html,url){
  const p=parseEMDoc(html,url);
  if(p.pairs.length<3)throw new Error('Pagina EveryMac non riconosciuta');
  return mapEM(p,p.url||url);
}
/* pagine salvate .mhtml (Chrome Android: ⋮ → Scarica) */
function parseMHTML(t){
  const head=t.slice(0,4000);
  if(!/multipart\/related/i.test(head))return null;
  const bm=head.match(/boundary="?([^";\r\n]+)"?/i);if(!bm)return null;
  let html='',url='';const parts=[];
  for(const s of t.split('--'+bm[1])){
    const i=s.search(/\r?\n\r?\n/);if(i<0)continue;
    const hd=s.slice(0,i),body=s.slice(i).replace(/^\s+/,'');
    const ct=(hd.match(/Content-Type:\s*([^;\s]+)/i)||[])[1]||'';
    const cs=(hd.match(/charset="?([\w-]+)/i)||[])[1]||'';
    const enc=((hd.match(/Content-Transfer-Encoding:\s*(\S+)/i)||[])[1]||'').toLowerCase();
    const loc=(hd.match(/Content-Location:\s*(\S+)/i)||[])[1]||'';
    if(/text\/html/i.test(ct)&&!html){html=enc==='quoted-printable'?decodeBytes(qpBytes(body),cs):enc==='base64'?decodeBytes(b64bytes(body),cs):body;url=loc}
    else if(/^image\//i.test(ct)&&enc==='base64'&&loc)parts.push({loc,ct,body});
  }
  return html?{html,url,parts}:null;
}
function qpBytes(s){const b=s.replace(/=\r?\n/g,'');const out=[];for(let i=0;i<b.length;i++){const h=b.substr(i+1,2);if(b[i]==='='&&/^[0-9A-F]{2}$/i.test(h)){out.push(parseInt(h,16));i+=2}else out.push(b.charCodeAt(i)&255)}return new Uint8Array(out)}
/* EveryMac non dichiara il charset: il browser salva spesso in windows-1252 */
function decodeBytes(u,cs){
  if(cs){try{return new TextDecoder(cs).decode(u)}catch(e){}}
  try{return new TextDecoder('utf-8',{fatal:true}).decode(u)}catch(e){return new TextDecoder('windows-1252').decode(u)}
}
function b64bytes(s){const bin=atob(s.replace(/[^A-Za-z0-9+/=]/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
/* importazione manuale: html e/o testo incollato */
function importEM({html='',text='',url='',parts=[]}){
  const cands=[];
  if(html){try{cands.push(parseEMDoc(html,url))}catch(e){}}
  if(text.trim())cands.push(parseEMLines(text.split(/\r?\n/)));
  if(!cands.length)return null;
  const best=cands.slice().sort((a,b)=>(b.pairs.length+b.prices.length)-(a.pairs.length+a.prices.length))[0];
  for(const c of cands){if(!best.title&&c.title)best.title=c.title;if(!best.img&&c.img)best.img=c.img;if(!best.url&&c.url)best.url=c.url;if(!best.desc.length&&c.desc.length)best.desc=c.desc;if(!best.ident&&c.ident)best.ident=c.ident}
  if(best.pairs.length<3)return null;
  const u=url||best.url||((text+html).match(/https?:\/\/(?:www\.)?everymac\.com\/systems\/[^\s"'<>]+\.html/)||[])[0]||'';
  const r=mapEM(best,u);
  if(r.imageUrl&&parts.length){try{const pn=new URL(r.imageUrl).pathname;const pt=parts.find(x=>x.loc.endsWith(pn));if(pt)r.imageBlob=new Blob([b64bytes(pt.body)],{type:pt.ct})}catch(e){}}
  return r;
}
/* spiega perché il testo incollato non è stato riconosciuto */
function diagnose(txt,html){
  const t=txt||'',n=t.length,lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean);
  const has=re=>re.test(t)||re.test(html||'');
  let why;
  if(n<300&&!html)why='Il testo ricevuto è molto corto: probabilmente è stata copiata solo una parte della pagina. Usa «Seleziona tutto» prima di «Copia».';
  else if(has(/Complete [^\n]{3,80} Specs/)&&!has(/Introduction Date/))why='Sembra la pagina dei <b>risultati di ricerca</b>: tocca il modello giusto e copia la pagina di quel modello.';
  else if(!has(/Introduction Date/))why='Nel testo non c\'è la tabella delle specifiche («Introduction Date», «Processor Speed»…). Sul telefono EveryMac mostra le sezioni a fisarmonica: assicurati che «Tech Specs» sia aperta, poi Seleziona tutto → Copia.';
  else why='La tabella c\'è ma il formato è inatteso.';
  return `<div class="note"><b>Non ho trovato le specifiche.</b><br>${why}<br><br>Ricevuto: ${n.toLocaleString('it')} caratteri${html?' + HTML':''}, ${lines.length} righe. Inizio: «${esc(lines.slice(0,3).join(' / ').slice(0,140))}»<br><br>Il metodo più sicuro: in Chrome ⋮ → <b>⬇︎ Scarica</b> la pagina, poi «Carica pagina salvata».</div>`;
}
function previewHTML(r){
  const f=r.fields;
  const rows=[['Nome',f.nome],['Anno',f.anno],['Modello',f.modello],['EMC',f.emc],['Model ID',f.identifier],['Colore',f.colore],['CPU',f.cpu],['RAM',f.ram],['Storage',f.storage],['Display',f.display],['Prezzo',f.prezzo]].filter(x=>x[1]);
  const img=r.imageBlob?URL.createObjectURL(r.imageBlob):r.imageUrl;
  return `${img?`<img src="${esc(img)}" alt="" style="max-height:170px;max-width:100%;border-radius:12px;display:block;margin-bottom:10px" onerror="this.remove()">`:''}<div class="kv">${rows.map(([a,b])=>`<div>${a}</div><div>${a==='Colore'?`<i class="sw" style="--c:${esc(nameHex(b))};margin-right:6px"></i>`:''}${esc(b)}</div>`).join('')}</div><p class="note">${r.specs.length} specifiche trovate${f.descrizione?' + descrizione':''}${f.porte?' + porte':''}. Potrai controllarle e correggerle prima di salvare.</p><button class="btn" data-use style="width:100%">Usa questi dati</button>`;
}
function showPreview(out,r,onResult){out.innerHTML=previewHTML(r);$('[data-use]',out).onclick=()=>onResult(r)}

      else{html='';parts=[];srcUrl=''}

      analyze();
    };
    setTimeout(()=>(code?ta:ic).focus(),250);
  }});

/* ============ Wikipedia / Commons (CORS aperto) ============ */
async function wjson(u){const r=await fetch(u,{signal:AbortSignal.timeout(15000)});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function wikiSearch(q,lang='en'){
  const j=await wjson(`https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&srlimit=8&format=json&origin=*`);
  return (j.query.search||[]).map(s=>({title:s.title,snippet:s.snippet.replace(/<[^>]+>/g,''),lang}));
}
function wclean(s){
  s=s.replace(/<ref[^>]*\/>/g,'').replace(/<ref[\s\S]*?<\/ref>/g,'').replace(/<!--[\s\S]*?-->/g,'')
   .replace(/<br\s*\/?>/gi,', ').replace(/<[^>]+>/g,'')
   .replace(/\{\{\s*(?:start date|release date|start-date|dts|date)[^|}]*\|(\d{4})(?:\|(\d{1,2}))?(?:\|(\d{1,2}))?[^}]*\}\}/gi,(m,y,mo,da)=>[y,mo,da].filter(Boolean).join('-'));
  for(let i=0;i<4;i++)s=s.replace(/\{\{(?:nowrap|nobr|small|abbr|convert|cvt|val|ubl|plainlist|flatlist|unbulleted list|hlist)\s*\|([^{}]*)\}\}/gi,(m,a)=>a.split('|').filter(x=>!/^\s*[a-z]+=/.test(x)).join(' ').trim());
  for(let i=0;i<4;i++)s=s.replace(/\{\{[^{}]*\}\}/g,'');
  return clean(s.replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,'$1').replace(/\[https?:\/\/\S+\s+([^\]]+)\]/g,'$1').replace(/'{2,}/g,'').replace(/^[*\s]+/,'').replace(/\s*\*\s*/g,'; '));
}
async function wikiLoad(title,lang,marca){
  const base=`https://${lang}.wikipedia.org/w/api.php`;
  const [a,b]=await Promise.all([
    wjson(`${base}?action=query&prop=extracts|pageimages|info&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=800&inprop=url&titles=${encodeURIComponent(title)}&format=json&origin=*`),
    wjson(`${base}?action=parse&page=${encodeURIComponent(title)}&prop=wikitext&section=0&format=json&origin=*`).catch(()=>null)
  ]);
  const pg=Object.values(a.query.pages)[0];
  const wt=b&&b.parse&&b.parse.wikitext?b.parse.wikitext['*']:'';
  const pairs=[];
  const lines=wt.split('\n');let cur=null;
  for(const ln of lines){
    const m=ln.match(/^\s*\|\s*([\w \-]+?)\s*=\s*(.*)$/);
    if(m){cur=[m[1].toLowerCase().trim(),m[2]];pairs.push(cur)}
    else if(cur&&ln.trim()&&!/^\s*(\}\}|\{\{)/.test(ln)&&!/^\s*\|/.test(ln)&&pairs.length<90)cur[1]+=' '+ln.trim();
    else if(/^\s*\}\}\s*$/.test(ln))cur=null;
  }
  const P={};const specs=[];
  for(const [k,v0] of pairs){const v=wclean(v0);if(!v||/^(image|caption|logo|alt|image_size|imagesize|image_upright|website|footnotes)/.test(k))continue;if(!(k in P)){P[k]=v;specs.push([k.replace(/[_-]/g,' ').replace(/^\w/,c=>c.toUpperCase()),v])}}
  const g=(...ks)=>{for(const k of ks)if(P[k])return P[k];return ''};
  const f={nome:g('name')||pg.title,marca:marca||g('manufacturer','developer','maker')||'',
    intro:g('released','release date','release_date','first release date','introduced','first_release_date','release'),
    discontinued:g('discontinued','last release date'),
    cpu:g('cpu','processor'),ram:g('memory','ram'),storage:g('storage','storage capacity'),
    gpu:g('graphics','gpu','video'),display:g('display','screen'),os_orig:g('os','operating system','operating_system'),
    connettivita:g('connectivity','networking'),batteria:g('battery','power'),dimensioni:g('dimensions'),peso:g('weight','mass'),
    prezzo:g('price','launch price','introductory price'),modello:g('model','model number'),linea:g('family','series','product family','product line'),
    colore:detectColor(g('color','colour','colors','colours'))};
  const my=(f.intro.match(/\b(19[5-9]\d|20[0-3]\d)\b/)||[''])[0];f.anno=my?+my:'';
  f.descrizione=pg.extract?pg.extract.split('\n')[0].slice(0,900):'';
  const ty=g('type','device type').toLowerCase()+' '+(pg.extract||'').slice(0,200).toLowerCase();
  f.tipologia=/television|tv set/.test(ty)?'Televisore CRT':/phone/.test(ty)?'Smartphone':/tablet/.test(ty)?'Tablet':/laptop|notebook/.test(ty)?'Portatile':/console/.test(ty)?'Console':/player|ipod/.test(ty)?'Lettore musicale':/camera/.test(ty)?'Fotocamera':/computer/.test(ty)?'Computer desktop':'';
  Object.keys(f).forEach(k=>{if(f[k]===''||f[k]==null)delete f[k]});
  return {fields:f,specs,imageUrl:pg.thumbnail?pg.thumbnail.source:'',fonte:pg.fullurl||`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(title)}`};
}
async function commonsSearch(q){
  const j=await wjson(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(q)}&gsrlimit=18&prop=imageinfo&iiprop=url|mime&iiurlwidth=640&format=json&origin=*`);
  return Object.values((j.query&&j.query.pages)||{}).filter(p=>p.imageinfo&&/image\/(jpeg|png|webp)/.test(p.imageinfo[0].mime)).map(p=>({thumb:p.imageinfo[0].thumburl,title:p.title}));

function openLookup({prefill='',marca='Apple',onResult,replaceSelf}){
  const isApple=/^apple$/i.test(marca||'Apple');
  const h=`<div class="row"><select class="in" id="lb" style="width:auto"><option value="apple" ${isApple?'selected':''}>Apple</option><option value="altro" ${isApple?'':'selected'}>Altra marca</option></select><input class="in" id="lq" value="${esc(prefill)}" placeholder="A1278, EMC 2554, MacBookPro9,2" autocomplete="off"></div>
  <div class="row" style="margin-top:10px"><button class="btn" id="lg" style="flex:1">Cerca</button></div>
  <button class="res" id="lp" style="margin-top:12px"><b>📋 Incolla la scheda da EveryMac</b><small>Se la ricerca automatica non riesce a leggere EveryMac.</small></button>
  <div id="lo" style="margin-top:14px"></div>
  <p class="note" id="lh"></p>`;
  openPage('Cerca dati online',h,{replace:!!replaceSelf,mount(el){
    const hint=()=>{const ap=$('#lb',el).value==='apple';$('#lp',el).hidden=!ap;$('#lh',el).innerHTML=ap?'Apple: cerca su <b>EveryMac.com</b> per numero modello (<b>A1278</b>, <b>M5521</b>), <b>EMC</b> (4 cifre, es. 2554), Model ID o codice d\'ordine. Se non trovato, provo Wikipedia.':'Altre marche: scrivi marca e modello (es. <b>Commodore 64</b>, <b>Sony Trinitron KV-2900</b>). I dati arrivano da Wikipedia (scheda tecnica e foto).';$('#lq',el).placeholder=ap?'A1278, EMC 2554, MacBookPro9,2':'Marca e modello'};
    hint();$('#lb',el).onchange=hint;
    const out=$('#lo',el);
    const busy=m=>out.innerHTML=spin(m);
    const preview=r=>showPreview(out,r,onResult);
    const paste=()=>openImport({replace:true,code:$('#lq',el).value.trim(),onResult});
    $('#lp',el).onclick=paste;
    const wikiFlow=async(q,mc)=>{
      busy('Cerco su Wikipedia…');
      let res=await wikiSearch(q);
      if(!res.length)res=await wikiSearch(q,'it');
      if(!res.length){out.innerHTML='Nessun risultato.';return}
      out.innerHTML='<b>Scegli la pagina giusta:</b>'+res.map((x,i)=>`<button class="res" data-w="${i}"><b>${esc(x.title)}</b><small>${esc(x.snippet.slice(0,110))}</small></button>`).join('');
      out.onclick=async e=>{const b=e.target.closest('[data-w]');if(!b)return;const x=res[+b.dataset.w];busy('Carico la scheda…');try{preview(await wikiLoad(x.title,x.lang,mc))}catch(err){out.textContent='Errore: '+err.message}};
    };
    const go=async()=>{
      const q=$('#lq',el).value.trim();if(!q)return;
      out.onclick=null;
      const ap=$('#lb',el).value==='apple';
      if(!ap){try{await wikiFlow(q,'')}catch(e){out.textContent='Errore di rete: '+e.message}return}
      busy('Cerco su EveryMac…');
      try{
        const r=await emLookup(q);
        if(r.result)return preview(r.result);
        if(r.choices){
          out.innerHTML=`<b>${r.choices.length} modelli corrispondono – scegli:</b>`+r.choices.map((x,i)=>`<button class="res" data-c="${i}"><b>${esc(x.name)}</b></button>`).join('');
          out.onclick=async e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=r.choices[+b.dataset.c];busy('Carico le specifiche…');try{preview(finishEM(await viaProxy(c.href),c.href))}catch(err){out.innerHTML=`<p>Errore: ${esc(err.message)}</p><a class="btn sec sm" target="_blank" rel="noopener" href="${esc(c.href)}">Apri la pagina ↗</a> poi usa «Incolla la scheda».`}};
          return;
        }
        await wikiFlow('Apple '+q,'Apple');
      }catch(e){
        out.innerHTML=`<p><b>EveryMac non raggiungibile</b> (${esc(e.message)}).</p><p>Nessun problema: apri la pagina, copiala e incollala.</p><div class="row" style="flex-wrap:wrap"><a class="btn sec sm" target="_blank" rel="noopener" href="${EM}/ultimate-mac-lookup/?search_keywords=${encodeURIComponent(emKeyword(q))}">Apri su EveryMac ↗</a><button class="btn sm" id="lpp">📋 Incolla la scheda</button><button class="btn sec sm" id="lw">Prova Wikipedia</button></div>`;
        $('#lpp',el).onclick=paste;
        $('#lw',el).onclick=()=>wikiFlow('Apple '+q,'Apple').catch(er=>out.textContent='Errore: '+er.message);
      }
    };
    $('#lg',el).onclick=go;$('#lq',el).onkeydown=e=>{if(e.key==='Enter')go()};
    setTimeout(()=>$('#lq',el).focus(),250);
  }});
}
const KEEP=['descrizione','colore','colore_hex','luogo','note'];
async function mergeFetched(base,r,overwrite){
  const m=Object.assign({},base);
  for(const [k,v] of Object.entries(r.fields)){ if(v===''||v==null)continue; if(KEEP.includes(k)&&m[k])continue; if(overwrite||m[k]===undefined||m[k]==='')m[k]=v }
  if(r.specs&&r.specs.length){
    const have=new Map((m.specs||[]).map(p=>[p[0],p[1]]));
    r.specs.forEach(([l,v])=>{if(overwrite||!have.has(l))have.set(l,v)});
    m.specs=[...have];
  }
  if(r.fonte)m.fonte=r.fonte;
  if((r.imageBlob||r.imageUrl)&&!(m.foto&&m.foto.length)){
    try{const b=r.imageBlob||await fetchBlob(r.imageUrl);m.foto=[await shrink(b,1200)];m.thumb=await shrink(b,180,.75)}catch(e){toast('Dati caricati, ma la foto non è stata scaricata: aggiungila a mano',3600)}
  }
  return m;
}

function openStats(){return statsPage(devices.filter(d=>!d.wish),devices.filter(d=>d.wish))}
function statsPage(devices,wl){
  const bars=(title,k)=>{
    const c=new Map();devices.forEach(d=>{const v=val(d,k);c.set(v,(c.get(v)||0)+1)});
    const a=[...c].sort((x,y)=>y[1]-x[1]).slice(0,12);const mx=Math.max(...a.map(x=>x[1]),1);
    return `<div class="sec-t">${title}</div>`+a.map(([n,v])=>`<div class="bar"><span>${esc(n)}</span><div style="width:${v/mx*50}%"></div><span>${v}</span></div>`).join('');
  };
  const sum=k=>devices.reduce((s,d)=>s+(parseFloat(d[k])||0),0);
  const h=`<div class="kv"><div>Oggetti</div><div>${devices.length}</div><div>Pezzi (con quantità)</div><div>${devices.reduce((s,d)=>s+(parseInt(d.quantita,10)||1),0)}</div><div>Con foto</div><div>${devices.filter(d=>d.foto&&d.foto.length).length}</div><div>Speso (indicato)</div><div>€ ${sum('acq_prezzo').toLocaleString('it')}</div><div>Valore stimato</div><div>€ ${sum('valore').toLocaleString('it')}</div><div>Spese per interventi</div><div>€ ${devices.reduce((s,d)=>s+(d.interventi||[]).reduce((t,i)=>t+(parseFloat(i.costo)||0),0),0).toLocaleString('it')}</div><div>In wishlist</div><div>${wl.length}${wl.length?` (budget € ${wl.reduce((s,d)=>s+(parseFloat(d.w_budget)||0),0).toLocaleString('it')})`:''}</div></div>`+bars('Per luogo','luogo')+bars('Per marca','marca')+bars('Per tipologia','tipologia')+bars('Per decennio','decennio')+bars('Per linea','linea')+bars('Per colore','colore')+bars('Per stato','stato');
  openPage('Statistiche',h);
}

function openCatalog(){
  const vis=pool().filter(d=>pass(d)),col=devices.filter(d=>!d.wish),wl=devices.filter(d=>d.wish);
  const ck=(id,l,on=true)=>`<label class="chip" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="${id}" ${on?'checked':''}>${l}</label>`;
  const h=`<p>Crea un catalogo impaginato: nella finestra di stampa scegli <b>«Salva come PDF»</b>.</p>
  <label class="f">Contenuto</label><select class="in" id="cw"><option value="col">Tutta la collezione (${col.length})</option><option value="vis">Solo quello che vedo ora: filtri e ricerca (${vis.length})</option><option value="wish">Wishlist (${wl.length})</option></select>
  <label class="f">Ordine e sezioni</label><select class="in" id="co"><option value="anno">Per anno, sezioni per decennio</option><option value="marca">Per marca</option><option value="luogo">Per luogo</option><option value="tipologia">Per tipologia</option><option value="nome">Per nome</option></select>
  <label class="f">Titolo</label><input class="in" id="ct" value="Collezione RDDC">
  <div class="chips" style="margin-top:12px">${ck('c_foto','Foto')}${ck('c_desc','Descrizione')}${ck('c_dati','Dati tecnici')}${ck('c_int','Interventi')}${ck('c_idx','Indice')}${ck('c_eur','Prezzi e valori',false)}</div>
  <button class="btn" id="cgo" style="width:100%;margin-top:14px">🖨️ Crea PDF</button>`;
  openPage('Catalogo PDF',h,{mount(el){
    $('#cgo',el).onclick=async()=>{
      const o={w:$('#cw',el).value,sort:$('#co',el).value,title:$('#ct',el).value.trim()||'Collezione RDDC'};
      ['foto','desc','dati','int','idx','eur'].forEach(k=>o[k]=$('#c_'+k,el).checked);
      const list=(o.w==='vis'?vis:o.w==='wish'?wl:col).slice();
      if(!list.length){toast('Niente da stampare');return}
      $('#print').innerHTML=catalogHTML(list,o);
      await Promise.all([...document.querySelectorAll('#print img')].map(i=>i.decode().catch(()=>{})));
      const clear=()=>{$('#print').innerHTML='';removeEventListener('afterprint',clear)};addEventListener('afterprint',clear);
      window.print();
    };
  }});
}
function catalogHTML(list,o){
  const cmp=(a,b)=>String(a||'').localeCompare(String(b||''),'it',{numeric:true,sensitivity:'base'});
  const secOf=d=>o.sort==='anno'?(d.anno?Math.floor(d.anno/10)*10+'s':'Senza anno'):o.sort==='nome'?'':(d[o.sort]||'Non indicato');
  list.sort((a,b)=>o.sort==='anno'?((a.anno||9999)-(b.anno||9999))||cmp(a.nome,b.nome):cmp(secOf(a),secOf(b))||cmp(a.nome,b.nome));
  const yrs=list.map(d=>d.anno).filter(Boolean);
  let h=`<section class="pc"><h1>RDDC</h1><h2>${esc(o.title)}</h2><p>${list.length} ${o.w==='wish'?'oggetti desiderati':'oggetti'}${yrs.length?` · dal ${Math.min(...yrs)} al ${Math.max(...yrs)}`:''}</p><p>Aggiornato al ${fmtD(today())}</p></section>`;
  if(o.idx)h+=`<section class="pidx"><div class="sec">Indice</div><table><tr><th>Nome</th><th>Anno</th><th>Marca</th><th>Tipologia</th><th>${o.w==='wish'?'Priorità':'Luogo'}</th></tr>${list.map(d=>`<tr><td>${esc(d.nome)}</td><td>${d.anno||''}</td><td>${esc(d.marca||'')}</td><td>${esc(d.tipologia||'')}</td><td>${esc((o.w==='wish'?d.w_priorita:d.luogo)||'')}</td></tr>`).join('')}</table></section>`;
  let cur=null;
  for(const d of list){
    const s=secOf(d);if(s&&s!==cur){cur=s;h+=`<div class="sec">${esc(s)}</div>`}
    const ph=(d.foto&&d.foto[0])||d.thumb;
    const rows=[['Tipologia',d.tipologia],['Modello',[d.modello,d.emc&&'EMC '+d.emc,d.identifier].filter(Boolean).join(' · ')],...(o.dati?keyTiles(d):[]),['Colore',d.colore],['Quantità',+d.quantita>1?d.quantita:''],
      ...(d.wish?[['Priorità',d.w_priorita],['Budget',o.eur&&d.w_budget?'€ '+d.w_budget:''],['Note ricerca',d.w_note]]:[['Luogo',d.luogo],['Stato',d.stato],['Scatola',d.scatola],['Condizione',d.condizione],['Acquistato',[d.acq_anno,o.eur&&d.acq_prezzo?'€ '+d.acq_prezzo:''].filter(Boolean).join(' · ')],['Valore stimato',o.eur&&d.valore?'€ '+d.valore:'']]),
      ...(o.int&&(d.interventi||[]).length?[['Interventi',d.interventi.slice().sort((a,b)=>String(a.data).localeCompare(b.data)).map(i=>`${fmtD(i.data)}: ${i.tipo||''}${i.desc?' – '+i.desc:''}`).join('; ')]]:[])].filter(r=>r[1]);
    const desc=o.desc&&d.descrizione?d.descrizione.split(/\n\s*\n/)[0].slice(0,650):'';
    h+=`<article class="pe">${o.foto?(ph?`<img src="${ph}" alt="">`:`<div class="noimg">${icon(d)}</div>`):''}<div style="${o.foto?'':'grid-column:1/-1'}"><div class="ps">${esc([d.marca,d.linea&&d.linea!==d.marca?d.linea:'',d.anno].filter(Boolean).join(' · '))}</div><h3>${esc(d.nome)}</h3><dl>${rows.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl>${desc?`<div class="pd">${esc(desc)}${d.descrizione.length>desc.length?'…':''}</div>`:''}</div></article>`;
  }
  return h;
}

function dl(name,type,text){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function csv(){
  const cols=['lista','nome','marca','tipologia','linea','anno',...ALLF.map(f=>f[0]).filter(k=>k!=='collegato'),'collegato_nome','interventi','fonte'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  return '﻿'+cols.join(';')+'\n'+devices.map(d=>cols.map(c=>q(c==='lista'?(d.wish?'Wishlist':'Collezione'):c==='collegato_nome'?(devices.find(x=>x.id===d.collegato)||{}).nome:c==='interventi'?(d.interventi||[]).map(i=>[i.data,i.tipo,i.desc,i.costo?'€ '+i.costo:''].filter(Boolean).join(' – ')).join(' | '):d[c])).join(';')).join('\n');
}

      if(a==='pxc'){try{await navigator.clipboard.writeText(WORKER_CODE);toast('Codice copiato')}catch(e){toast('Copia non riuscita: selezionalo a mano')}}
      if(a==='pxt'){LS.set('rd_proxy',$('#px',el).value.trim());const o=$('#pxo',el);o.innerHTML=`<p>${spin('Provo a cercare A1278 su EveryMac…')}</p>`;
        const res=[];for(const p of proxies()){const t0=Date.now();try{const t=await (async()=>{const r=await fetch(proxyUrl(p,EM+'/ultimate-mac-lookup/?search_keywords=A1278'),{signal:AbortSignal.timeout(20000)});if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})();
          const ok=parseEMSearch(t,EM+'/').length>0;res.push(`<div>${ok?'✅':'⚠️'} <b>${esc(p.replace(/^https?:\/\//,'').slice(0,40))}</b> – ${ok?'funziona ('+((Date.now()-t0)/1000).toFixed(1)+' s)':/challenge|Just a moment/i.test(t)?'bloccato da Cloudflare':'risposta non valida'}</div>`)}
          catch(err){res.push(`<div>❌ <b>${esc(p.replace(/^https?:\/\//,'').slice(0,40))}</b> – ${esc(err.message)}</div>`)}o.innerHTML=`<div class="note">${res.join('')}</div>`}}
      if(a==='clr'&&await ask('Cancellare TUTTI gli oggetti (anche la wishlist)? Non si può annullare. Se usi il database GitHub, verrà ricaricato al prossimo avvio.','Cancella tutto',true)){await DB.clear();devices=[];S.sel={};LS.set('rd_deleted',[]);LS.set('rd_db_sig','');render();toast('Collezione svuotata')}
    });
    $('#fi',el).onchange=async e=>{
      try{const j=JSON.parse(await e.target.files[0].text());const arr=j.devices||j;if(!Array.isArray(arr))throw 0;
        let n=0;for(const d of arr){if(!d||!d.nome)continue;d.id=d.id||uid();d.modificato=d.modificato||Date.now();idx(d);await DB.put(d);const i=devices.findIndex(x=>x.id===d.id);i<0?devices.push(d):devices[i]=d;n++}
        render();dirty();toast(n+' oggetti importati')}catch(err){toast('File non valido')}
    };
  }});
}

/* ============ database su GitHub ============ */
const dbUrl=()=>(LS.get('rd_db_url','collezione.json')||'').trim()||'collezione.json';
function exportJSON(){return JSON.stringify({app:'rddc',v:3,esportato:Date.now(),devices:devices.map(d=>Object.fromEntries(Object.entries(d).filter(([k])=>k[0]!=='_')))})}
function markDeleted(id){const a=LS.get('rd_deleted',[]).filter(x=>(x.id||x)!==id);a.push({id,t:Date.now()});LS.set('rd_deleted',a.slice(-3000))}
function unmarkDeleted(id){LS.set('rd_deleted',LS.get('rd_deleted',[]).filter(x=>(x.id||x)!==id))}
const deletedMap=()=>new Map(LS.get('rd_deleted',[]).map(x=>typeof x==='string'?[x,0]:[x.id,x.t]));
function dirty(){LS.set('rd_dirty',Date.now());if(ghOn()){clearTimeout(dirty.t);dirty.t=setTimeout(()=>ghSync(false),15000)}updSync()}
function updSync(st){const e=$('#syncS');if(!e)return;if(!ghOn()){e.textContent='';return}e.textContent=st==='run'?'☁︎ sincronizzo…':st==='err'?'☁︎ ⚠️ non sincronizzato':LS.get('rd_dirty',0)?'☁︎ modifiche da inviare':'☁︎ sincronizzato'}
const mimeOf=p=>/\.png$/i.test(p)?'image/png':/\.webp$/i.test(p)?'image/webp':'image/jpeg';
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function sha1hex(u8){const h=await crypto.subtle.digest('SHA-1',u8);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
const tombsOf=j=>new Map(((j&&j.eliminati)||[]).map(x=>typeof x==='string'?[x,0]:[x.id,x.t||0]));
/* foto remote (percorsi foto/…) → immagini salvate sul telefono, così funzionano anche offline */
async function localizePhotos(d,fetchPhoto){
  const conv=async u=>{if(typeof u!=='string'||/^(data:|blob:)/.test(u))return u;try{const b=await fetchPhoto(u);return await blobToDataURL(b.type&&b.type.startsWith('image/')?b:new Blob([b],{type:mimeOf(u)}))}catch(e){return u}};
  if(Array.isArray(d.foto))d.foto=await Promise.all(d.foto.map(conv));
  if(d.thumb)d.thumb=await conv(d.thumb);
}
/* unisce il contenuto remoto: aggiunge i nuovi, aggiorna i più recenti, applica le eliminazioni */
async function mergeRemote(arr,tomb,fetchPhoto){
  const del=deletedMap();let nuovi=0,agg=0,canc=0;
  for(const [id,t] of tomb){
    const i=devices.findIndex(x=>x.id===id);
    if(i>=0&&(devices[i].modificato||0)<=t){await DB.del(id);devices.splice(i,1);canc++}
    if(!del.has(id)||del.get(id)<t)del.set(id,t);
  }
  LS.set('rd_deleted',[...del].map(([id,t])=>({id,t})).slice(-3000));
  for(const d of arr){
    if(!d||!d.nome)continue;
    d.id=d.id||hashId([d.nome,d.modello,d.seriale,d.wish?'w':''].join('|'));
    if(del.has(d.id)&&(d.modificato||0)<=del.get(d.id))continue;
    const i=devices.findIndex(x=>x.id===d.id);
    if(i<0)nuovi++;else if((d.modificato||0)>(devices[i].modificato||0))agg++;else continue;
    await localizePhotos(d,fetchPhoto);
    idx(d);await DB.put(d);const k=devices.findIndex(x=>x.id===d.id);k<0?devices.push(d):devices[k]=d;
  }
  return {nuovi,agg,canc};
}
/* ---- GitHub con token (lettura e scrittura) ---- */
function guessRepo(){const m=location.hostname.match(/^([\w-]+)\.github\.io$/i);const seg=location.pathname.split('/').filter(Boolean)[0];return m&&seg&&!/\.\w+$/.test(seg)?m[1]+'/'+seg:''}
function ghCfg(){const r=LS.get('rd_gh',{});return {token:(r.token||'').trim(),repo:(r.repo||guessRepo()).trim(),branch:(r.branch||'main').trim()}}
function ghOn(){const c=ghCfg();return !!(c.token&&/^[\w.-]+\/[\w.-]+$/.test(c.repo))}
async function gh(path,{method='GET',body,raw}={}){
  const c=ghCfg();
  const r=await fetch(`https://api.github.com/repos/${c.repo}${path?'/'+path:''}`,{method,cache:'no-store',headers:{Authorization:'Bearer '+c.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}const er=new Error(r.status===401?'token non valido o scaduto':r.status===403?'il token non ha il permesso «Contents: Read and write»':r.status===404?'repository non trovato (o token senza accesso)':`GitHub ${r.status}${m?': '+m:''}`);er.status=r.status;throw er}
  return raw?r:r.json();
}
let syncing=null;
function ghSync(manual){
  if(syncing)return syncing;
  syncing=(async()=>{
    const t0=Date.now(),c=ghCfg();updSync('run');
    try{
      let res={nuovi:0,agg:0,canc:0},inviati=0,nfoto=0,n=0;
      for(let attempt=0;;attempt++){
        const head=(await gh(`git/ref/heads/${c.branch}`)).object.sha;
        const treeSha=(await gh(`git/commits/${head}`)).tree.sha;
        const tree=await gh(`git/trees/${treeSha}?recursive=1`);
        const tmap=new Map(tree.tree.filter(x=>x.type==='blob').map(x=>[x.path,x.sha]));
        let remote={},arr=[];
        if(tmap.has('collezione.json')){remote=JSON.parse(await (await gh(`git/blobs/${tmap.get('collezione.json')}`,{raw:true})).text());arr=Array.isArray(remote)?remote:(remote.devices||[])}
        const fetchPhoto=async p=>{const sha=tmap.get(p.replace(/^\.\//,''));if(!sha)throw new Error('foto mancante');return (await gh(`git/blobs/${sha}`,{raw:true})).blob()};
        const r=await mergeRemote(arr.map(x=>JSON.parse(JSON.stringify(x))),tombsOf(remote),fetchPhoto);res.nuovi+=r.nuovi;res.agg+=r.agg;res.canc+=r.canc;
        if(r.nuovi||r.agg||r.canc)render();
        // contenuto da inviare: foto come file separati (nome = impronta SHA-1, così ognuna si carica una volta sola)
        const files=new Map();
        const conv=async u=>{if(typeof u!=='string'||!u.startsWith('data:'))return u;const [meta,b64]=u.split(',');const ext=/png/.test(meta)?'png':/webp/.test(meta)?'webp':'jpg';const path=`foto/${await sha1hex(b64bytes(b64))}.${ext}`;if(!tmap.has(path))files.set(path,b64);return path};
        const out=[];for(const d of devices){const o=Object.fromEntries(Object.entries(d).filter(([k])=>k[0]!=='_'));if(Array.isArray(o.foto))o.foto=await Promise.all(o.foto.map(conv));if(o.thumb)o.thumb=await conv(o.thumb);out.push(o)}
        out.sort((a,b)=>String(a.id).localeCompare(b.id));
        const elim=[...deletedMap()].map(([id,t])=>({id,t})).sort((a,b)=>a.id.localeCompare(b.id));
        const remSorted=arr.slice().sort((a,b)=>String(a.id).localeCompare(b.id));
        const remElim=[...tombsOf(remote)].map(([id,t])=>({id,t})).sort((a,b)=>a.id.localeCompare(b.id));
        n=out.length;
        if(!files.size&&tmap.has('collezione.json')&&JSON.stringify(remSorted)===JSON.stringify(out)&&JSON.stringify(remElim)===JSON.stringify(elim))break;
        const entries=[];
        for(const [path,b64] of files)entries.push({path,mode:'100644',type:'blob',sha:(await gh('git/blobs',{method:'POST',body:{content:b64,encoding:'base64'}})).sha});
        const body={app:'rddc',v:4,esportato:Date.now(),devices:out,eliminati:elim};
        entries.push({path:'collezione.json',mode:'100644',type:'blob',sha:(await gh('git/blobs',{method:'POST',body:{content:JSON.stringify(body),encoding:'utf-8'}})).sha});
        const nt=await gh('git/trees',{method:'POST',body:{base_tree:treeSha,tree:entries}});
        const nc=await gh('git/commits',{method:'POST',body:{message:`RDDC: sincronizzazione (${out.length} oggetti${files.size?`, ${files.size} foto nuove`:''})`,tree:nt.sha,parents:[head]}});
        try{await gh(`git/refs/heads/${c.branch}`,{method:'PATCH',body:{sha:nc.sha,force:false}})}
        catch(e){if((e.status===422||e.status===409)&&attempt<3)continue;throw e}
        inviati=out.length;nfoto=files.size;break;
      }
      if(LS.get('rd_dirty',0)<=t0)LS.set('rd_dirty',0);
      LS.set('rd_db_last',{t:Date.now(),n,...res,inviati,foto:nfoto});LS.set('rd_db_sig','');
      updSync();
      if(res.nuovi||res.agg||res.canc)toast(`GitHub: ricevuti ${res.nuovi} nuovi, ${res.agg} aggiornati${res.canc?', '+res.canc+' eliminati':''}`,3500);
      else if(manual)toast(inviati?`Inviato a GitHub ✔︎${nfoto?' ('+nfoto+' foto)':''}`:'Già tutto sincronizzato ✔︎');
    }catch(e){updSync('err');if(manual)toast('Sincronizzazione non riuscita: '+e.message,5000);else console.warn('sync',e)}
    finally{syncing=null}
  })();
  return syncing;
}
function hashId(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return 'db-'+(h>>>0).toString(36)}
async function syncDB(manual){
  let j;
  try{
    const r=await fetch(new URL(dbUrl(),location.href),{cache:'no-cache'});
    if(r.status===404){if(manual)toast('Nessun database su GitHub: carica prima «collezione.json» nel repository',4200);return}
    if(!r.ok)throw new Error('HTTP '+r.status);
    j=await r.json();
  }catch(e){if(manual)toast('Database non raggiungibile: '+e.message,4000);return}
  const arr=Array.isArray(j)?j:j&&j.devices;
  if(!Array.isArray(arr)){if(manual)toast('Il file del database non è valido');return}
  const sig=[j.esportato||'',arr.length,arr.reduce((m,d)=>Math.max(m,(d&&(d.modificato||d.creato))||0),0),(j.eliminati||[]).length].join('|');
  if(!manual&&sig===LS.get('rd_db_sig',''))return;
  const base=new URL(dbUrl(),location.href);
  const {nuovi,agg,canc}=await mergeRemote(arr,tombsOf(j),async p=>{const r=await fetch(new URL(p,base));if(!r.ok)throw new Error('HTTP '+r.status);return r.blob()});
  LS.set('rd_db_sig',sig);LS.set('rd_db_last',{t:Date.now(),n:arr.length,nuovi,agg,canc});
  if(nuovi||agg||canc){render();toast(`Database GitHub: ${nuovi} nuovi, ${agg} aggiornati${canc?', '+canc+' eliminati':''}`,3500)}
  else if(manual)toast('Già tutto aggiornato ✔︎');
}

/* ============ avvio ============ */
$('#q').value=S.q||'';
$('#q').addEventListener('input',e=>{S.q=e.target.value;render()});
$('#seg').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b||b.dataset.view===S.view)return;S.view=b.dataset.view;render();scrollTo(0,0)});
$('#bFil').onclick=openFilters;$('#bMenu').onclick=openMenu;$('#fab').onclick=openAdd;
$('#list').addEventListener('click',e=>{if(e.target.closest('#dueB'))return openDue();const c=e.target.closest('[data-id]');if(c)openDetail(c.dataset.id)});
$('#bView').onclick=()=>{const k=Object.keys(LAYOUTS);S.layout=k[(k.indexOf(S.layout||'list')+1)%k.length];render();toast('Vista: '+LAYOUTS[S.layout][1],1400)};
$('#sum').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;const a=S.sel[b.dataset.rm]||[];S.sel[b.dataset.rm]=a.filter(x=>x!==b.dataset.v);render()});
(async()=>{
  await DB.open();
  devices=await DB.all();devices.forEach(idx);
  render();
  if(location.protocol!=='file:'){
    if(ghOn())ghSync(false);else if(LS.get('rd_db_auto',true))syncDB(false);
    document.addEventListener('visibilitychange',()=>{if(!ghOn())return;if(document.visibilityState==='hidden'&&LS.get('rd_dirty',0))ghSync(false);if(document.visibilityState==='visible'&&!syncing)ghSync(false)});
  }
  if('serviceWorker' in navigator&&location.protocol!=='file:'){
    const sw=navigator.serviceWorker,had=!!sw.controller;let done=false;
    /* nuova versione installata: ricarica subito se non c'è niente aperto, altrimenti avvisa */
    sw.addEventListener('controllerchange',()=>{if(!had||done)return;done=true;if(!stack.length)location.reload();else toast('Nuova versione dell\'app disponibile: chiudi e riapri per usarla',6000)});
    sw.register('sw.js',{updateViaCache:'none'}).then(reg=>{document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})})}).catch(()=>{});
  }
})();
</script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f2e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#110d07" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>RDDC – Collezione vintage</title>
<style>
:root{--bg:#f8f2e7;--card:#fffaf1;--ink:#24190b;--mute:#76674f;--line:#eadcc4;--acc:#f2a531;--acc-ink:#9c5a00;--on-acc:#2b1a02;--acc2:#3d7a66;--chip:#f4e6cc;--dng:#b3261e;--shadow:0 1px 2px rgba(80,50,0,.10),0 4px 14px rgba(80,50,0,.06);--glow:rgba(242,165,49,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#110d07;--card:#1c160e;--ink:#f7ecd9;--mute:#a99679;--line:#33281a;--acc:#ffb547;--acc-ink:#ffbd5c;--on-acc:#2b1a02;--acc2:#7cc4ad;--chip:#2a2015;--dng:#d2463b;--shadow:0 1px 3px rgba(0,0,0,.5);--glow:rgba(255,181,71,.35)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#110d07;--card:#1c160e;--ink:#f7ecd9;--mute:#a99679;--line:#33281a;--acc:#ffb547;--acc-ink:#ffbd5c;--on-acc:#2b1a02;--acc2:#7cc4ad;--chip:#2a2015;--dng:#d2463b;--shadow:0 1px 3px rgba(0,0,0,.5);--glow:rgba(255,181,71,.35)}
:root{color-scheme:light;--c1:#c27a0e;--c2:#2f6fb0}
:root[data-theme=dark]{--c1:#c98420;--c2:#4f8bd0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--c1:#c98420;--c2:#4f8bd0}}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.brand{font:700 15px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.2em;color:var(--acc-ink);text-shadow:0 0 12px var(--glow);padding:2px 2px 9px;display:flex;align-items:baseline;gap:10px}
.brand{align-items:center}
.seg{margin-left:auto;display:flex;background:var(--chip);border-radius:11px;padding:3px;gap:2px;text-shadow:none;letter-spacing:0}
.seg button{border:0;background:none;border-radius:8px;padding:6px 11px;font:650 13px/1 system-ui,sans-serif;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg i{font-style:normal;font-weight:500;opacity:.7;margin-left:4px}
.prio{color:var(--acc-ink);font-weight:700}
.brand small{font:600 11px/1 system-ui,sans-serif;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;text-shadow:none}
.row{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.search:focus,.in:focus{outline:2px solid var(--acc);outline-offset:-1px}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-width:44px;min-height:44px;position:relative;text-decoration:none;display:inline-grid;place-items:center}
.badge{position:absolute;top:-6px;right:-6px;background:var(--acc);color:var(--on-acc);border-radius:10px;font-size:11px;font-weight:700;padding:1px 6px}
#sum{font-size:13px;color:var(--mute);padding:6px 2px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{background:var(--chip);border-radius:14px;padding:3px 10px;font-size:13px;border:0}
.pill.x::after{content:" ✕";opacity:.6}
#list{padding:4px 12px 110px}
.gh{position:sticky;top:var(--hh,120px);background:var(--bg);font-weight:700;color:var(--acc-ink);padding:12px 2px 4px;font-size:14px;letter-spacing:.04em;z-index:2}
.gh small{color:var(--mute);font-weight:400}
.card{display:flex;gap:12px;background:var(--card);border-radius:16px;padding:10px;margin:8px 0;box-shadow:var(--shadow);align-items:center}
.th{width:66px;height:66px;border-radius:12px;background:var(--chip);flex:none;display:grid;place-items:center;font-size:28px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.ct{min-width:0;flex:1}
.ct b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct>span{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:10px;font-size:12px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden}
.meta span{display:inline-flex;align-items:center;gap:4px}
.yr{font-weight:700;color:var(--acc-ink);background:var(--chip);border-radius:10px;padding:3px 8px;font-size:13px;font-variant-numeric:tabular-nums;align-self:flex-start}
.qty{font-weight:700;color:var(--acc-ink)}
.meta .lk{color:var(--acc-ink);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c,transparent);border:1px solid rgba(127,127,127,.55);flex:none;vertical-align:-1px}
.empty{text-align:center;color:var(--mute);padding:60px 20px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:30px;border:0;background:var(--acc);color:var(--on-acc);font-size:32px;box-shadow:0 4px 18px var(--glow),0 2px 6px rgba(0,0,0,.25);z-index:6}
.page{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.page>header{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.page>header h2{flex:1;margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page .body{flex:1;overflow:auto;padding:12px 14px calc(30px + env(safe-area-inset-bottom))}
.page .body.bare{padding:0}
.btn{border:0;background:var(--acc);color:var(--on-acc);border-radius:12px;padding:11px 16px;font-weight:650;text-decoration:none;display:inline-block;text-align:center}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.dng{background:var(--dng);color:#fff}
.btn.sm{padding:7px 12px;font-size:14px}
.sec-t{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink);font-weight:750;margin:22px 0 7px}
.kv{display:grid;grid-template-columns:minmax(100px,38%) 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.kv>div{background:var(--card);padding:9px 11px;word-break:break-word}
.kv>div:nth-child(odd){color:var(--mute);font-size:14px}
.kv a{color:var(--acc-ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:16px;padding:5px 11px;font-size:14px}
.chip.on{background:var(--acc);color:var(--on-acc);font-weight:600}
.chip i{font-style:normal;opacity:.65;margin-left:4px;font-size:12px}
label.f{display:block;margin:10px 0 2px;font-size:13px;color:var(--mute)}
.in{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
textarea.in{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.photos .ph{position:relative;flex:none;scroll-snap-align:start}
.photos img{height:200px;max-width:86vw;border-radius:12px;display:block;object-fit:contain;background:var(--chip)}
.photos.sm img{height:84px}
.ph button{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:26px;height:26px}
/* foto nel modulo: griglia riordinabile, copertina, trascina e rilascia */
#ph{border:2px dashed transparent;border-radius:16px;padding:4px;margin:-4px;transition:border-color .2s,background .2s}
#ph.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pht{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow);touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;transition:transform .2s,opacity .2s}
.pht img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.pht.cov{outline:3px solid var(--acc);outline-offset:-3px}
.pht .cvb{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(20,12,2,.75));color:#ffd08a;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:12px 6px 4px;text-align:center}
.pht button{position:absolute;top:4px;border:0;background:rgba(20,12,2,.62);color:#fff;border-radius:50%;width:28px;height:28px;font-size:14px;display:grid;place-items:center}
.pht .rm{right:4px}.pht .st{left:4px;color:#ffd08a}
.pht.dragging{opacity:.25}
.pht.ghost{position:fixed;z-index:80;pointer-events:none;transform:scale(1.08) rotate(-2deg);box-shadow:0 14px 34px rgba(0,0,0,.4);opacity:.95}
.phadd{aspect-ratio:1;border:2px dashed var(--line);border-radius:12px;background:none;color:var(--mute);font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.phadd small{font-size:11px}
.phhint{font-size:12px;color:var(--mute);margin:6px 2px 0}
.vcov{white-space:nowrap;position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--chip)}
.res{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.res small{display:block;color:var(--mute)}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px}
.bar div{height:14px;background:var(--acc);border-radius:7px;min-width:3px}
.bar span:first-child{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--mute);margin:10px 0}
.note b{color:var(--ink)}
#toast button{border:0;background:none;color:var(--acc);font-weight:750;margin-left:12px;padding:2px 4px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#241a0c;color:#fff3df;padding:10px 16px;border-radius:20px;z-index:99;font-size:14px;max-width:88vw;display:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:grid;place-items:center;padding:20px}
.modal>div{background:var(--card);border-radius:16px;padding:18px;max-width:380px;width:100%}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
a{color:var(--acc-ink)}
/* ---- scheda: header con foto ---- */
.hero{position:relative;height:min(64vh,480px);min-height:300px;overflow:hidden;background:#1a1208;color:#fff}
.hero .himg,.hero .hbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .hbg{display:none;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);filter:blur(28px) saturate(1.25) brightness(.85)}
.hero.fit .hbg{display:block}
.hero.fit .himg{object-fit:contain;padding:calc(58px + env(safe-area-inset-top)) 12px 118px}
.hero.noph{height:auto;min-height:calc(270px + env(safe-area-inset-top));background:radial-gradient(120% 90% at 75% 5%,#ffc867 0%,#d27b0c 38%,#5a3203 75%,#2a1704 100%)}
.hicon{position:absolute;inset:env(safe-area-inset-top) 0 96px;display:grid;place-items:center;font-size:92px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.hb{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(20,12,2,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:18px;display:grid;place-items:center}
.hb.l{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:2}
.hbr{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:8px;z-index:2}
.cap{position:absolute;left:0;right:0;bottom:0;padding:76px 18px 16px;isolation:isolate}
.cap::before{content:"";position:absolute;inset:0;z-index:-1;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(to top,#000 42%,transparent);mask-image:linear-gradient(to top,#000 42%,transparent);background:linear-gradient(to top,rgba(18,11,2,.80),rgba(18,11,2,.38) 62%,rgba(18,11,2,0))}
.cap small{display:block;color:#ffd08a;font-weight:650;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase}
.cap h1{margin:3px 0 0;font-size:clamp(22px,6.6vw,34px);line-height:1.12;font-weight:800;letter-spacing:-.01em;text-shadow:0 1px 14px rgba(0,0,0,.35);overflow-wrap:anywhere}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hchip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:4px 10px;font-size:13px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 0}
.thumbs img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:var(--chip);border:2px solid transparent}
.thumbs img.on{border-color:var(--acc)}
.dbody{padding:4px 14px calc(30px + env(safe-area-inset-bottom))}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:14px 0 2px}
.tile{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.tile small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.tile b{display:block;font-size:15px;margin-top:2px;overflow-wrap:anywhere;line-height:1.25}
.desc{line-height:1.55;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.desc>div{white-space:pre-line}
.desc>div.cl{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.linkb{border:0;background:none;color:var(--acc-ink);font-weight:650;padding:6px 2px}
details.more{margin-top:22px}
details.more>summary{list-style:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink);font-weight:750;padding:8px 0;cursor:pointer}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details.more[open]>summary::before{transform:rotate(90deg)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.viewer{background:#000}
.vw{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%}
.vw img{flex:none;width:100vw;height:100%;object-fit:contain;scroll-snap-align:center}
/* ---- form ---- */
.swrow{display:flex;gap:9px;overflow-x:auto;padding:8px 2px 4px}
.swb{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid rgba(127,127,127,.5);background:var(--c)}
.swb.on{outline:3px solid var(--acc);outline-offset:2px}
.swbig{width:44px;height:44px;border-radius:12px;flex:none;border:1px solid var(--line);background:var(--c,transparent)}
.swbig.none{background:repeating-linear-gradient(45deg,var(--chip) 0 6px,var(--card) 6px 12px)}
.step{margin:8px 0}
/* registro interventi */
.log{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;gap:12px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.ld{flex:none;width:92px;color:var(--acc-ink);font-weight:700;font-size:13px}
.lb{min-width:0}.lb b{display:block}.lb span{display:block;font-size:14px;white-space:pre-line}.lb small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.due{display:block;width:100%;text-align:left;border:1px solid var(--acc);background:var(--chip);color:var(--ink);border-radius:14px;padding:10px 12px;margin:10px 0 4px;font-weight:600}
.due.late{border-color:var(--dng)}
.due small{display:block;font-weight:400;color:var(--mute)}
/* griglia */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0}
.gcard{position:relative;border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column}
.gcard .gi{aspect-ratio:1;background:#fff;display:grid;place-items:center;font-size:46px;overflow:hidden}
.gcard .gi.ni{background:radial-gradient(120% 90% at 70% 10%,#ffc867 0%,#d27b0c 45%,#5a3203 100%)}
.gcard .gi img{width:100%;height:100%;object-fit:contain}
.gcard .gt{padding:8px 10px 10px}
.gcard b{font-size:14px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gcard small{display:block;color:var(--mute);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gy{position:absolute;top:8px;left:8px;background:rgba(20,12,2,.62);color:#ffd08a;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* linea del tempo */
.tl{position:relative;margin:4px 0 0 8px;padding-left:20px;border-left:2px solid var(--line)}
.ty{position:relative;margin:20px 0 6px;font:800 21px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--acc-ink);letter-spacing:.04em}
.ty::before{content:"";position:absolute;left:-28px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--bg),0 0 14px var(--glow)}
.ty small{font:500 12px system-ui,sans-serif;color:var(--mute);margin-left:8px;letter-spacing:0}
/* catalogo stampabile */
/* ===== museo ===== */
.mubtn{border:0;background:none;font-size:20px;padding:2px 6px;margin-left:2px;filter:drop-shadow(0 0 6px var(--glow))}
.page.museum{background:#140c06;color:#f6ead6}
.mu-top{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(#3a2716,#24170c);box-shadow:0 2px 10px rgba(0,0,0,.5)}
.mu-top .hb{flex:none}
.mu-top b{font:700 14px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:#ffb547;text-shadow:0 0 10px rgba(255,181,71,.5)}
.mu-tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);padding:0 14px}
.mu-tabs::-webkit-scrollbar{display:none}
.mu-tabs button{flex:none;border:0;background:none;color:#d9c3a0;font-size:13px;padding:7px 10px;border-radius:8px}
.mu-tabs .on{background:rgba(255,181,71,.18);color:#ffcf7a;font-weight:700}
.mu-wall{min-height:calc(100% - 60px);padding:4px 0 40px;background:radial-gradient(140% 50% at 50% -10%,rgba(255,214,150,.16),transparent 60%),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 7px),linear-gradient(#2b1d12,#1a1009)}
.mu-shelf{position:relative;height:200px;margin-top:8px;display:flex;justify-content:space-around;align-items:flex-end;padding:0 6px 24px}
.mu-shelf::before{content:"";position:absolute;inset:-10px 0 18px;background:radial-gradient(28% 70% at 17% 0,rgba(255,226,170,.28),transparent 70%),radial-gradient(28% 70% at 50% 0,rgba(255,226,170,.28),transparent 70%),radial-gradient(28% 70% at 83% 0,rgba(255,226,170,.28),transparent 70%);pointer-events:none}
.mu-board{position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(#a8743f,#7b4f27 35%,#4d2f15);box-shadow:0 10px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,220,170,.55)}
.mu-board::after{content:"";position:absolute;left:0;right:0;top:-10px;height:10px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.35))}
.mu-obj{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:31%;height:100%;border:0;background:none;padding:0;color:inherit}
.mu-obj .o3{max-width:100%}
.mu-obj .o3 .fr,.mu-obj .o3 .ly{display:block;max-width:100%;max-height:140px}
.mu-obj .o3 .fr{filter:drop-shadow(0 6px 6px rgba(0,0,0,.55)) brightness(1.04)}
.mu-obj .o3 .frame{display:block;max-height:104px;max-width:100%;border:5px solid #3a2410;outline:2px solid #c99a45;background:#fff;box-shadow:0 8px 14px rgba(0,0,0,.6)}
/* effetto 3D: spessore (strati dietro) + rotazione con l'inclinazione del telefono, oscillazione lenta se manca il sensore */
.o3{position:relative;display:inline-block;transform-style:preserve-3d;transform:perspective(700px) rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));transition:transform .35s ease-out;animation:o3-sway 8s ease-in-out infinite alternate}
.mu-obj .o3{animation-name:o3-sway-s;animation-duration:9s}
.o3 .ly{position:absolute;left:0;top:0;width:100%;height:100%;filter:brightness(.3)}
.o3 .fr{position:relative}
html.tilting .o3{animation:none}
@keyframes o3-sway{from{transform:perspective(700px) rotateY(-11deg) rotateX(3deg)}to{transform:perspective(700px) rotateY(11deg) rotateX(-1deg)}}
@keyframes o3-sway-s{from{transform:perspective(700px) rotateY(-7deg)}to{transform:perspective(700px) rotateY(7deg)}}
/* luci che si accendono entrando nel museo */
.mu-shelf::before{animation:mu-light 1.1s ease-out both;animation-delay:calc(.35s + var(--i,0)*.22s)}
.mu-obj{animation:mu-rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.25s + var(--i,0)*.22s)}
@keyframes mu-light{0%{opacity:0}25%{opacity:.9}32%{opacity:.15}48%,100%{opacity:1}}
@keyframes mu-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mu-obj .emo{font-size:62px;line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}
.mu-obj::after{content:"";width:70%;height:8px;margin-top:-4px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),transparent 70%)}
.mu-plaque{position:absolute;bottom:-21px;font:650 9px/1 system-ui,sans-serif;letter-spacing:.05em;color:#3a2410;background:linear-gradient(#f3d48c,#c99a45);padding:3px 6px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.5);z-index:2;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mu-hint{text-align:center;margin:22px 14px 0;font-size:12px;color:#b89f7b}
.mu-empty{padding:60px 24px;text-align:center;color:#c8b08c}
/* piedistallo */
.pl-wrap{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}
.pl-wrap::-webkit-scrollbar{display:none}
.pl{flex:none;width:100vw;height:100%;position:relative;overflow:hidden;scroll-snap-align:center;background:radial-gradient(90% 55% at 50% 45%,#2a2622 0%,#0d0b09 70%)}
.pl{background:radial-gradient(70% 42% at 50% 56%,#2a231c 0%,#0b0907 72%)}
/* piedistallo illuminato dal basso: piano luminoso, fascio che sale, oggetto illuminato da sotto */
.pl .stage{position:absolute;left:0;right:0;top:calc(70px + env(safe-area-inset-top));height:46%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pl .beam{position:absolute;left:50%;bottom:84px;width:min(86vw,360px);height:118%;transform:translateX(-50%);background:linear-gradient(to top,rgba(255,226,170,.5),rgba(255,226,170,.14) 45%,transparent 85%);clip-path:polygon(22% 100%,78% 100%,100% 0,0 0);filter:blur(16px);pointer-events:none;z-index:1;animation:beam-on 1.3s ease-out both}
.pl .o3{z-index:2;margin-bottom:-4px}
.pl .o3 .fr,.pl .o3 .ly{display:block;max-width:72vw;max-height:32vh}
.pl .o3 .fr{filter:drop-shadow(0 0 18px rgba(255,214,150,.22)) brightness(1.05)}
.pl .o3 .uplit{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;background:linear-gradient(to top,rgba(255,224,165,.62),rgba(255,224,165,.2) 28%,rgba(255,224,165,0) 58%);pointer-events:none}
.pl .o3 .frame{display:block;border:7px solid #3a2410;outline:2px solid #c99a45;background:#fff;max-width:62vw;max-height:28vh;margin-bottom:10px;box-shadow:0 -10px 30px rgba(255,214,150,.25)}
.pl .stage .emo{font-size:110px;line-height:1;position:relative;z-index:2;filter:drop-shadow(0 -6px 18px rgba(255,214,150,.35))}
.pl .base{flex:none;width:min(66vw,260px);height:96px;position:relative;z-index:1;background:linear-gradient(90deg,#0f0c0a,#3a322a 40%,#2a231d 68%,#0c0a08);border-radius:0 0 8px 8px;box-shadow:0 30px 40px rgba(0,0,0,.7),0 60px 80px -20px rgba(255,200,130,.16)}
.pl .base::before{content:"";position:absolute;left:0;right:0;top:-13px;height:26px;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,#fffaf0 0%,#ffe7bd 40%,#f0c27a 72%,#b07f3c 100%);box-shadow:0 0 26px 8px rgba(255,214,150,.5),0 0 80px 24px rgba(255,196,120,.2);animation:glow-on 1.3s ease-out both}
.pl .base::after{content:"";position:absolute;left:3%;right:3%;top:10px;height:5px;border-radius:50%;background:rgba(255,226,170,.5);filter:blur(3px)}
@keyframes beam-on{0%{opacity:0}30%{opacity:.6}40%{opacity:.12}65%,100%{opacity:1}}
@keyframes glow-on{0%{filter:brightness(.15)}30%{filter:brightness(1)}40%{filter:brightness(.45)}65%,100%{filter:brightness(1)}}
.pl .label{position:absolute;left:16px;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));max-height:36%;overflow:auto;background:#f7f3ea;color:#1c1712;border-radius:4px;padding:14px 16px;box-shadow:0 6px 24px rgba(0,0,0,.5);font-family:Georgia,"Times New Roman",serif}
.pl .label small{font:700 10px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#9c5a00}
.pl .label h3{margin:4px 0 4px;font-size:21px;line-height:1.2}
.pl .label p{margin:0;font-size:13.5px;line-height:1.45;color:#3d342a}
.pl .label .facts{font:600 12px system-ui,sans-serif;color:#6b5a43;margin-top:6px}
.pl-bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 10px 0;pointer-events:none}
.pl-bar>*{pointer-events:auto}
.pl-bar .cnt{flex:1;text-align:center;font:600 12px system-ui;color:#bba98e}
.pl-prog{position:absolute;top:0;left:0;height:3px;background:#ffb547;z-index:6;width:0}
.pl-prog.run{transition:width linear}
/* editor scontorno */
.cut-prev{border-radius:14px;min-height:220px;display:grid;place-items:center;padding:14px;background:repeating-conic-gradient(#d9d2c4 0 25%,#f4efe6 0 50%) 0 0/18px 18px}
.cut-prev.dark{background:radial-gradient(#3a2716,#140c06)}
.cut-prev img{max-width:100%;max-height:300px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
/* icona di sincronizzazione */
.sync{margin-left:auto;display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--mute);font-size:12px;padding:0 2px;min-height:24px}
.sync svg{width:22px;height:22px;overflow:visible;flex:none}
.sync .cl{fill:var(--chip);stroke:var(--mute);stroke-width:1.3}
.sync .sy{fill:none;stroke:var(--acc-ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sync.run .sy{transform-box:fill-box;transform-origin:center;animation:s 1.1s linear infinite}
.sync.pop svg{animation:sync-pop .55s cubic-bezier(.3,1.6,.5,1)}
.sync.dirty .sy{animation:sync-up 1.3s ease-in-out infinite}
.sync.err,.sync.err .sy{color:var(--dng);stroke:var(--dng)}
.sync .tx{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .45s ease,opacity .45s ease}
.sync.run .tx,.sync.err .tx,.sync.show .tx{max-width:130px;opacity:1}
@keyframes sync-pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes sync-up{0%,100%{transform:translateY(1.2px);opacity:.55}50%{transform:translateY(-1.6px);opacity:1}}
/* transizioni: museo (iride dal pulsante 🏛️), tema, oggetto che vola sul piedistallo */
html.vt-mu-in::view-transition-old(root){animation:vt-dim .75s ease both}
html.vt-mu-in::view-transition-new(root){animation:vt-iris .8s cubic-bezier(.65,0,.25,1) both}
html.vt-mu-out::view-transition-old(root){animation:vt-iris-out .75s cubic-bezier(.65,0,.25,1) both;z-index:2}
html.vt-mu-out::view-transition-new(root){animation:vt-undim .75s ease both}
html.vt-theme::view-transition-old(root){animation:none}
html.vt-theme::view-transition-new(root){animation:vt-iris .6s ease-in-out both}
html.vt-pl::view-transition-old(root){animation:vt-fade-out .45s ease both}
html.vt-pl::view-transition-new(root){animation:vt-fade-in .45s ease both}
::view-transition-group(mu-hero){animation-duration:.6s;animation-timing-function:cubic-bezier(.3,0,.15,1)}
@keyframes vt-iris{from{clip-path:circle(0 at var(--vx,50%) var(--vy,0))}to{clip-path:circle(150vmax at var(--vx,50%) var(--vy,0))}}
@keyframes vt-iris-out{0%{clip-path:circle(150vmax at var(--vx,50%) var(--vy,0));filter:brightness(1)}35%{filter:brightness(.3)}100%{clip-path:circle(0 at var(--vx,50%) var(--vy,0));filter:brightness(.15)}}
@keyframes vt-dim{to{filter:brightness(.3) blur(2px)}}
@keyframes vt-undim{from{filter:brightness(.3) blur(2px)}}
@keyframes vt-fade-out{to{opacity:0}}
@keyframes vt-fade-in{from{opacity:0}}
/* anteprima con pressione lunga (stile 3D Touch) */
.card,.gcard{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.card.pressing,.gcard.pressing{transform:scale(.955);box-shadow:0 0 0 2px var(--acc),var(--shadow)}
.peek{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:rgba(20,12,4,0);transition:background .3s,-webkit-backdrop-filter .3s,backdrop-filter .3s}
.peek.on{background:rgba(20,12,4,.38);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
.peek.off{background:rgba(20,12,4,0);-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0)}
.pk-card,.pk-acts{width:min(92vw,380px);transform-origin:var(--ox,50%) var(--oy,50%);transform:scale(.55);opacity:0;transition:transform .4s cubic-bezier(.2,1.25,.35,1),opacity .2s}
.peek.on .pk-card,.peek.on .pk-acts{transform:none;opacity:1}
.peek.on .pk-acts{transition-delay:.07s}
.peek.off .pk-card,.peek.off .pk-acts{transform:scale(.88);opacity:0;transition:transform .22s ease-in,opacity .22s}
.pk-card{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 22px 60px rgba(0,0,0,.45)}
.pk-hero{position:relative;height:210px;background:#fff;display:grid;place-items:center;overflow:hidden}
.pk-hero img{width:100%;height:100%;object-fit:contain}
.pk-hero.noph{background:radial-gradient(120% 90% at 75% 5%,#ffc867 0%,#d27b0c 38%,#5a3203 75%,#2a1704 100%);font-size:78px}
.pk-cap{position:absolute;left:0;right:0;bottom:0;padding:36px 16px 12px;color:#fff;background:linear-gradient(to top,rgba(18,11,2,.82),rgba(18,11,2,0))}
.pk-cap small{display:block;color:#ffd08a;font-weight:650;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase}
.pk-cap b{display:block;font-size:20px;line-height:1.15}
.pk-body{padding:12px 16px 14px}
.pk-body .chips{margin:0 0 10px}
.pk-body .chip{font-size:12.5px;padding:3px 9px}
.pk-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.pk-tiles small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.pk-tiles span{font-weight:650;font-size:14px;overflow-wrap:anywhere}
.pk-body p{margin:10px 0 0;font-size:13.5px;color:var(--mute);line-height:1.45}
.pk-acts{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.pk-acts button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:13px 16px;font-size:16px;border-top:1px solid var(--line);color:var(--ink)}
.pk-acts button:first-child{border-top:0}
.pk-acts .dng{color:var(--dng)}
.pk-acts i{font-style:normal}
@media (prefers-reduced-motion:reduce){.o3,.mu-obj,.mu-shelf::before,.pl .beam,.pl .base::before,.sync .sy,.sync svg{animation:none!important}}
/* completezza, etichette, prestiti, valore, allegati */
.meta .inc{color:var(--mute);font-style:italic}
.meta .tg{color:var(--acc-ink)}
.unk{margin-left:8px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:10px;font-size:11px;padding:1px 7px;vertical-align:1px}
.unk.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec-t .unk{text-transform:none;letter-spacing:0;font-weight:500}
.incn{border:1px dashed var(--acc)}
.mchip{display:inline-flex;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.mchip button{border:0;background:none;padding:4px 10px;font-size:13px;color:var(--ink)}
.mchip button+button{border-left:1px solid var(--line);color:var(--mute);font-size:12px}
.loan{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);border-left:4px solid var(--acc)}
.loan.late{border-left-color:var(--dng)}
.loan b,.loan small,.loan span{display:block}.loan small{color:var(--mute);margin-top:2px}.loan span{margin-top:6px;font-size:14px}
.valc{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.valc .log{box-shadow:none;border:1px solid var(--line);margin-top:8px}
.vhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-end}
.vhead small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.vhead b{font-size:24px;font-variant-numeric:tabular-nums}.vhead b.vd{font-size:15px}
.chart{position:relative;margin:10px 0 4px;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--mute);stroke-width:1;opacity:.7}
.chart .ax{fill:var(--mute);font-size:11px;font-variant-numeric:tabular-nums}
.chart .lv{fill:var(--ink);font-size:12px;font-weight:650;font-variant-numeric:tabular-nums}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .mk{stroke:var(--card);stroke-width:2}
.chart .s1{stroke:var(--c1)}.chart circle.s1{fill:var(--c1)}.chart .s2{stroke:var(--c2)}.chart circle.s2{fill:var(--c2)}
.chart .xh{stroke:var(--mute);stroke-width:1}
.chart .hit{fill:transparent}
.cleg{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-bottom:-22px;position:relative}
.cleg i,.ctip i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.cleg i.s1,.ctip i.s1{background:var(--c1)}.cleg i.s2,.ctip i.s2{background:var(--c2)}
.ctip{position:absolute;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;z-index:2}
.att{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding:4px 6px 4px 12px}
.att:first-child{border-top:0}
.att .ai{font-size:22px}
.att .an{flex:1;min-width:0;text-align:left;border:0;background:none;padding:6px 4px}
.att .an b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.att .an small{color:var(--mute);font-size:12px}
.att .ab{border:0;background:none;width:38px;height:38px;border-radius:10px;color:var(--mute);font-size:16px}

<script>
'use strict';
/* ============ util ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};

const fmtD=s=>{if(!s)return '';const d=new Date(String(s).slice(0,10)+'T12:00');return isNaN(d)?String(s):d.toLocaleDateString('it',{day:'numeric',month:'short',year:'numeric'})};

/* ============ database (IndexedDB) ============ */
const DB={
  db:null,mem:new Map(),
  open(){return new Promise(res=>{try{const r=indexedDB.open('rddc',1);r.onupgradeneeded=()=>r.result.createObjectStore('dev',{keyPath:'id'});r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
  tx(m){return DB.db.transaction('dev',m).objectStore('dev')},
  all(){return new Promise(res=>{if(!DB.db)return res([...DB.mem.values()]);const q=DB.tx('readonly').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])})},
  put(d){const c=Object.fromEntries(Object.entries(d).filter(([k])=>k[0]!=='_'));DB.mem.set(c.id,c);return new Promise(res=>{if(!DB.db)return res();const q=DB.tx('readwrite').put(c);q.onsuccess=q.onerror=()=>res()})},
  del(id){DB.mem.delete(id);return new Promise(res=>{if(!DB.db)return res();const q=DB.tx('readwrite').delete(id);q.onsuccess=q.onerror=()=>res()})},
  clear(){DB.mem.clear();return new Promise(res=>{if(!DB.db)return res();const q=DB.tx('readwrite').clear();q.onsuccess=q.onerror=()=>res()})}
};

function timeline(items){

/* ============ pagine sovrapposte ============ */
const stack=[];
function openPage(title,body,{actions='',replace=false,mount,bare=false,cls=''}={}){
  if(replace)swapTop();
  const el=document.createElement('div');el.className='page'+(cls?' '+cls:'');
  el.innerHTML=bare?`<div class="body bare">${body}</div>`:`<header><button class="ibtn" data-back aria-label="Indietro">←</button><h2>${esc(title)}</h2><div class="row">${actions}</div></header><div class="body">${body}</div>`;
  document.body.append(el);stack.push(el);
  const st={p:stack.length};
  replace?history.replaceState(st,''):history.pushState(st,'');
  el.addEventListener('click',e=>{if(e.target.closest('[data-back]'))history.back()});
  mount&&mount(el);return el;
}
function swapTop(){const t=stack.pop();if(t){t._close&&t._close();t.remove()}}
addEventListener('popstate',()=>{const p=(history.state&&history.state.p)||0;if(stack.length<=p)return;
  const rem=stack.splice(p);rem.forEach(x=>x._close&&x._close());
  const out=(rem.find(x=>x.classList.contains('mu-root'))||rem[rem.length-1])._out;
  const run=()=>{rem.forEach(x=>x.remove());out&&out.after&&out.after()};
  if(!out)return run();out.before&&out.before();vt(out.cls,run,out.done)});
function goBase(cb){const n=(history.state&&history.state.p)||0;if(!n){cb&&cb();return}const once=()=>{removeEventListener('popstate',once);cb&&cb()};addEventListener('popstate',once);history.go(-n)}
history.replaceState({p:0},'');

    for(const [k,lab] of FACETS){
      const cnt=new Map();pool().filter(d=>pass(d,k)).forEach(d=>vals(d,k).forEach(v=>cnt.set(v,(cnt.get(v)||0)+1)));
      (S.sel[k]||[]).forEach(v=>{if(!cnt.has(v))cnt.set(v,0)});

  draw();

}

   :[['Processore',d.cpu],['RAM',d.ram],['Archiviazione',d.storage],['Display',d.display],['Sistema',d.os_orig],['Grafica',d.gpu]];
  return t.filter(x=>x[1]).slice(0,6).map(([a,b])=>[a,trVal(b,d)]);

      if(t.closest('[data-upd]'))openLookup({prefill:d.modello||d.emc||d.nome,marca:d.marca,onResult:upd});

    const b=await r.blob();out.push(new File([b],decodeURIComponent(r.headers.get('x-name')||'file'),{type:b.type||r.headers.get('content-type')||''}))}
  await caches.delete('rddc-share');return {files:out,meta};

async function sharedToData(files){

    allegati.push({id:uid(),nome:f.name||'file',mime:f.type||'application/octet-stream',size:f.size,data:await blobToDataURL(f),t:today()});

  return {foto,thumb,allegati};
}

function decodeBytes(u,cs){
  if(cs){try{return new TextDecoder(cs).decode(u)}catch(e){}}
  try{return new TextDecoder('utf-8',{fatal:true}).decode(u)}catch(e){return new TextDecoder('windows-1252').decode(u)}
}
function b64bytes(s){const bin=atob(s.replace(/[^A-Za-z0-9+/=]/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
/* importazione manuale: html e/o testo incollato */
function importEM({html='',text='',url='',parts=[]}){
  const cands=[];
  if(html){try{cands.push(parseEMDoc(html,url))}catch(e){}}
  if(text.trim())cands.push(parseEMLines(text.split(/\r?\n/)));
  if(!cands.length)return null;
  const best=cands.slice().sort((a,b)=>(b.pairs.length+b.prices.length)-(a.pairs.length+a.prices.length))[0];
  for(const c of cands){if(!best.title&&c.title)best.title=c.title;if(!best.img&&c.img)best.img=c.img;if(!best.url&&c.url)best.url=c.url;if(!best.desc.length&&c.desc.length)best.desc=c.desc;if(!best.ident&&c.ident)best.ident=c.ident}
  if(best.pairs.length<3)return null;
  const u=url||best.url||((text+html).match(/https?:\/\/(?:www\.)?everymac\.com\/systems\/[^\s"'<>]+\.html/)||[])[0]||'';
  const r=mapEM(best,u);
  if(r.imageUrl&&parts.length){try{const pn=new URL(r.imageUrl).pathname;const pt=parts.find(x=>x.loc.endsWith(pn));if(pt)r.imageBlob=new Blob([b64bytes(pt.body)],{type:pt.ct})}catch(e){}}
  return r;
}
/* spiega perché il testo incollato non è stato riconosciuto */
function diagnose(txt,html){
  const t=txt||'',n=t.length,lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean);
  const has=re=>re.test(t)||re.test(html||'');
  let why;
  if(n<300&&!html)why='Il testo ricevuto è molto corto: probabilmente è stata copiata solo una parte della pagina. Usa «Seleziona tutto» prima di «Copia».';
  else if(has(/Complete [^\n]{3,80} Specs/)&&!has(/Introduction Date/))why='Sembra la pagina dei <b>risultati di ricerca</b>: tocca il modello giusto e copia la pagina di quel modello.';
  else if(!has(/Introduction Date/))why='Nel testo non c\'è la tabella delle specifiche («Introduction Date», «Processor Speed»…). Sul telefono EveryMac mostra le sezioni a fisarmonica: assicurati che «Tech Specs» sia aperta, poi Seleziona tutto → Copia.';
  else why='La tabella c\'è ma il formato è inatteso.';
  return `<div class="note"><b>Non ho trovato le specifiche.</b><br>${why}<br><br>Ricevuto: ${n.toLocaleString('it')} caratteri${html?' + HTML':''}, ${lines.length} righe. Inizio: «${esc(lines.slice(0,3).join(' / ').slice(0,140))}»<br><br>Il metodo più sicuro: in Chrome ⋮ → <b>⬇︎ Scarica</b> la pagina, poi «Carica pagina salvata».</div>`;
}
function previewHTML(r){
  const f=r.fields;
  const rows=[['Nome',f.nome],['Anno',f.anno],['Modello',f.modello],['EMC',f.emc],['Model ID',f.identifier],['Colore',f.colore],['CPU',f.cpu],['RAM',f.ram],['Storage',f.storage],['Display',f.display],['Prezzo',f.prezzo]].filter(x=>x[1]);
  const img=r.imageBlob?URL.createObjectURL(r.imageBlob):r.imageUrl;
  return `${img?`<img src="${esc(img)}" alt="" style="max-height:170px;max-width:100%;border-radius:12px;display:block;margin-bottom:10px" onerror="this.remove()">`:''}<div class="kv">${rows.map(([a,b])=>`<div>${a}</div><div>${a==='Colore'?`<i class="sw" style="--c:${esc(nameHex(b))};margin-right:6px"></i>`:''}${esc(b)}</div>`).join('')}</div><p class="note">${r.specs.length} specifiche trovate${f.descrizione?' + descrizione':''}${f.porte?' + porte':''}. Potrai controllarle e correggerle prima di salvare.</p><button class="btn" data-use style="width:100%">Usa questi dati</button>`;
}
function showPreview(out,r,onResult){out.innerHTML=previewHTML(r);$('[data-use]',out).onclick=()=>onResult(r)}

function openImport({onResult,replace=false,code=''}={}){
  const h=`<div class="note step"><b>1.</b> Apri la scheda del modello su EveryMac.
    <div class="row" style="margin-top:8px"><input class="in" id="ic" value="${esc(code)}" placeholder="A1278, EMC 2554, M5521…" autocomplete="off"><a class="btn sm" id="io" target="_blank" rel="noopener" href="${EM}/">Apri ↗</a></div></div>
  <div class="note step"><b>2.</b> Sulla pagina del modello copia tutto: <b>tieni premuto</b> su una parola → <b>Seleziona tutto</b> → <b>Copia</b>. Da computer: Ctrl+A, Ctrl+C. Va bene anche solo la tabella delle specifiche.<br><small>In alternativa: in Chrome ⋮ → ⬇︎ Scarica, poi «Carica pagina salvata» qui sotto (porta anche la foto).</small></div>
  <div class="note step"><b>3.</b> Incolla qui: l'app riconosce testo, HTML o link alla pagina.</div>
  <textarea class="in" id="pt" placeholder="Tieni premuto qui → Incolla" style="min-height:140px"></textarea>
  <div class="row" style="flex-wrap:wrap;margin:8px 0"><button class="btn sm sec" id="pc">📋 Incolla dagli appunti</button><button class="btn sm sec" id="pf">📄 Carica pagina salvata</button><button class="btn sm sec" id="px">✕ Svuota</button></div>
  <input type="file" id="pfi" hidden>
  <button class="btn" id="pa" style="width:100%">Analizza</button>
  <div id="po" style="margin-top:14px"></div>`;
  openPage('Incolla da EveryMac',h,{replace,mount(el){
    let html='',srcUrl='',parts=[];
    const ta=$('#pt',el),out=$('#po',el),ic=$('#ic',el);
    const updLink=()=>{const v=ic.value.trim();$('#io',el).href=v?`${EM}/ultimate-mac-lookup/?search_keywords=${encodeURIComponent(emKeyword(v))}`:EM+'/'};
    updLink();ic.oninput=updLink;
    const analyze=async()=>{
      const txt=ta.value.trim();
      if(!txt&&!html){out.innerHTML='';return}
      if(!html&&/^https?:\/\/(www\.)?everymac\.com\/\S+$/i.test(txt)){
        out.innerHTML=spin('Scarico la pagina…');
        try{html=await viaProxy(txt);srcUrl=txt}catch(e){out.innerHTML='<div class="note">Non riesco a scaricare la pagina (i proxy sono bloccati). Apri il link, copia il contenuto e incollalo qui.</div>';return}
      }
      let r=null;try{r=importEM({html,text:html?'':txt,url:srcUrl,parts})}catch(e){console.error(e)}
      if(!r&&html&&txt){try{r=importEM({text:txt})}catch(e){}}
      if(!r){out.innerHTML=diagnose(txt,html);return}
      showPreview(out,r,onResult);
      out.scrollIntoView({behavior:'smooth',block:'start'});
    };
    ta.addEventListener('paste',e=>{
      const cd=e.clipboardData;const hh=cd&&cd.getData('text/html');
      if(hh){e.preventDefault();html=hh;srcUrl='';parts=[];ta.value=cd.getData('text/plain')||domLines(new DOMParser().parseFromString(hh,'text/html').body).join('\n')}
      else{html=''}
      setTimeout(analyze,60);
    });
    let deb;ta.addEventListener('input',()=>{if(!ta.value.trim()){html='';parts=[];out.innerHTML='';return}clearTimeout(deb);deb=setTimeout(()=>{if(ta.value.trim().length>40)analyze()},700)});
    $('#pa',el).onclick=analyze;
    $('#px',el).onclick=()=>{ta.value='';html='';parts=[];srcUrl='';out.innerHTML='';ta.focus()};
    $('#pc',el).onclick=async()=>{
      try{
        html='';parts=[];srcUrl='';let txt='';
        if(navigator.clipboard.read){for(const it of await navigator.clipboard.read()){if(it.types.includes('text/html'))html=await (await it.getType('text/html')).text();if(it.types.includes('text/plain'))txt=await (await it.getType('text/plain')).text()}}
        else txt=await navigator.clipboard.readText();
        ta.value=txt||(html?domLines(new DOMParser().parseFromString(html,'text/html').body).join('\n'):'');
        if(!ta.value.trim()){toast('Gli appunti sono vuoti');return}
        analyze();
      }catch(e){toast('Accesso agli appunti negato: tieni premuto nel riquadro e scegli «Incolla»',4200);ta.focus()}
    };
    $('#pf',el).onclick=()=>$('#pfi',el).click();
    $('#pfi',el).onchange=async e=>{
      const f=e.target.files[0];if(!f)return;e.target.value='';
      const t=decodeBytes(new Uint8Array(await f.arrayBuffer()));const mh=parseMHTML(t);
      if(mh){html=mh.html;srcUrl=mh.url;parts=mh.parts}
      else if(/<(html|table|tr)[\s>]/i.test(t)){html=t;srcUrl='';parts=[]}
      else{html='';parts=[];srcUrl=''}
      ta.value=html?domLines(new DOMParser().parseFromString(html,'text/html').body).join('\n'):t;
      analyze();
    };
    setTimeout(()=>(code?ta:ic).focus(),250);
  }});
}

/* ============ Wikipedia / Commons (CORS aperto) ============ */
async function wjson(u){const r=await fetch(u,{signal:AbortSignal.timeout(15000)});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function wikiSearch(q,lang='en'){
  const j=await wjson(`https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&srlimit=8&format=json&origin=*`);
  return (j.query.search||[]).map(s=>({title:s.title,snippet:s.snippet.replace(/<[^>]+>/g,''),lang}));
}
function wclean(s){
  s=s.replace(/<ref[^>]*\/>/g,'').replace(/<ref[\s\S]*?<\/ref>/g,'').replace(/<!--[\s\S]*?-->/g,'')
   .replace(/<br\s*\/?>/gi,', ').replace(/<[^>]+>/g,'')
   .replace(/\{\{\s*(?:start date|release date|start-date|dts|date)[^|}]*\|(\d{4})(?:\|(\d{1,2}))?(?:\|(\d{1,2}))?[^}]*\}\}/gi,(m,y,mo,da)=>[y,mo,da].filter(Boolean).join('-'));
  for(let i=0;i<4;i++)s=s.replace(/\{\{(?:nowrap|nobr|small|abbr|convert|cvt|val|ubl|plainlist|flatlist|unbulleted list|hlist)\s*\|([^{}]*)\}\}/gi,(m,a)=>a.split('|').filter(x=>!/^\s*[a-z]+=/.test(x)).join(' ').trim());
  for(let i=0;i<4;i++)s=s.replace(/\{\{[^{}]*\}\}/g,'');
  return clean(s.replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,'$1').replace(/\[https?:\/\/\S+\s+([^\]]+)\]/g,'$1').replace(/'{2,}/g,'').replace(/^[*\s]+/,'').replace(/\s*\*\s*/g,'; '));
}
async function wikiLoad(title,lang,marca){
  const base=`https://${lang}.wikipedia.org/w/api.php`;
  const [a,b]=await Promise.all([
    wjson(`${base}?action=query&prop=extracts|pageimages|info&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=800&inprop=url&titles=${encodeURIComponent(title)}&format=json&origin=*`),
    wjson(`${base}?action=parse&page=${encodeURIComponent(title)}&prop=wikitext&section=0&format=json&origin=*`).catch(()=>null)
  ]);
  const pg=Object.values(a.query.pages)[0];
  const wt=b&&b.parse&&b.parse.wikitext?b.parse.wikitext['*']:'';
  const pairs=[];
  const lines=wt.split('\n');let cur=null;
  for(const ln of lines){
    const m=ln.match(/^\s*\|\s*([\w \-]+?)\s*=\s*(.*)$/);
    if(m){cur=[m[1].toLowerCase().trim(),m[2]];pairs.push(cur)}
    else if(cur&&ln.trim()&&!/^\s*(\}\}|\{\{)/.test(ln)&&!/^\s*\|/.test(ln)&&pairs.length<90)cur[1]+=' '+ln.trim();
    else if(/^\s*\}\}\s*$/.test(ln))cur=null;
  }
  const P={};const specs=[];
  for(const [k,v0] of pairs){const v=wclean(v0);if(!v||/^(image|caption|logo|alt|image_size|imagesize|image_upright|website|footnotes)/.test(k))continue;if(!(k in P)){P[k]=v;specs.push([k.replace(/[_-]/g,' ').replace(/^\w/,c=>c.toUpperCase()),v])}}
  const g=(...ks)=>{for(const k of ks)if(P[k])return P[k];return ''};
  const f={nome:g('name')||pg.title,marca:marca||g('manufacturer','developer','maker')||'',
    intro:g('released','release date','release_date','first release date','introduced','first_release_date','release'),
    discontinued:g('discontinued','last release date'),
    cpu:g('cpu','processor'),ram:g('memory','ram'),storage:g('storage','storage capacity'),
    gpu:g('graphics','gpu','video'),display:g('display','screen'),os_orig:g('os','operating system','operating_system'),
    connettivita:g('connectivity','networking'),batteria:g('battery','power'),dimensioni:g('dimensions'),peso:g('weight','mass'),
    prezzo:g('price','launch price','introductory price'),modello:g('model','model number'),linea:g('family','series','product family','product line'),
    colore:detectColor(g('color','colour','colors','colours'))};
  const my=(f.intro.match(/\b(19[5-9]\d|20[0-3]\d)\b/)||[''])[0];f.anno=my?+my:'';
  f.descrizione=pg.extract?pg.extract.split('\n')[0].slice(0,900):'';
  const ty=g('type','device type').toLowerCase()+' '+(pg.extract||'').slice(0,200).toLowerCase();
  f.tipologia=/television|tv set/.test(ty)?'Televisore CRT':/phone/.test(ty)?'Smartphone':/tablet/.test(ty)?'Tablet':/laptop|notebook/.test(ty)?'Portatile':/console/.test(ty)?'Console':/player|ipod/.test(ty)?'Lettore musicale':/camera/.test(ty)?'Fotocamera':/computer/.test(ty)?'Computer desktop':'';
  Object.keys(f).forEach(k=>{if(f[k]===''||f[k]==null)delete f[k]});
  return {fields:f,specs,imageUrl:pg.thumbnail?pg.thumbnail.source:'',fonte:pg.fullurl||`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(title)}`};
}
async function commonsSearch(q){
  const j=await wjson(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrsearch=${encodeURIComponent(q)}&gsrlimit=18&prop=imageinfo&iiprop=url|mime&iiurlwidth=640&format=json&origin=*`);
  return Object.values((j.query&&j.query.pages)||{}).filter(p=>p.imageinfo&&/image\/(jpeg|png|webp)/.test(p.imageinfo[0].mime)).map(p=>({thumb:p.imageinfo[0].thumburl,title:p.title}));
}
function openImageSearch(q,onPick){
  openPage('Cerca foto sul web',`<div class="row"><input class="in" id="iq" value="${esc(q)}"><button class="btn" id="ig">Cerca</button></div><div id="ir" style="margin-top:12px"></div>
  <p class="note">Risultati da Wikimedia Commons (immagini libere). Per altre fonti: <a id="gl" target="_blank" rel="noopener" href="#">cerca su Google Immagini</a>, salva la foto e aggiungila dalla Galleria.</p>`,{mount(el){
    const go=async()=>{
      const v=$('#iq',el).value.trim();$('#gl',el).href='https://www.google.com/search?tbm=isch&q='+encodeURIComponent(v);
      $('#ir',el).innerHTML=spin('Cerco…');
      try{const r=await commonsSearch(v);$('#ir',el).innerHTML=r.length?`<div class="cgrid">${r.map((x,i)=>`<img src="${esc(x.thumb)}" data-i="${i}" alt="${esc(x.title)}" loading="lazy">`).join('')}</div>`:'Nessuna immagine trovata. Prova con meno parole (es. solo il modello).';el._r=r}
      catch(e){$('#ir',el).textContent='Ricerca non riuscita: '+e.message}
    };
    $('#ig',el).onclick=go;$('#iq',el).onkeydown=e=>{if(e.key==='Enter')go()};go();
    el.addEventListener('click',e=>{const i=e.target.closest('img[data-i]');if(i){history.back();onPick(el._r[+i.dataset.i].thumb)}});
  }});
}
async function openDescPicker(q,cb){
  openPage('Descrizione da Wikipedia',`<div class="row"><input class="in" id="dq" value="${esc(q)}"><button class="btn" id="dg">Cerca</button></div><div id="dr" style="margin-top:12px"></div><p class="note">Testo introduttivo di Wikipedia (italiano, poi inglese). Puoi modificarlo dopo.</p>`,{mount(el){
    const out=$('#dr',el);let res=[];
    const go=async()=>{const v=$('#dq',el).value.trim();if(!v)return;out.innerHTML=spin('Cerco…');
      try{res=await wikiSearch(v,'it');res=res.concat(await wikiSearch(v,'en'));
        out.innerHTML=res.length?res.map((x,i)=>`<button class="res" data-i="${i}"><b>${esc(x.title)}</b> <small>${x.lang.toUpperCase()} · ${esc(x.snippet.slice(0,100))}</small></button>`).join(''):'Nessun risultato.'}
      catch(e){out.textContent='Errore di rete: '+e.message}};
    $('#dg',el).onclick=go;$('#dq',el).onkeydown=e=>{if(e.key==='Enter')go()};go();
    el.addEventListener('click',async e=>{const b=e.target.closest('[data-i]');if(!b)return;const x=res[+b.dataset.i];out.innerHTML=spin('Carico…');
      try{const j=await wjson(`https://${x.lang}.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&titles=${encodeURIComponent(x.title)}&format=json&origin=*`);
        const p=Object.values(j.query.pages)[0];const t=(p.extract||'').split('\n').filter(Boolean).slice(0,2).join('\n\n').slice(0,1200);
        history.back();cb(t+(t?`\n\n(Fonte: Wikipedia ${x.lang.toUpperCase()}, «${x.title}»)`:''))}
      catch(err){out.textContent='Errore: '+err.message}});
  }});
}

/* ============ ricerca online ============ */
function openLookup({prefill='',marca='Apple',onResult,replaceSelf}){
  const isApple=/^apple$/i.test(marca||'Apple');
  const h=`<div class="row"><select class="in" id="lb" style="width:auto"><option value="apple" ${isApple?'selected':''}>Apple</option><option value="altro" ${isApple?'':'selected'}>Altra marca</option></select><input class="in" id="lq" value="${esc(prefill)}" placeholder="A1278, EMC 2554, MacBookPro9,2" autocomplete="off"></div>
  <div class="row" style="margin-top:10px"><button class="btn" id="lg" style="flex:1">Cerca</button></div>
  <button class="res" id="lp" style="margin-top:12px"><b>📋 Incolla la scheda da EveryMac</b><small>Se la ricerca automatica non riesce a leggere EveryMac.</small></button>
  <div id="lo" style="margin-top:14px"></div>
  <p class="note" id="lh"></p>`;
  openPage('Cerca dati online',h,{replace:!!replaceSelf,mount(el){
    const hint=()=>{const ap=$('#lb',el).value==='apple';$('#lp',el).hidden=!ap;$('#lh',el).innerHTML=ap?'Apple: cerca su <b>EveryMac.com</b> per numero modello (<b>A1278</b>, <b>M5521</b>), <b>EMC</b> (4 cifre, es. 2554), Model ID o codice d\'ordine. Se non trovato, provo Wikipedia.':'Altre marche: scrivi marca e modello (es. <b>Commodore 64</b>, <b>Sony Trinitron KV-2900</b>). I dati arrivano da Wikipedia (scheda tecnica e foto).';$('#lq',el).placeholder=ap?'A1278, EMC 2554, MacBookPro9,2':'Marca e modello'};
    hint();$('#lb',el).onchange=hint;
    const out=$('#lo',el);
    const busy=m=>out.innerHTML=spin(m);
    const preview=r=>showPreview(out,r,onResult);
    const paste=()=>openImport({replace:true,code:$('#lq',el).value.trim(),onResult});
    $('#lp',el).onclick=paste;
    const wikiFlow=async(q,mc)=>{
      busy('Cerco su Wikipedia…');
      let res=await wikiSearch(q);
      if(!res.length)res=await wikiSearch(q,'it');
      if(!res.length){out.innerHTML='Nessun risultato.';return}
      out.innerHTML='<b>Scegli la pagina giusta:</b>'+res.map((x,i)=>`<button class="res" data-w="${i}"><b>${esc(x.title)}</b><small>${esc(x.snippet.slice(0,110))}</small></button>`).join('');
      out.onclick=async e=>{const b=e.target.closest('[data-w]');if(!b)return;const x=res[+b.dataset.w];busy('Carico la scheda…');try{preview(await wikiLoad(x.title,x.lang,mc))}catch(err){out.textContent='Errore: '+err.message}};
    };
    const go=async()=>{
      const q=$('#lq',el).value.trim();if(!q)return;
      out.onclick=null;
      const ap=$('#lb',el).value==='apple';
      if(!ap){try{await wikiFlow(q,'')}catch(e){out.textContent='Errore di rete: '+e.message}return}
      busy('Cerco su EveryMac…');
      try{
        const r=await emLookup(q);
        if(r.result)return preview(r.result);
        if(r.choices){
          out.innerHTML=`<b>${r.choices.length} modelli corrispondono – scegli:</b>`+r.choices.map((x,i)=>`<button class="res" data-c="${i}"><b>${esc(x.name)}</b></button>`).join('');
          out.onclick=async e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=r.choices[+b.dataset.c];busy('Carico le specifiche…');try{preview(finishEM(await viaProxy(c.href),c.href))}catch(err){out.innerHTML=`<p>Errore: ${esc(err.message)}</p><a class="btn sec sm" target="_blank" rel="noopener" href="${esc(c.href)}">Apri la pagina ↗</a> poi usa «Incolla la scheda».`}};
          return;
        }
        await wikiFlow('Apple '+q,'Apple');
      }catch(e){
        out.innerHTML=`<p><b>EveryMac non raggiungibile</b> (${esc(e.message)}).</p><p>Nessun problema: apri la pagina, copiala e incollala.</p><div class="row" style="flex-wrap:wrap"><a class="btn sec sm" target="_blank" rel="noopener" href="${EM}/ultimate-mac-lookup/?search_keywords=${encodeURIComponent(emKeyword(q))}">Apri su EveryMac ↗</a><button class="btn sm" id="lpp">📋 Incolla la scheda</button><button class="btn sec sm" id="lw">Prova Wikipedia</button></div>`;
        $('#lpp',el).onclick=paste;
        $('#lw',el).onclick=()=>wikiFlow('Apple '+q,'Apple').catch(er=>out.textContent='Errore: '+er.message);
      }
    };
    $('#lg',el).onclick=go;$('#lq',el).onkeydown=e=>{if(e.key==='Enter')go()};
    setTimeout(()=>$('#lq',el).focus(),250);
  }});
}
const KEEP=['descrizione','colore','colore_hex','luogo','note'];
async function mergeFetched(base,r,overwrite){
  const m=Object.assign({},base);
  for(const [k,v] of Object.entries(r.fields)){ if(v===''||v==null)continue; if(KEEP.includes(k)&&m[k])continue; if(overwrite||m[k]===undefined||m[k]==='')m[k]=v }
  if(r.specs&&r.specs.length){
    const have=new Map((m.specs||[]).map(p=>[p[0],p[1]]));
    r.specs.forEach(([l,v])=>{if(overwrite||!have.has(l))have.set(l,v)});
    m.specs=[...have];
  }
  if(r.fonte)m.fonte=r.fonte;
  if(trOn()&&m.descrizione&&m.descrizione===r.fields.descrizione&&isLongEn(m.descrizione)){

/* toglie lo sfondo uniforme partendo dai bordi (ottimo per foto prodotto su fondo chiaro) e ritaglia l'oggetto */
async function autoCut(src,tol=14){
  const bmp=await createImageBitmap(src instanceof Blob?src:await (await fetch(src)).blob());
  const k=Math.min(3,760/Math.max(bmp.width,bmp.height)),w=Math.max(1,Math.round(bmp.width*k)),h=Math.max(1,Math.round(bmp.height*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';x.drawImage(bmp,0,0,w,h);
  const D=x.getImageData(0,0,w,h),p=D.data;
  // colore di sfondo: mediana dei pixel del bordo
  const bord=[];for(let i=0;i<w;i+=2){bord.push(i,(h-1)*w+i)}for(let j=0;j<h;j+=2){bord.push(j*w,j*w+w-1)}
  const med=ch=>{const a=bord.map(i=>p[i*4+ch]).sort((m,n)=>m-n);return a[a.length>>1]};const bg=[med(0),med(1),med(2)];
  const dist=q=>Math.hypot(p[q]-bg[0],p[q+1]-bg[1],p[q+2]-bg[2]);
  const mark=new Uint8Array(w*h),st=[];const push=i=>{if(!mark[i]&&p[i*4+3]>0&&dist(i*4)<tol){mark[i]=1;st.push(i)}else if(!mark[i]&&p[i*4+3]===0){mark[i]=1;st.push(i)}};
  for(let i=0;i<w;i++){push(i);push((h-1)*w+i)}for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}
  while(st.length){const i=st.pop(),cx=i%w;if(cx>0)push(i-1);if(cx<w-1)push(i+1);if(i>=w)push(i-w);if(i<w*(h-1))push(i+w)}
  let rem=0,x0=w,y0=h,x1=-1,y1=-1;
  for(let i=0;i<w*h;i++){const q=i*4;if(mark[i]){p[q+3]=0;rem++;continue}
    const cx=i%w,cy=(i/w)|0;
    if((cx>0&&mark[i-1])||(cx<w-1&&mark[i+1])||(i>=w&&mark[i-w])||(i<w*(h-1)&&mark[i+w]))p[q+3]=Math.min(p[q+3],Math.round(255*Math.max(.2,Math.min(1,(dist(q)-tol)/(tol*1.4)))));
    if(cx<x0)x0=cx;if(cx>x1)x1=cx;if(cy<y0)y0=cy;if(cy>y1)y1=cy}
  if(x1<0)return {url:'',ratio:1};
  x.putImageData(D,0,0);
  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return {url:alphaURL(o),ratio:rem/(w*h)};
}
function alphaURL(cv){const u=cv.toDataURL('image/webp',.86);return u.startsWith('data:image/webp')?u:cv.toDataURL('image/png')}
/* immagine già scontornata (PNG del telefono): ridimensiona e ritaglia i bordi trasparenti */
async function importCutout(file){
  const bmp=await createImageBitmap(file);const k=Math.min(1,900/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0,c.width,c.height);
  const p=x.getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=-1,y1=-1,tr=0;
  for(let i=0;i<c.width*c.height;i++){if(p[i*4+3]<16){tr++;continue}const cx=i%c.width,cy=(i/c.width)|0;if(cx<x0)x0=cx;if(cx>x1)x1=cx;if(cy<y0)y0=cy;if(cy>y1)y1=cy}

  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return alphaURL(o);
}
const CUTS=new Map();
/* immagine per il museo: scontorno salvato, altrimenti automatico se riesce, altrimenti foto in cornice */

    addEventListener('deviceorientation',this.h)},
  off(){if(--this.n>0)return;this.n=0;removeEventListener('deviceorientation',this.h);const h=document.documentElement;h.classList.remove('tilting');h.style.removeProperty('--ry');h.style.removeProperty('--rx')}};

function catalogHTML(list,o){
  const cmp=(a,b)=>String(a||'').localeCompare(String(b||''),'it',{numeric:true,sensitivity:'base'});
  const secOf=d=>o.sort==='anno'?(d.anno?Math.floor(d.anno/10)*10+'s':'Senza anno'):o.sort==='nome'?'':(d[o.sort]||'Non indicato');
  list.sort((a,b)=>o.sort==='anno'?((a.anno||9999)-(b.anno||9999))||cmp(a.nome,b.nome):cmp(secOf(a),secOf(b))||cmp(a.nome,b.nome));
  const yrs=list.map(d=>d.anno).filter(Boolean);
  let h=`<section class="pc"><h1>RDDC</h1><h2>${esc(o.title)}</h2><p>${list.length} ${o.w==='wish'?'oggetti desiderati':'oggetti'}${yrs.length?` · dal ${Math.min(...yrs)} al ${Math.max(...yrs)}`:''}</p><p>Aggiornato al ${fmtD(today())}</p></section>`;
  if(o.idx)h+=`<section class="pidx"><div class="sec">Indice</div><table><tr><th>Nome</th><th>Anno</th><th>Marca</th><th>Tipologia</th><th>${o.w==='wish'?'Priorità':'Luogo'}</th></tr>${list.map(d=>`<tr><td>${esc(d.nome)}</td><td>${d.anno||''}</td><td>${esc(d.marca||'')}</td><td>${esc(d.tipologia||'')}</td><td>${esc((o.w==='wish'?d.w_priorita:d.luogo)||'')}</td></tr>`).join('')}</table></section>`;
  let cur=null;
  for(const d of list){
    const s=secOf(d);if(s&&s!==cur){cur=s;h+=`<div class="sec">${esc(s)}</div>`}
    const ph=(d.foto&&d.foto[0])||d.thumb;
    const rows=[['Tipologia',d.tipologia],['Modello',[d.modello,d.emc&&'EMC '+d.emc,d.identifier].filter(Boolean).join(' · ')],...(o.dati?keyTiles(d):[]),['Colore',d.colore],['Quantità',+d.quantita>1?d.quantita:''],
      ...(d.wish?[['Priorità',d.w_priorita],['Budget',o.eur&&d.w_budget?'€ '+d.w_budget:''],['Note ricerca',d.w_note]]:[['Luogo',d.luogo],['Stato',d.stato],['Scatola',d.scatola],['Condizione',d.condizione],['Acquistato',[d.acq_anno,o.eur&&d.acq_prezzo?'€ '+d.acq_prezzo:''].filter(Boolean).join(' · ')],['Valore stimato',o.eur&&d.valore?'€ '+d.valore:'']]),
      ...(o.int&&(d.interventi||[]).length?[['Interventi',d.interventi.slice().sort((a,b)=>String(a.data).localeCompare(b.data)).map(i=>`${fmtD(i.data)}: ${i.tipo||''}${i.desc?' – '+i.desc:''}`).join('; ')]]:[])].filter(r=>r[1]);
    const desc=o.desc&&d.descrizione?d.descrizione.split(/\n\s*\n/)[0].slice(0,650):'';
    h+=`<article class="pe">${o.foto?(ph?`<img src="${ph}" alt="">`:`<div class="noimg">${icon(d)}</div>`):''}<div style="${o.foto?'':'grid-column:1/-1'}"><div class="ps">${esc([d.marca,d.linea&&d.linea!==d.marca?d.linea:'',d.anno].filter(Boolean).join(' · '))}</div><h3>${esc(d.nome)}</h3><dl>${rows.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl>${desc?`<div class="pd">${esc(desc)}${d.descrizione.length>desc.length?'…':''}</div>`:''}</div></article>`;
  }
  return h;
}

  for(const d of arr){
    if(!d||!d.nome)continue;
    d.id=d.id||hashId([d.nome,d.modello,d.seriale,d.wish?'w':''].join('|'));
    if(del.has(d.id)&&(d.modificato||0)<=del.get(d.id))continue;
    const i=devices.findIndex(x=>x.id===d.id);
    if(i<0)nuovi++;else if((d.modificato||0)>(devices[i].modificato||0))agg++;else continue;
    await localizePhotos(d,fetchPhoto);
    idx(d);await DB.put(d);const k=devices.findIndex(x=>x.id===d.id);k<0?devices.push(d):devices[k]=d;
  }
  return {nuovi,agg,canc};
}
/* ---- GitHub con token (lettura e scrittura) ---- */
function guessRepo(){const m=location.hostname.match(/^([\w-]+)\.github\.io$/i);const seg=location.pathname.split('/').filter(Boolean)[0];return m&&seg&&!/\.\w+$/.test(seg)?m[1]+'/'+seg:''}
function ghCfg(){const r=LS.get('rd_gh',{});return {token:(r.token||'').trim(),repo:(r.repo||guessRepo()).trim(),branch:(r.branch||'main').trim()}}
function ghOn(){const c=ghCfg();return !!(c.token&&/^[\w.-]+\/[\w.-]+$/.test(c.repo))}
async function gh(path,{method='GET',body,raw}={}){
  const c=ghCfg();
  const r=await fetch(`https://api.github.com/repos/${c.repo}${path?'/'+path:''}`,{method,cache:'no-store',headers:{Authorization:'Bearer '+c.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}const er=new Error(r.status===401?'token non valido o scaduto':r.status===403?'il token non ha il permesso «Contents: Read and write»':r.status===404?'repository non trovato (o token senza accesso)':`GitHub ${r.status}${m?': '+m:''}`);er.status=r.status;throw er}
  return raw?r:r.json();
}
let syncing=null;
function ghSync(manual){
  if(syncing)return syncing;
  syncing=(async()=>{
    const t0=Date.now(),c=ghCfg();updSync('run');
    try{
      let res={nuovi:0,agg:0,canc:0},inviati=0,nfoto=0,n=0;
      for(let attempt=0;;attempt++){
        const head=(await gh(`git/ref/heads/${c.branch}`)).object.sha;
        const treeSha=(await gh(`git/commits/${head}`)).tree.sha;
        const tree=await gh(`git/trees/${treeSha}?recursive=1`);
        const tmap=new Map(tree.tree.filter(x=>x.type==='blob').map(x=>[x.path,x.sha]));
        let remote={},arr=[];
        if(tmap.has('collezione.json')){remote=JSON.parse(await (await gh(`git/blobs/${tmap.get('collezione.json')}`,{raw:true})).text());arr=Array.isArray(remote)?remote:(remote.devices||[])}
        const fetchPhoto=async p=>{const sha=tmap.get(p.replace(/^\.\//,''));if(!sha)throw new Error('foto mancante');return (await gh(`git/blobs/${sha}`,{raw:true})).blob()};
        const r=await mergeRemote(arr.map(x=>JSON.parse(JSON.stringify(x))),tombsOf(remote),fetchPhoto);res.nuovi+=r.nuovi;res.agg+=r.agg;res.canc+=r.canc;
        if(r.nuovi||r.agg||r.canc)render();
        // contenuto da inviare: foto come file separati (nome = impronta SHA-1, così ognuna si carica una volta sola)
        const files=new Map();
        const conv=async(u,dir='foto',nm='')=>{if(typeof u!=='string'||!u.startsWith('data:'))return u;const [meta,b64]=u.split(',');const ext=/image\/png/.test(meta)?'png':/image\/webp/.test(meta)?'webp':/image\/jpe?g/.test(meta)?'jpg':((nm.match(/\.(\w{1,5})$/)||[])[1]||'bin').toLowerCase();const path=`${dir}/${await sha1hex(b64bytes(b64))}.${ext}`;if(!tmap.has(path))files.set(path,b64);return path};
        const out=[];for(const d of devices){const o=Object.fromEntries(Object.entries(d).filter(([k])=>k[0]!=='_'));if(Array.isArray(o.foto))o.foto=await Promise.all(o.foto.map(conv));if(o.thumb)o.thumb=await conv(o.thumb);if(o.scontorno)o.scontorno=await conv(o.scontorno);if(Array.isArray(o.allegati))o.allegati=await Promise.all(o.allegati.map(async a=>Object.assign({},a,{data:await conv(a.data,'allegati',a.nome)})));out.push(o)}
        out.sort((a,b)=>String(a.id).localeCompare(b.id));
        const elim=[...deletedMap()].map(([id,t])=>({id,t})).sort((a,b)=>a.id.localeCompare(b.id));
        const remSorted=arr.slice().sort((a,b)=>String(a.id).localeCompare(b.id));
        const remElim=[...tombsOf(remote)].map(([id,t])=>({id,t})).sort((a,b)=>a.id.localeCompare(b.id));
        n=out.length;
        if(!files.size&&tmap.has('collezione.json')&&JSON.stringify(remSorted)===JSON.stringify(out)&&JSON.stringify(remElim)===JSON.stringify(elim))break;
        const entries=[];
        for(const [path,b64] of files)entries.push({path,mode:'100644',type:'blob',sha:(await gh('git/blobs',{method:'POST',body:{content:b64,encoding:'base64'}})).sha});
        const body={app:'rddc',v:4,esportato:Date.now(),devices:out,eliminati:elim};
        entries.push({path:'collezione.json',mode:'100644',type:'blob',sha:(await gh('git/blobs',{method:'POST',body:{content:JSON.stringify(body),encoding:'utf-8'}})).sha});
        const nt=await gh('git/trees',{method:'POST',body:{base_tree:treeSha,tree:entries}});
        const nc=await gh('git/commits',{method:'POST',body:{message:`RDDC: sincronizzazione (${out.length} oggetti${files.size?`, ${files.size} file nuovi`:''})`,tree:nt.sha,parents:[head]}});
        try{await gh(`git/refs/heads/${c.branch}`,{method:'PATCH',body:{sha:nc.sha,force:false}})}
        catch(e){if((e.status===422||e.status===409)&&attempt<3)continue;throw e}
        inviati=out.length;nfoto=files.size;break;
      }
      if(LS.get('rd_dirty',0)<=t0)LS.set('rd_dirty',0);
      LS.set('rd_db_last',{t:Date.now(),n,...res,inviati,foto:nfoto});LS.set('rd_db_sig','');
      updSync();
      if(res.nuovi||res.agg||res.canc)toast(`GitHub: ricevuti ${res.nuovi} nuovi, ${res.agg} aggiornati${res.canc?', '+res.canc+' eliminati':''}`,3500);
      else if(manual)toast(inviati?`Inviato a GitHub ✔︎${nfoto?' ('+nfoto+(nfoto===1?' file':' file')+')':''}`:'Già tutto sincronizzato ✔︎');
    }catch(e){updSync('err');if(manual)toast('Sincronizzazione non riuscita: '+e.message,5000);else console.warn('sync',e)}
    finally{syncing=null}
  })();
  return syncing;
}
function hashId(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return 'db-'+(h>>>0).toString(36)}
async function syncDB(manual){
  let j;
  try{
    const r=await fetch(new URL(dbUrl(),location.href),{cache:'no-cache'});
    if(r.status===404){if(manual)toast('Nessun database su GitHub: carica prima «collezione.json» nel repository',4200);return}
    if(!r.ok)throw new Error('HTTP '+r.status);
    j=await r.json();
  }catch(e){if(manual)toast('Database non raggiungibile: '+e.message,4000);return}
  const arr=Array.isArray(j)?j:j&&j.devices;
  if(!Array.isArray(arr)){if(manual)toast('Il file del database non è valido');return}
  const sig=[j.esportato||'',arr.length,arr.reduce((m,d)=>Math.max(m,(d&&(d.modificato||d.creato))||0),0),(j.eliminati||[]).length].join('|');
  if(!manual&&sig===LS.get('rd_db_sig',''))return;
  const base=new URL(dbUrl(),location.href);
  const {nuovi,agg,canc}=await mergeRemote(arr,tombsOf(j),async p=>{const r=await fetch(new URL(p,base));if(!r.ok)throw new Error('HTTP '+r.status);return r.blob()});
  LS.set('rd_db_sig',sig);LS.set('rd_db_last',{t:Date.now(),n:arr.length,nuovi,agg,canc});
  if(nuovi||agg||canc){render();toast(`Database GitHub: ${nuovi} nuovi, ${agg} aggiornati${canc?', '+canc+' eliminati':''}`,3500)}
  else if(manual)toast('Già tutto aggiornato ✔︎');
}

/* pressione lunga su un elemento della lista → anteprima (stile 3D Touch) */
let lp=null,lpSwallow=0;
$('#list').addEventListener('pointerdown',e=>{const c=e.target.closest('[data-id]');if(!c||e.button>0)return;
  c.classList.add('pressing');lp={c,x:e.clientX,y:e.clientY,t:setTimeout(()=>{lp.fired=true;c.classList.remove('pressing');try{navigator.vibrate&&navigator.vibrate(12)}catch(er){}openPeek(c.dataset.id,c)},480)}});
const lpEnd=ev=>{if(!lp)return;clearTimeout(lp.t);lp.c.classList.remove('pressing');if(lp.fired&&ev&&ev.type==='pointerup')lpSwallow=Date.now()+600;lp=null};
$('#list').addEventListener('pointermove',e=>{if(lp&&!lp.fired&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>10)lpEnd()});
['pointerup','pointercancel'].forEach(t=>addEventListener(t,lpEnd));

async function delWithUndo(d){await DB.del(d.id);markDeleted(d.id);devices=devices.filter(x=>x.id!==d.id);render();dirty();
  toast(`Eliminato «${d.nome}»`,7000,{label:'ANNULLA',fn:async()=>{unmarkDeleted(d.id);idx(d);await DB.put(d);devices.push(d);render();dirty();toast('Ripristinato')}})}
function openPeek(id,src){
  const d=devices.find(x=>x.id===id);if(!d||document.querySelector('.peek'))return;
  const ph=(d.foto&&d.foto[0])||'',tl=keyTiles(d).slice(0,4),sub=[d.marca,d.linea&&d.linea!==d.marca?d.linea:'',d.anno].filter(Boolean).join(' · ');
  const chips=[d.prestito&&(d.prestito.tipo==='Esposizione'?'🖼️ ':'📤 ')+(d.prestito.a||'fuori casa'),...(d.tags||[]).map(t=>'#'+t),missing(d).length&&'✎ da completare',linkedTo(d)&&'↳ '+linkedTo(d).nome,d.colore,d.luogo&&'📍 '+d.luogo,d.stato,d.wish&&d.w_priorita&&'★ '+d.w_priorita,d.wish&&d.w_budget&&'≤ € '+d.w_budget,+d.quantita>1&&'×'+d.quantita].filter(Boolean);
  const desc=(d.descrizione||'').split(/\n\s*\n/)[0];
  const canMu=!d.wish&&kindOf(d.tipologia)!=='acc';
  const m=document.createElement('div');m.className='peek';
  m.innerHTML=`<div class="pk-card"><div class="pk-hero ${ph?'':'noph'}">${ph?`<img src="${ph}" alt="">`:icon(d)}<div class="pk-cap">${sub?`<small>${esc(sub)}</small>`:''}<b>${esc(d.nome)}</b></div></div>
    <div class="pk-body">${chips.length?`<div class="chips">${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>`:''}${tl.length?`<div class="pk-tiles">${tl.map(([a,b])=>`<div><small>${esc(a)}</small><span>${esc(b)}</span></div>`).join('')}</div>`:''}${desc?`<p>${esc(desc.length>170?desc.slice(0,170)+'…':desc)}</p>`:''}</div></div>
    <div class="pk-acts"><button data-pk="open">Apri la scheda<i>›</i></button><button data-pk="edit">Modifica<i>✎</i></button>${canMu?'<button data-pk="mu">Sul piedistallo<i>🏛️</i></button>':''}<button data-pk="del" class="dng">Elimina<i>🗑</i></button></div>`;
  const r=src.getBoundingClientRect();m.style.setProperty('--ox',Math.round(r.left+r.width/2-(innerWidth-Math.min(innerWidth*.92,380))/2)+'px');m.style.setProperty('--oy','30%');
  document.body.append(m);requestAnimationFrame(()=>requestAnimationFrame(()=>m.classList.add('on')));
  history.pushState({p:stack.length,pk:1},'');
  let closed=false;
  const hide=()=>{closed=true;m.classList.remove('on');m.classList.add('off');setTimeout(()=>m.remove(),260)};
  const onPop=()=>{removeEventListener('popstate',onPop);if(!closed)hide()};addEventListener('popstate',onPop);
  const close=()=>new Promise(res=>{if(closed)return res();hide();const f=()=>{removeEventListener('popstate',f);res()};addEventListener('popstate',f);history.back()});
  m.addEventListener('click',async e=>{const b=e.target.closest('[data-pk]');
    if(!b){if(!e.target.closest('.pk-card'))close();else{await close();openDetail(d.id)}return}
    const a=b.dataset.pk;await close();
    if(a==='open')openDetail(d.id);
    if(a==='edit')openForm(d);
    if(a==='mu')vt('vt-pl',()=>openPlinth([d],0,false));
    if(a==='del'&&await ask(`Eliminare "${d.nome}"?`,'Elimina',true))delWithUndo(d);
  });
}

  if(e.target.closest('#loanB')){S.sel.fuori=['In prestito','In esposizione'];render();scrollTo(0,0);return}const c=e.target.closest('[data-id]');if(c)openDetail(c.dataset.id)});

$('#sum').addEventListener('click',e=>{if(e.target.closest('#syncS')){ghSync(true);return}if(e.target.closest('[data-inc]')){S.sel.completezza=['Da completare'];render();return}const b=e.target.closest('[data-rm]');if(!b)return;const a=S.sel[b.dataset.rm]||[];S.sel[b.dataset.rm]=a.filter(x=>x!==b.dataset.v);render()});
(async()=>{
  await DB.open();

  if(/[?&]condividi=1/.test(location.search)){history.replaceState({p:0},'',location.pathname);readShared().then(r=>{if(r.files.length||r.meta.url||r.meta.text)openShared(r);else toast('Niente da aggiungere')}).catch(()=>toast('Condivisione non riuscita'))}

    Promise.resolve(ghOn()?ghSync(false):LS.get('rd_db_auto',true)?syncDB(false):0).finally(()=>setTimeout(autoTranslate,1500));
    document.addEventListener('visibilitychange',()=>{if(!ghOn())return;if(document.visibilityState==='hidden'&&LS.get('rd_dirty',0))ghSync(false);if(document.visibilityState==='visible'&&!syncing)ghSync(false)});
  }
  if('serviceWorker' in navigator&&location.protocol!=='file:'){

  }
})();

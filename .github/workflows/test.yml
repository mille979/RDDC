name: Prove automatiche
on:
  pull_request:
    paths: ['index.html', 'sw.js', 'manifest.webmanifest', 'tests/**', 'package.json', '.github/workflows/test.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
